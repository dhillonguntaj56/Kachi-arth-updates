/* v1.1.6: live mirror status for Settings — last successful push time, or the
   last error. Desktop app only; the review/phone page has no bridge. */
function refreshLiveStatus(){
  const el = document.getElementById('live-status');
  if(!el) return;
  try{
    if(!(window.kachiAPI && kachiAPI.liveStatus)){ el.textContent = '—'; return; }
    kachiAPI.liveStatus().then(st => {
      const t = document.getElementById('live-status');
      if(!t) return;
      if(st && st.lastPush){
        const d = new Date(st.lastPush);
        t.innerHTML = '<span style="color:var(--green)">✅ ' + esc(d.toLocaleDateString()) + ' ' + esc(d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})) + '</span>';
      } else if(st && st.lastError){
        t.innerHTML = '<span style="color:var(--red)">⚠️ ' + esc(String(st.lastError).slice(0, 60)) + '</span>';
      } else {
        t.innerHTML = '<span class="muted">⏳ ਪਹਿਲਾ ਪੁਸ਼ ਬਾਕੀ · first push pending</span>';
      }
      /* v1.1.7: father's encrypted mirror push status */
      const fm = document.getElementById('fmirror-status');
      if(fm){
        if(st && st.mirrorLastPush){
          const d = new Date(st.mirrorLastPush);
          fm.innerHTML = '<span style="color:var(--green)">✅ ' + esc(d.toLocaleDateString()) + ' ' + esc(d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})) + '</span>';
        } else if(st && st.mirrorLastError){
          fm.innerHTML = '<span style="color:var(--red)">⚠️ ' + esc(String(st.mirrorLastError).slice(0, 60)) + '</span>';
        } else {
          fm.innerHTML = '<span class="muted">⏳ ਪਹਿਲਾ ਪੁਸ਼ ਬਾਕੀ · first push pending</span>';
        }
      }
    }).catch(() => {});
  }catch(e){}
}
/* Professional PIN setup — dedicated saver, NOT part of settings auto-save.
   Deliberately bypasses the day-lock guard: PIN setup is security
   administration, not a transaction, so a locked day can never deadlock it.
   - No PIN set yet: new + confirm must match (4 digits) → saved.
   - PIN set: current must match stored, then new + confirm must match.
   Every set/change is audit-logged. */
function saveMunimPin(){
  const cur = $('#pin_cur'), nw = $('#pin_new'), cf = $('#pin_cfm');
  const newPin = (nw && nw.value || '').trim(), cfmPin = (cf && cf.value || '').trim();
  const stored = String(S().munimPin || '');
  const ok4 = p => /^\d{4}$/.test(p);
  if(stored){
    const curPin = (cur && cur.value || '').trim();
    if(curPin !== stored){ msgAlert('⛔ ਮੌਜੂਦਾ PIN ਗਲਤ ਹੈ · Current PIN is wrong'); return; }
  }
  if(!ok4(newPin)){ msgAlert('⚠️ PIN 4 ਅੰਕਾਂ ਦਾ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ · PIN must be 4 digits'); return; }
  if(newPin !== cfmPin){ msgAlert('⛔ ਦੋਵੇਂ PIN ਮਿਲਦੇ ਨਹੀਂ · PINs do not match — ਦੁਬਾਰਾ ਲਿਖੋ · re-enter'); return; }
  S().munimPin = newPin;
  audit(stored ? '🔐 ਮੁਨੀਮ PIN ਬਦਲਿਆ · Munim PIN changed' : '🔐 ਮੁਨੀਮ PIN ਦਰਜ · Munim PIN set', '');
  save();
  msgAlert('✅ PIN ' + (stored ? 'ਬਦਲ ਗਿਆ · changed' : 'ਦਰਜ ਹੋ ਗਿਆ · saved'));
  renderSettings();
}
/* audit trail: shown only on demand, behind the View button */
function auditTableHtml(){
  /* Q23: voided heaps/expenses stay visible HERE as crossed-out rows — the
     working registers hide them entirely */
  const vHeaps = DB.heaps.filter(h => h.voided)
    .sort((a, b) => String(b.voidedAt || b.date) < String(a.voidedAt || a.date) ? -1 : 1);
  const vExp = DB.expenses.filter(e => e.voided).sort((a, b) => (a.date < b.date ? 1 : -1));
  const vRows = vHeaps.map(h =>
    '<tr class="voided-row"><td>🚫 ਢੇਰ #' + h.n + ' · ' + esc(h.crop || '') + ' · ' + esc((farmer(h.farmerId) || {}).name || '') + '</td>' +
    '<td><span class="en">' + (h.voidedAt ? dstr(h.voidedAt.slice(0, 10)) : dstr(h.date)) + ' · voided</span></td></tr>').join('') +
    vExp.map(e => {
      const lbl = e.type === 'bank' ? '🏦 ਬੈਂਕ ਤੋਂ ਨਕਦ · Cash from bank'
        : e.type === 'tobank' ? '🏦 ਬੈਂਕ ਵਿੱਚ ਜਮ੍ਹਾਂ · Deposited to bank'
        : (e.note || (e.cat ? expCatLabel(e.cat) : 'ਆਮਦਨ · Income'));
      return '<tr class="voided-row"><td>↩️ ' + esc(lbl) + '</td>' +
        '<td class="num">' + fmt(e.amount || 0) + '<br><span class="en">' + dstr(e.date) + ' · voided</span></td></tr>';
    }).join('');
  return '<div class="tblwrap"><table>' +
    (DB.audit.slice(-30).reverse().map(e =>
      '<tr><td><span class="en">' + dstr(e.ts.slice(0,10)) + ' ' + e.ts.slice(11,16) + '</span><br>' + esc(e.action) + '</td><td>' + esc(e.detail) + '</td></tr>'

    '</table></div>';
}

/* Settings auto-save: every input persists on change — type a value, press
   enter or move on, and it is stored. Same sanity ranges as the old Save flow;
   an invalid value reverts with a warning. No audit entry per keystroke. */
function autoSaveSettings(){
  if(isLocked(todayStr())){ lockAlert(); renderSettings(); return; }

async function mirrorDeriveKey(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode('kachi-mirror-v1'), iterations: 600000, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function mirrorDecrypt(encB64, pw){
  const raw = Uint8Array.from(atob(encB64), c => c.charCodeAt(0));
  const iv = raw.slice(0, 12), data = raw.slice(12);
  const key = await mirrorDeriveKey(pw);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, data);
  return new TextDecoder().decode(pt);
}
async function mirrorPoll(){

      const f = await r.json();
      if(f && f.v === 1 && f.enc){

}

/* Deep backup validation (pure function — returns a list of problems, empty = ok).

/* strict calendar check: plain Date.parse normalizes 2026-02-30 into March,
   so round-trip the components — a financial record must name a real day */
function isDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if(!m) return false;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3];
}
function validateBackup(imp){
  const errs = [];
  const idSet = {};
  /* P1.11: every money/stock collection gets id + shape checks */
  ['farmers','buyers','suppliers','heaps','txns','parchis','audit','expenses','recovery','bardana'].forEach(k => {
    idSet[k] = new Set();
    (imp[k] || []).forEach(x => {
      if(idSet[k].has(x.id)) errs.push(k + ': ਦੁਹਰੀ id · duplicate id ' + x.id);
      idSet[k].add(x.id);
    });
  });
  /* dates use the shared top-level isDate() strict check */
  const moneyOk = v => { const n = v == null ? 0 : v; return typeof n === 'number' && isFinite(n) && n >= 0; };
  const KNOWN_STATUS = ['arrived','sold','weighed','lifted'];
  const KNOWN_KIND = ['udhar','vasuli','vyaaj','payment','parchi','receipt','carry'];
  if(imp.settings && imp.settings.sample) errs.push('sample data is not allowed');
  (imp.farmers || []).forEach(f => {
    if(!(typeof f.name === 'string' && f.name.trim())) errs.push('ਕਿਸਾਨ · farmer #' + f.id + ': name required');
    if(f.interestRate != null && (!(Number(f.interestRate) > 0) || !isFinite(Number(f.interestRate)))) errs.push('ਕਿਸਾਨ · farmer #' + f.id + ': bad interest rate');
  });
  (imp.buyers || []).forEach(b => { if(!(typeof b.name === 'string' && b.name.trim())) errs.push('ਵਪਾਰੀ · buyer #' + b.id + ': name required'); });
  (imp.suppliers || []).forEach(x => { if(!(typeof x.name === 'string' && x.name.trim())) errs.push('ਦੁਕਾਨ · supplier #' + x.id + ': name required'); });
  /* P1.11: heap register numbers are unique — two heaps with the same n
     would confuse the munim at the kanda */
  const heapN = new Set();
  (imp.heaps || []).forEach(h => {
    if(h.n != null){ if(heapN.has(h.n)) errs.push('ਢੇਰ · heap: ਦੁਹਰੀ ਨੰ · duplicate n ' + h.n); heapN.add(h.n); }
  });
  (imp.heaps || []).forEach(h => {
    const tag = 'ਢੇਰ · heap #' + (h.n != null ? h.n : h.id);
    if(h.farmerId != null && h.farmerId !== 0 && !idSet.farmers.has(h.farmerId)) errs.push(tag + ': unknown farmer');
    if(h.buyerId != null && h.buyerId !== 0 && !idSet.buyers.has(h.buyerId)) errs.push(tag + ': unknown buyer');
    if(!KNOWN_STATUS.includes(h.status)) errs.push(tag + ': bad status');
    if(!isDate(h.date)) errs.push(tag + ': bad date');
    if(!(typeof h.crop === 'string' && h.crop.trim())) errs.push(tag + ': crop required');
    ['estWt','actWt','rate'].forEach(f => { if(!moneyOk(h[f])) errs.push(tag + ': negative ' + f); });
    if(['sold','weighed','lifted'].includes(h.status) && (!(h.buyerId > 0) || !(h.rate > 0))) errs.push(tag + ': auction details incomplete');
    if(['weighed','lifted'].includes(h.status) && !(h.actWt > 0)) errs.push(tag + ': weighment incomplete');
    /* P1.11: I-form serial, when assigned, is a positive integer */
    if(h.iSerial != null && !(Number.isInteger(h.iSerial) && h.iSerial >= 1)) errs.push(tag + ': bad iSerial');
    /* P1.11: J-form voucher shape — the voucher is informational, but a
       corrupted shape would crash the comparison panel */
    if(h.jform != null){
      if(typeof h.jform !== 'object') errs.push(tag + ': bad jform');
      else {
        if(!(typeof h.jform.no === 'string' && h.jform.no.trim())) errs.push(tag + ': jform missing number');
        if(h.jform.auctionDate != null && h.jform.auctionDate !== '' && !isDate(h.jform.auctionDate)) errs.push(tag + ': jform bad date');
        if(!moneyOk(h.jform.weight) || !moneyOk(h.jform.rate) || !moneyOk(h.jform.total)) errs.push(tag + ': jform negative figures');
      }
    }
  });
  (imp.txns || []).forEach(t => {
    const tag = 'ਲੈਣ-ਦੇਣ · txn #' + t.id;
    const coll = t.ptype === 'farmer' ? 'farmers' : t.ptype === 'buyer' ? 'buyers' : t.ptype === 'supplier' ? 'suppliers' : null;
    if(!coll) errs.push(tag + ': bad ptype');
    else if(!idSet[coll].has(t.pid)) errs.push(tag + ': unknown party');
    if(!KNOWN_KIND.includes(t.kind)) errs.push(tag + ': bad kind');
    if(!isDate(t.date)) errs.push(tag + ': bad date');
    if(!moneyOk(t.debit) || !moneyOk(t.credit)) errs.push(tag + ': negative amount');
    /* P1.11: vyaaj postings carry their covered period — a flipped or
       dateless range would break the overlap guard */
    if(t.kind === 'vyaaj'){
      if(t.iFrom != null && !isDate(t.iFrom)) errs.push(tag + ': vyaaj bad iFrom');
      if(t.iTo != null && !isDate(t.iTo)) errs.push(tag + ': vyaaj bad iTo');
      if(isDate(t.iFrom) && isDate(t.iTo) && t.iFrom > t.iTo) errs.push(tag + ': vyaaj iFrom after iTo');
    }
    /* the app's invariant: every txn carries exactly one positive side, on the
       side natural to its kind — a both-sides or wrong-side txn can only come
       from a tampered backup and would corrupt the khata if imported */
    const dd = t.debit || 0, cc = t.credit || 0;
    if(!((t.kind === 'carry' && dd === 0 && cc === 0) || (dd > 0 && !(cc > 0)) || (cc > 0 && !(dd > 0)))) errs.push(tag + ': debit/credit must have exactly one side');
    else {
      const debitKinds = ['udhar','vyaaj','payment','parchi','carry'], creditKinds = ['vasuli','receipt','carry'];
      if((dd > 0 && !debitKinds.includes(t.kind)) || (cc > 0 && !creditKinds.includes(t.kind)))
        errs.push(tag + ': amount on wrong side for kind ' + t.kind);
    }
    if(t.ptype === 'farmer' && !['udhar','vasuli','vyaaj','payment','parchi','carry'].includes(t.kind))
      errs.push(tag + ': kind not for farmer');
    if(t.ptype === 'buyer' && !['receipt','carry'].includes(t.kind))
      errs.push(tag + ': kind not for buyer');
    /* P1.11: supplier (shop) txns are shop-payments only — a corrupted kind
       would leak into the Daily book or ledgers */
    if(t.ptype === 'supplier' && t.kind !== 'payment')
      errs.push(tag + ': kind not for supplier');
    if(t.ref != null && !idSet.parchis.has(t.ref)) errs.push(tag + ': bad parchi ref');
  });
  (imp.parchis || []).forEach(p => {
    const tag = 'ਪਰਚੀ · slip #' + p.id;
    if(!idSet.farmers.has(p.farmerId)) errs.push(tag + ': unknown farmer');
    if(p.supplierId != null && !idSet.suppliers.has(p.supplierId)) errs.push(tag + ': unknown shop');
    if(!moneyOk(p.amount)) errs.push(tag + ': negative amount');
    if(!isDate(p.date)) errs.push(tag + ': bad date');
  });
  /* P1.11: expenses, recovery and bardana are money/stock records too */
  (imp.expenses || []).forEach(x => {
    const tag = 'ਖਰਚਾ · expense #' + x.id;
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!moneyOk(x.amount) || !(x.amount > 0)) errs.push(tag + ': bad amount');
  });
  (imp.recovery || []).forEach(x => {
    const tag = 'ਰਿਕਵਰੀ · recovery #' + x.id;
    const coll = x.ptype === 'farmer' ? 'farmers' : x.ptype === 'buyer' ? 'buyers' : null;
    if(!coll) errs.push(tag + ': bad ptype');
    else if(!idSet[coll].has(x.pid)) errs.push(tag + ': unknown party');
    if(x.nextDate != null && x.nextDate !== '' && !isDate(x.nextDate)) errs.push(tag + ': bad nextDate');
    if(x.created != null && x.created !== '' && !isDate(x.created)) errs.push(tag + ': bad created date');
  });
  (imp.bardana || []).forEach(x => {
    const tag = 'ਬਰਦਾਨਾ · bardana #' + x.id;
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!['purchase','issue','return','agency','agencyback'].includes(x.kind)) errs.push(tag + ': bad kind');
    if(!(x.qty > 0) || !Number.isInteger(x.qty)) errs.push(tag + ': bad qty');
  });
  /* Batch B #3: agency dues ledger (old format) — each entry references agency buyer + heaps */
  (imp.claims || []).forEach(x => {
    const tag = 'ਸਰਕਾਰੀ ਬਕਾਇਆ · govt dues #' + (x.n != null ? x.n : x.id);
    if(!(x.n > 0) || !Number.isInteger(x.n)) errs.push(tag + ': bad n');
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!['submitted','acknowledged','paid'].includes(x.status)) errs.push(tag + ': bad status');
    if(!idSet.buyers.has(x.agencyId)) errs.push(tag + ': unknown agency');
    if(!Array.isArray(x.heapIds) || !x.heapIds.length) errs.push(tag + ': bad heapIds');
    else x.heapIds.forEach(hid => { if(!idSet.heaps.has(hid)) errs.push(tag + ': unknown heap ' + hid); });
    if(!moneyOk(x.comm) || !moneyOk(x.charges)) errs.push(tag + ': negative figures');
    if(x.txnId != null && !idSet.txns.has(x.txnId)) errs.push(tag + ': unknown receipt txn');
  });
  (imp.heaps || []).forEach(h => {
    if(h.claimId != null && !(imp.claims || []).some(c => c.id === h.claimId)) errs.push('ਢੇਰ · heap #' + h.n + ': unknown govt dues entry');
  });
  ['damiPct','mandiFeePct','rdfPct','gstPct'].forEach(f => {
    const v = imp.settings && imp.settings[f];
    if(v != null && (typeof v !== 'number' || !(v >= 0 && v <= 100))) errs.push('settings: bad ' + f);
  });
  return errs;
}

function applyBackupJson(jsonStr, sourceName){
  let imp = null;
  try { imp = JSON.parse(jsonStr); }
  catch(e){ msgAlert('ਫਾਈਲ ਠੀਕ ਨਹੀਂ · Bad file — ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ · nothing was changed'); return false; }
  /* validate before touching the live DB: a bad backup must not wipe data.
     Every collection must be an array of objects with numeric ids. */
  const COLLS = ['farmers','buyers','suppliers','heaps','txns','parchis','audit','expenses','recovery','bardana','claims'];
  const shapeOk = imp && typeof imp === 'object' && imp.settings && typeof imp.settings === 'object' &&
    COLLS.every(k => Array.isArray(imp[k]) && imp[k].every(x => x && typeof x === 'object' && typeof x.id === 'number'));
  if(!shapeOk){
    msgAlert('ਬੈਕਅੱਪ ਫਾਈਲ ਠੀਕ ਨਹੀਂ · Invalid backup file — ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ · nothing was changed'); return false;
  }
  if(imp.settings.sample){
    msgAlert('ਨਮੂਨਾ ਬੈਕਅੱਪ ਨਹੀਂ ਖੁੱਲ੍ਹ ਸਕਦਾ · Sample backups are not accepted — ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ · nothing was changed'); return false;
  }
  /* deep validation: a structurally-valid but financially-corrupt backup
     must not load — check cross-references, negative money, bad dates,
     bad statuses, duplicate ids, and broken parchi links. */
  const deepErrs = validateBackup(imp);
  if(deepErrs.length){
    msgAlert('ਬੈਕਅੱਪ ਵਿੱਚ ਗਲਤੀਆਂ · Backup has problems — ਕੁਝ ਨਹੀਂ ਬਦਲਿਆ · nothing was changed\n' +
      deepErrs.slice(0, 5).join('\n') + (deepErrs.length > 5 ? '\n…+' + (deepErrs.length - 5) + ' ਹੋਰ · more' : ''));
    return false;
  }
  /* P0 #10: exported/cloud payloads strip secrets — if the incoming books
     carry no cloud token, keep the one already pasted on this device */
  const keepToken = (DB && DB.settings && DB.settings.cloudToken) || '';
  if(DB && !(DB.settings && DB.settings.sample)) saveAutoSnapshot(JSON.stringify(DB));
  DB = imp;
  ensureSettings();
  if(keepToken && !DB.settings.cloudToken) DB.settings.cloudToken = keepToken;
  backfillDb(); /* same migration as load(): missing arrays/counters backfilled */
  DB.audit.push({id:DB.seq.audit++, ts:new Date().toISOString(), action:'⬆️ ਬੈਕਅੱਪ · Backup imported', detail:String(sourceName || '')});
  saveNow(); msgAlert('ਬੈਕਅੱਪ ਲੱਗ ਗਿਆ · Imported'); location.reload();
  return true;
}

  const f = el.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { applyBackupJson(r.result, f.name); };
  r.readAsText(f);
}

/* Whole-rupee amount -> English words, Indian numbering (thousand/lakh/crore). */
function numToWords(n){
  n = Math.round(Number(n) || 0);
  if(n === 0) return 'Zero';
  if(n < 0) return 'Minus ' + numToWords(-n);
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two = x => x < 20 ? ones[x] : tens[Math.floor(x / 10)] + (x % 10 ? ' ' + ones[x % 10] : '');
  const three = x => { const h = Math.floor(x / 100), r = x % 100; return (h ? ones[h] + ' Hundred' + (r ? ' ' : '') : '') + (r ? two(r) : ''); };
  let out = '';
  const parts = [[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']];
  for(const [v, w] of parts){
    if(n >= v){ const q = Math.floor(n / v); out += (out ? ' ' : '') + (v >= 1e5 ? two(q) : three(q)) + ' ' + w; n %= v; }
  }
  if(n) out += (out ? ' ' : '') + three(n);
  return out;
}

  ['utilities','💡 ਬਿਜਲੀ/ਪਾਣੀ · Utilities'],['repairs','🔧 ਮੁਰੰਮਤ · Repairs'],

  /* opening balances are ledger positions carried from the paper khata, not

  if(t.opening) return 0;
  /* direct buyer→farmer payments bypass the drawer entirely — the firm never holds that cash */

function expCashSigned(e){

  /* 'tobank' (🏦 ਬੈਂਕ ਵਿੱਚ ਜਮ੍ਹਾਂ · Deposited to bank): surplus cash leaves

    if(!liveT(t)) return;

      (t.ptype === 'farmer' ? farmer(t.pid).name : t.ptype === 'buyer' ? buyer(t.pid).name : supplier(t.pid).name) || '—';
    const sub = SLIP_KIND[t.kind] || t.kind; /* Q30: no payment-mode tag — every cash-book row is cash-mode, so "· ਨਕਦ" is pure clutter */
    const rec = {label:(c > 0 ? '💰 ' : '💵 ') + who, sub, amt:Math.abs(c)};

function openExpenseForm(cashOnly){

  openModal(cashOnly ? '＋ ਰੋਕੜ ਐਂਟਰੀ · New entry' : '＋ ਖਰਚਾ · Add expense',

    '<div id="e_costrow">' + F('ਖਰਚਾ ਜਾਂ ਨਿੱਜੀ · Cost or personal',
      '<label style="display:block;padding:6px 0"><input type="radio" name="e_cost" value="cost"' + (cashOnly ? '' : ' checked') + ' onchange="expCostToggle()"> ਖਰਚਾ · Business cost <span class="en">— P&amp;L ਵਿੱਚ · hits P&amp;L</span></label>' +
      '<label style="display:block;padding:6px 0"><input type="radio" name="e_cost" value="personal"' + (cashOnly ? ' checked' : '') + ' onchange="expCostToggle()"> ਨਿੱਜੀ · Personal <span class="en">— ਸਿਰਫ਼ ਨਕਦ ਹਿੱਲੇਗਾ · cash moves only</span></label>') + '</div>' +

    F('ਨੋਟ · Note', IN('e_note', '', 'text')),
    'ਸੇਵ · Save', () => {
      const amt = vn('e_amt'); if(!(amt > 0)){ msgAlert('ਰਕਮ ਜ਼ਰੂਰੀ · Amount required'); return false; }
      const ed = v('e_date') || d; if(isLocked(ed)) return lockAlert();
      const mp = cashOnly ? {mode:'cash', note:''} : modePick('e_mode'); if(!mp) return false;
      const type = cashOnly ? v('e_type') : 'out';
      const person = (type === 'out' || type === 'in') ? v('e_person') : '';
      const personal = type === 'out' && ((document.querySelector('input[name=e_cost]:checked') || {}).value === 'personal');
      const cat = (type === 'out' && !personal) ? v('e_cat') : '';
      if(type === 'out' && !personal && !cat){ msgAlert('ਕਿਸਮ ਚੁਣੋ · Select a category'); return false; }
      const note = v('e_note');
      if(cat === 'other' && !note){ msgAlert('"ਹੋਰ" ਲਈ ਨੋਟ ਲਿਖੋ · Note required for Other'); return false; }
      const rec = {id:DB.seq.expense++, date:ed, type, cat, amount:amt, mode:mp.mode, modeNote:mp.note, note, person, personal};
      const doSaveExp = () => {
        if(guardStore()) return;

        if((type === 'out' || type === 'tobank') && isCashMode(mp.mode)){ cashGuard(ed, amt, doSaveExp); return; }
        doSaveExp();
      });
      return false;
    });
  expTypeToggle(); expCostToggle();
}

function delExpense(id){
  const e = DB.expenses.find(x => x.id === id);

     entry is posted (the old confirm text lied about this) and nothing
     is deleted. Re-enter a corrected entry afterwards. */

/* ---------------- today's summary ----------------
   Cash in = today's buyer ਉਗਰਾਹੀ + farmer ਵਸੂਲੀ; cash out = today's farmer ਭੁਗਤਾਨ.
   (No separate cash book exists yet, so the summary derives cash from ledger entries.) */
function todayStats(){
  const t = todayStr();
  const hs = DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.date === t);
  let vasuli = 0, farmerPay = 0, buyerColl = 0;
  DB.txns.filter(x => inActiveSeason(x) && x.date === t && isCashMode(x.mode)).forEach(x => {
    /* v1.1.3: skip dead txns — voided entries are not cash movement */
    if(!liveT(x)) return;
    const c = txnCashSigned(x);
    if(x.ptype === 'farmer' && x.kind === 'vasuli' && c > 0) vasuli += c;
    else if(x.ptype === 'farmer' && x.kind === 'payment' && c < 0) farmerPay += -c;
    else if(x.ptype === 'buyer' && x.kind === 'receipt' && c > 0) buyerColl += c;
  });
  /* cashIn/cashOut are the full drawer movement — same source as the rokad, so the tiles always reconcile */
  const cb = cashbookData(t);
  return { t, arrivals:hs.length,
    queue:DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.status === 'sold').length,
    liftPending:DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.status === 'weighed').length,
    vasuli, farmerPay, buyerColl,
    cashIn:cb.sumIn, cashOut:cb.sumOut, heapList:hs };
}
/* Home: today's summary + reminders together in one card.
   Replaces the old ⚡ ਮੁੱਖ ਕੰਮ quick-action row (New heap / Dami report
   buttons removed). Summary renders inline. */
/* Official J/I form serials: consumed ONLY on real issuance (print or download),
   from the form's own book counter, then frozen on the heap forever.
   A preview that is abandoned must never leave a gap in the numbered book. */
function assignFormSerial(h, kind){
  /* v1.4.0: the official J-form is printed only from the government portal —
     the app issues no J serials. The firm's own Sale Memo needs no serial. */
  const hk = 'iSerial';
  if(!h[hk]){
    const ck = 'nextSerialI';
    if(!(S()[ck] >= 1)) S()[ck] = 1;
    /* Batch C: duplicate guard — if the munim manually set "Next I Serial"
       to a number already issued, skip to max+1 instead of duplicating. */
    const used = new Set(DB.heaps.filter(x => x.id !== h.id && x[hk] >= 1).map(x => x[hk]));
    while(used.has(S()[ck])) S()[ck]++;
    h[hk] = S()[ck]++;
    /* P1.4: freeze the I-form book number with the serial — later Settings
       changes must not rewrite an issued I-form */
    h.bookNoI = S().bookNoI || '';
    save();
  }
  return h[hk];
}

/* FORM I — "Bill of Kacha Arhtiya" [See Rule 24(12), 24(13), 16-F(2)(ix)]
   (Punjab Govt. Gazette Extra, January 15, 2020).
   Official Punjab government layout, pure English, field-for-field.
   All money uses the per-heap feeSnap snapshot, never live Settings.

/* I-form rebuilt to the REAL paper FORM 'I' (Guntaj's spec, Batch C M14–M17):
   header with M.L. No. + phones + serial, I Form Particulars box, Kacha
   Arhtiya box, BUYER box, "Commodity Purchase Record" (6 rows),

   Arhtiya. Correct spelling "Kacha Arhtiya" throughout. NO PAN, NO bank,

function buildIDoc(hid, issue, stamp){
  const h = DB.heaps.find(x => x.id === hid);

/* ---------------- batch printing ----------------
   Heap register: tick heaps, pick a document type, print/download them all
   as one combined document. Patti is per farmer (one settlement per farmer). */
function batchSelected(){
  return [...document.querySelectorAll('.batch-sel')].filter(c => c.checked).map(c => +c.value)
    .map(id => DB.heaps.find(h => h.id === id)).filter(h => h && (h.status === 'weighed' || h.status === 'lifted'));
}
function batchDocs(withStamp){
  const hs = batchSelected();
  if(!hs.length){ msgAlert('ਪਹਿਲਾਂ ਢੇਰ ਚੁਣੋ · Select heaps first'); return null; }
  const type = $('#batch-type') ? $('#batch-type').value : 'j';
  const parts = [];
  if(type === 'patti'){
    [...new Set(hs.map(h => h.farmerId))]
      .filter(fid => settleData(fid).hs.length)
      .forEach(fid => { const d = buildHisaabDoc(fid); parts.push(d.html); });
  } else {
    hs.forEach(h => {
      /* Batch A C6: 'j' = sale memo (firm's own document), 'i' = I-form.
         Never issue I-forms when the munim asked for a sale memo. */
      const d = type === 'j' ? buildSaleMemoDoc(h.id, withStamp) : buildIDoc(h.id, true, withStamp);
      if(d) parts.push(d.html);
    });
  }
  if(!parts.length){ msgAlert('ਕੋਈ ਦਸਤਾਵੇਜ਼ ਨਹੀਂ · No documents'); return null; }
  const html = parts.join('<div style="page-break-before:always"></div>');
  return {title:'ਚੁਣੇ ਦਸਤਾਵੇਜ਼ · Selected documents (' + hs.length + ')', html:html, filename:'batch-' + type + '-' + todayStr() + '.pdf'};
}
/* Guntaj's rule: one farmer's heaps → stamp dialog; many farmers → direct print, no stamp. */
function batchPrint(){
  const hs = batchSelected();
  if(!hs.length){ msgAlert('ਪਹਿਲਾਂ ਢੇਰ ਚੁਣੋ · Select heaps first'); return; }
  const farmers = [...new Set(hs.map(h => h.farmerId))];
  if(farmers.length === 1) showBatchStampDialog(hs);
  else { const d = batchDocs(false); if(d) printView(d.title, d.html, d.filename); }
}

function toggleParchiPaid(id){
  const p = DB.parchis.find(x => x.id === id);
  if(!p || p.voided) return;
  if(guardLedger(p.date, p.farmerId)) return; /* B7: paid/unpaid flips change money state */
  if(p.paid){
    /* un-mark: void the linked shop-payment entry (P0 #3 \u2014 never delete).
       A5: the parchi's paid flag flips ONLY inside the void's confirm
       callback, after the void succeeds \u2014 doVoidTxn un-marks the slip
       there. Answering "No" to the void now leaves the slip exactly as it
       was: still paid, payment still posted. */
    if(p.payTxnId) voidTxn(p.payTxnId, {after:() => {
      audit('\u2197 \u0a2a\u0a30\u0a1a\u0a40 \u0a2c\u0a3e\u0a15\u0a40 \u00b7 Slip marked unpaid', farmer(p.farmerId).name + ' \u00b7 ' + fmt(p.amount));
      save(); renderFarmers();
    }});
    else { p.paid = false; p.payTxnId = null; save(); renderFarmers(); }
    return;
  }
  if(guardStore()) return;
  openModal('\ud83d\udcb5 \u0a26\u0a41\u0a15\u0a3e\u0a28 \u0a28\u0a42\u0a70 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u00b7 Pay the shop \u2014 ' + esc(supplier(p.supplierId).name),
    '<p>' + esc(farmer(p.farmerId).name) + ' \u00b7 \u0a2a\u0a30\u0a1a\u0a40 #' + p.id + ' \u00b7 <b>' + fmt(p.amount || 0) + '</b></p>' +
    F('\u0a2e\u0a3f\u0a24\u0a40 \u00b7 Date', IN('pp_date', p.date || todayStr(), 'date')) +
    F('\u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u0a26\u0a3e \u0a24\u0a30\u0a40\u0a15\u0a3e \u00b7 Payment mode *', MODE_SEL('pp_mode')),
    '\u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u0a2a\u0a71\u0a15\u0a3e \u00b7 Confirm payment', () => {
      const pd = v('pp_date') || p.date || todayStr();
      const mp = modePick('pp_mode'); if(!mp) return false;
      const doPay = () => {
        const t = postShopPayment(id, pd, mp.mode, mp.note);
        if(!t) return false;
        closeModal(); renderFarmers(); showTxnSlip(t);
      };
      if(isCashMode(mp.mode)) cashGuard(pd, p.amount || 0, doPay); else doPay();
      return false;
    });
}

/* ================================================================
   P0 #9: marking a slip paid posts a REAL shop-payment entry
   (ptype 'supplier', kind 'payment', debit) with a mandatory payment
   mode \u2014 never just a flag flip. Un-marking voids that entry.
   ================================================================ */
function postShopPayment(pid, date, mode, modeNote){
  /* testable core: posts the supplier payment + flags the slip. Returns the txn. */
  if(guardStore()) return null;
  const p = DB.parchis.find(x => x.id === pid);
  if(!p || p.voided || p.paid) return null;
  if(isLocked(date)) return lockAlert();
  const sname = supplier(p.supplierId).name || '\u0a26\u0a41\u0a15\u0a3e\u0a28 \u00b7 Shop';
  const t = { id:DB.seq.txn++, date:date, ptype:'supplier', pid:p.supplierId || 0, kind:'payment',
    debit:p.amount || 0, credit:0, mode:mode, modeNote:modeNote || '',
    note:'\U0001F3EA \u0a26\u0a41\u0a15\u0a3e\u0a28 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u00b7 Shop paid \u2014 ' + sname + ' (\u0a2a\u0a30\u0a1a\u0a40 #' + p.id + ')',
    slipPayId:p.id, partySnap:{name:sname} };
  DB.txns.push(t);
  p.paid = true; p.payTxnId = t.id;
  audit('\ud83d\udcb5 \u0a26\u0a41\u0a15\u0a3e\u0a28 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u00b7 Shop paid', sname + ' \u00b7 ' + fmt(p.amount || 0) + ' \u00b7 ' + modeLabel(mode, modeNote));
  save();
  return t;
}
function buildParchiDoc(){

    '<h3>ਦੁਕਾਨ ਮੁਤਾਬਕ ਜੋੜ \u00b7 Totals by shop</h3><table>' +
    shopTotals.map(x => '<tr><td>' + esc(x.name) + '</td><td class="num"><b>' + fmt(x.total) + '</b></td></tr>').join('') +
    '<tr><td><b>ਕੁੱਲ \u00b7 Total</b></td><td class="num"><b>' + fmt(tot) + '</b></td></tr></table>' + signRow();
  return {title:'ਪਰਚੀ \u00b7 Input slips (Unpaid)', html:html, filename:'parchi-unpaid-' + todayStr() + '.pdf'};

      const fid = parseInt(v('f_fid'),10), sid = parseInt(v('f_sid'),10), items = v('f_items');
      if(!(fid > 0)){ msgAlert('ਕਿਸਾਨ ਚੁਣੋ · Choose a farmer'); return false; }
      if(guardSeasonClosed(fid)) return false;
      const doSave = () => {
        if(guardStore()) return;
        if(typeof farmerSeasonLocked === 'function' && farmerSeasonLocked(fid)) return;
        const pid = DB.seq.parchi++;
        /* v1.1.3 (Q18): the slip is a SHOP due record only — {shop, farmer,
           amount} so the firm knows what it owes each shop. No recovered
           tracking: on the farmer's side this is just an advance. */
        DB.parchis.push(seasonRecord({id:pid, date:d, farmerId:fid,
          supplierId:sid, amount:a, items:items, signed:$('#f_signed').checked, paid:false}));
        /* the slip is a debit on the farmer's khata, like an advance */
        DB.txns.push(seasonRecord({id:DB.seq.txn++, date:d, ptype:'farmer', pid:fid, kind:'parchi', debit:a, credit:0, ref:pid,
          note:'🧾 ਪਰਚੀ · Slip — ' + supplier(sid).name + (items ? ' · ' + items : ''),
          partySnap:{name:farmer(fid).name || '—'}})); /* P1.2: freeze farmer name at posting */
        if(typeof autoRecalcInterest === 'function') autoRecalcInterest(fid, d);
        audit('🧾 ਪਰਚੀ · Slip', farmer(fid).name + ' · ' + supplier(sid).name + ' · ' + fmt(a) + ' · ਕਿਸਾਨ ਖਾਤੇ ਵਿੱਚ ਡੈਬਿਟ · posted to farmer ledger');
        save(); closeModal(); go('farmers', {type:'farmer', id:fid, tab:parchiBackTab}); /* item #10 */
        showParchiSlip(pid); /* slip receipt preview right after issuing */
      };
      ensureFarmerSeason(fid, () => futureWarn(d, () => {
        const dup = DB.parchis.some(p => inActiveSeason(p) && p.farmerId === fid && p.supplierId === sid && p.amount === a && p.date === d);
        if(dup){ confirmDup('ਇਹ ਪਰਚੀ ਅੱਜ ਪਹਿਲਾਂ ਹੀ ਦਰਜ ਹੈ · This slip was already recorded today', doSave); return; }
        doSave();
      }));
      return false;
    });
}
</script>
