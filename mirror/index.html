async function mirrorDoLogin(){
  const id = ((document.getElementById('m_id') || {}).value || '').trim().toLowerCase();
  const pw = ((document.getElementById('m_pw') || {}).value || '');
  if(id !== MIRROR_LOGIN_ID.toLowerCase() || !pw){ mirrorLoginScreen('⚠️ Wrong ID or password.'); return; }
  mirrorSetPill('⏳', 'Connecting…');
  let enc = null, wasOffline = false;
  if(navigator.onLine){
    try{
      const r = await fetch(MIRROR_API, { cache:'no-store' });
      if(r.status === 404){ mirrorLoginScreen('📡 No data yet — the laptop syncs after install.'); return; }
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const f = await r.json();
      if(!f || f.v !== 1 || !f.enc) throw new Error('bad file');
      enc = f.enc;
      try{ localStorage.setItem('kachiMirrorEncCache', enc); }catch(e){}
    }catch(e){
      wasOffline = true;
      try{ enc = localStorage.getItem('kachiMirrorEncCache'); }catch(e2){}
      if(!enc){ mirrorLoginScreen('⚠️ No connection — connect once to load.'); return; }
    }
  } else {
    wasOffline = true;
    try{ enc = localStorage.getItem('kachiMirrorEncCache'); }catch(e){}
    if(!enc){ mirrorLoginScreen('⚠️ No connection and no saved copy yet.'); return; }
  }
  let pt;
  try{ pt = await mirrorDecrypt(enc, pw); }
  catch(e){ mirrorLoginScreen('⚠️ Wrong ID or password.'); return; }
  let wrap;
  try{
    wrap = JSON.parse(pt);
    if(!wrap || !wrap.db || !wrap.db.settings || !Array.isArray(wrap.db.farmers)) throw new Error('bad payload');
  }catch(e){ mirrorLoginScreen('⚠️ Data error — please try again.'); return; }
  mirrorSessionPw = pw; /* memory only — never persisted */
  mirrorApply(wrap, wasOffline);
}
function mirrorForgot(){
  mirrorLoginScreen('📧 Ask Guntaj — a new password will come to his email.');
}
async function mirrorDeriveKey(pw){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode('kachi-mirror-v1'), iterations: 600000, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
}
async function mirrorDecrypt(encB64, pw){
  const raw = Uint8Array.from(atob(encB64), c => c.charCodeAt(0));
  const iv = raw.slice(0, 12), data = raw.slice(12);
  const key = await mirrorDeriveKey(pw);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:iv }, key, data);
  return new TextDecoder().decode(pt);
}
async function mirrorPoll(){
  if(mirrorPolling || !navigator.onLine || !mirrorSessionPw) return;
  mirrorPolling = true;
  try{
    const r = await fetch(MIRROR_API, { cache:'no-store' });
    if(r.ok){
      const f = await r.json();
      if(f && f.v === 1 && f.enc){
        try{ localStorage.setItem('kachiMirrorEncCache', f.enc); }catch(e){}
        const pt = await mirrorDecrypt(f.enc, mirrorSessionPw);
        const wrap = JSON.parse(pt);
        if(wrap && wrap.db && wrap.pushedAt && wrap.pushedAt !== mirrorPushedAt){
          mirrorHasNew = true; mirrorPendingWrap = wrap;
          mirrorPushedAt = wrap.pushedAt; mirrorOffline = false;
          updateMirrorPill();
        } else { mirrorOffline = false; updateMirrorPill(); }
      }
    }
  }catch(e){}
  mirrorPolling = false;
}
function mirrorPill(){
  if(document.getElementById('mirror-pill')) return;
  const d = document.createElement('div');
  d.id = 'mirror-pill';
  d.style.cssText = 'position:fixed;bottom:86px;right:12px;z-index:9999;background:#17351f;color:#fff;padding:8px 14px;border-radius:22px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.3);max-width:70vw';
  d.onclick = () => { if(mirrorHasNew && mirrorPendingWrap){ const w = mirrorPendingWrap; mirrorApply(w, false); } };
  document.body.appendChild(d);
}
function mirrorSetPill(icon, text){ const p = document.getElementById('mirror-pill'); if(p) p.textContent = icon + ' ' + text; }
function mirrorAgo(iso){
  if(!iso) return '';
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if(m < 1) return 'ਹੁਣੇ · just now';
  if(m < 60) return m + ' ਮਿੰਟ · ' + m + 'm ago';
  const h = Math.round(m / 60);
  return h < 24 ? h + ' ਘੰਟੇ · ' + h + 'h ago' : Math.round(h / 24) + ' ਦਿਨ · ' + Math.round(h / 24) + 'd ago';
}
function updateMirrorPill(){
  const p = document.getElementById('mirror-pill'); if(!p) return;
  if(mirrorHasNew){ p.textContent = '🔄 ਨਵਾਂ ਡੇਟਾ · New data — tap to refresh'; p.style.background = '#7a5b00'; return; }
  p.style.background = '#17351f';
  if(mirrorOffline){ p.textContent = '⚪ ਆਫ਼ਲਾਈਨ · Offline — copy from ' + mirrorAgo(mirrorPushedAt); }
  else if(mirrorPushedAt){ p.textContent = '🟢 ਲਾਈਵ · Live — synced ' + mirrorAgo(mirrorPushedAt); }
}
function mirrorApply(wrap, offline){
  DB = wrap.db;
  try{ if(typeof backfillDb === 'function') backfillDb(); }catch(e){}
  try{ if(typeof ensureSettings === 'function') ensureSettings(); }catch(e){}
  mirrorPushedAt = wrap.pushedAt || null;
  mirrorOffline = !!offline;
  mirrorHasNew = false; mirrorPendingWrap = null;
  const tb = document.getElementById('tabs'); if(tb) tb.style.display = '';
  const sl = document.getElementById('statusline'); if(sl) sl.style.display = '';
  const sb = document.getElementById('season-badge'); if(sb) sb.textContent = seasonLabel();
  const hd = document.getElementById('hdr-date'); if(hd) hd.textContent = dstrPa(todayStr());
  const da = document.getElementById('data-asof'); if(da) da.textContent = 'Data as of ' + (mirrorPushedAt ? fmtDateTime(mirrorPushedAt) : '—');
  go(CUR.view || 'home', CUR.arg);
  updateMirrorPill();
}
mirrorBoot();
