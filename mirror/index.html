.appbar h1{margin:0; font-size:1.5rem; letter-spacing:.02em;}
.appbar h1{text-shadow:0 1px 4px rgba(0,0,0,.55);}
.appbar .season-badge{text-shadow:0 1px 3px rgba(0,0,0,.5);}
.appbar h1 .byline{display:block; font-size:.68rem; color:#c9a227; letter-spacing:.06em; margin-top:1px;}
.season-badge{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4);
  padding:6px 14px; border-radius:20px; font-size:.85rem; white-space:nowrap;
  color:#fff; cursor:pointer; min-height:44px; font-family:inherit; display:inline-flex; align-items:center; gap:6px;}
.season-badge .badge-chev{color:var(--saffron); font-weight:800; font-size:1rem; line-height:1;}
/* today's date under the season badge, top-right (#1) */
.hdr-date{margin-top:5px; font-size:.78rem; opacity:.85; text-align:right; white-space:nowrap;}

.tabs{display:flex; background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:64px; z-index:19; overflow-x:auto;}
.tabs button{flex:1 0 auto; min-width:86px; border:0; background:none; padding:8px 4px;
  font-size:1.25rem; cursor:pointer; color:var(--mut); border-bottom:3px solid transparent;
  font-family:inherit;}
.tabs button span{font-size:.82rem; display:block; margin-top:2px;}
.tabs button.active{color:var(--green-d); border-bottom-color:var(--saffron); font-weight:700;}

#screen{padding:20px 24px 90px; max-width:1080px; margin:0 auto;}

/* v1.3 #11: iPhone-style settings sections — gray headings, centered column on wide screens */
.set-wrap{max-width:760px;margin:0 auto;}
.set-sect{font-size:.82rem;color:#6e6e73;text-transform:uppercase;letter-spacing:.03em;padding:20px 4px 6px;font-weight:600;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.06);}
.card h2{margin:0 0 10px; font-size:1.1rem;}
.card h3{margin:12px 0 8px; font-size:1rem;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
/* master-detail: the list stays visible next to the open khata (#14) */
.vahi-ic{width:18px;height:18px;vertical-align:-4px;margin-right:5px;border-radius:3px;}
.grid3{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
/* compact numeric settings: small content-sized boxes in a tight grid (#15) */
.numgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px;}
.settlement-total,.settlement-working{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 12px;font-size:1.05rem;background:#eef7f0;border-radius:10px;margin:10px 0;}
.addition-block{margin:10px 0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;}
.addition-block h3{margin:0 0 8px;}
.settle-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
.settle-line:last-child{border-bottom:0}.settle-line.dues{font-weight:800;font-size:1.02rem;}
.settlement-working{background:#fff7e6;font-weight:800;flex-wrap:wrap;}
.fixed-settings{margin:14px 0;padding:12px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);}
.numgrid .field{margin-bottom:10px;}
.numgrid .field label{font-size:.85rem; line-height:1.35;}
.numgrid .field input,.numgrid .field select{padding:10px 8px; font-size:.95rem;}
.numgrid .field .hint{font-size:.75rem; margin-top:4px; display:none;}
.numgrid .field:focus-within .hint{display:block;}
@media(max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;}
  .tabs button{min-width:0;padding:7px 2px;font-size:1.05rem;}
  .tabs button span{font-size:.65rem;line-height:1.1;}
}
/* v1.1.4 #2: collapsible sidebar navigation — icon-only collapse gives wide
   tables the full width. The main header stays on top; a slim contextual
   sub-header strip under it carries one key figure per section. */
#shell{display:flex; align-items:flex-start;}
#sidebar{width:178px; flex:0 0 auto; background:var(--card); border-right:1px solid var(--line);
  position:sticky; z-index:19; align-self:flex-start; display:flex; flex-direction:column; overflow:hidden;}
#sidebar .tabs{position:static; flex-direction:column; overflow-y:auto; overflow-x:hidden; border-bottom:0; flex:1 1 auto;}
#sidebar .tabs button{flex:none; display:flex; align-items:center; gap:10px; text-align:left;
  padding:11px 12px; border-bottom:1px solid var(--line); border-left:4px solid transparent;
  border-bottom-width:0; min-width:0; font-size:1.15rem;}
#sidebar .tabs button span{text-align:left; margin-top:0;}
#sidebar .tabs button.active{border-bottom-color:transparent; border-left-color:var(--saffron);}
body.side-collapsed #sidebar{width:60px;}
body.side-collapsed #sidebar .tabs button{justify-content:center; padding:11px 4px;}
body.side-collapsed #sidebar .tabs button span{display:none;}
#side-toggle{margin-top:auto; border:0; border-top:1px solid var(--line); background:none;
  padding:12px 8px; cursor:pointer; color:var(--mut); font-size:1rem; font-family:inherit; min-height:44px;}
#contentcol{flex:1 1 auto; min-width:0;}
#subhead{position:sticky; z-index:18; background:var(--card); border-bottom:1px solid var(--line);
  padding:6px 16px; font-size:.85rem; color:var(--mut); display:flex; gap:8px; align-items:center;}
#subhead b{color:var(--ink); font-size:.95rem;}
@media(max-width:640px){
  #shell{display:block;}
  #sidebar{width:auto; position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line);}
  #sidebar .tabs{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); overflow:visible; flex:none;}
  #sidebar .tabs button{min-width:0; padding:7px 2px; font-size:1.05rem; border-left:0;
    border-bottom:3px solid transparent; display:block; text-align:center;}
  #sidebar .tabs button span{font-size:.65rem; line-height:1.1; text-align:center; display:block; margin-top:2px;}
  #sidebar .tabs button.active{border-left-color:transparent; border-bottom-color:var(--saffron);}
  #side-toggle{display:none;}
  body.side-collapsed #sidebar{width:auto;}
  body.side-collapsed #sidebar .tabs button span{display:block;}
}
/* Q23: voided heaps/expenses stay visible in the audit view as crossed-out rows */
.voided-row td{text-decoration:line-through;}
/* denser reminder rows for 20+20 parties (#5) */
.tbl-compact td{padding:5px 8px; font-size:.85rem;}
/* reminders: two compact side-by-side columns, distinct subheaders (#3, #4) */
.rem-head{margin:14px 0 8px; font-size:1.08rem;}
.rem-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:640px){.rem-grid{grid-template-columns:1fr;}}
.rem-sub{font-size:.8rem; font-weight:700; padding:5px 9px; border-radius:6px; margin-bottom:4px;
  border-left:4px solid var(--saffron); background:#faf8f2;}
.rem-sub-buyer{border-left-color:var(--green); background:#eef7f0;}
.rem-sub-farmer{border-left-color:var(--red); background:#fdf0ef;}
.rem-row{display:flex; justify-content:space-between; align-items:baseline; gap:6px;
  padding:4px 2px; border-bottom:1px solid var(--line); font-size:.85rem;}
.rem-row:last-child{border-bottom:0;}
.rem-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rem-amt{font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums;}
.rem-more{font-size:.75rem; color:var(--mut); padding:4px 2px;}
.rem-empty{font-size:.82rem; color:var(--mut); padding:4px 2px;}
/* compact stat tiles (#2) */
.stat{padding:8px 6px;}
.stat .n{font-size:1.2rem;}
.stat{background:var(--bg); border-radius:10px; padding:10px; text-align:center;}
.stat .n{font-size:1.35rem; font-weight:800; color:var(--green-d);}
.stat .l{font-size:.8rem; color:var(--mut);}
.stat .sub2{font-size:.72rem; color:var(--mut); margin-top:2px; line-height:1.4;}
.payrecon{background:var(--bg2,#f6f6f4); border:1px solid var(--line,#e2e2dc); border-radius:10px; padding:8px 12px; margin:10px 0; font-size:.85rem; line-height:1.7;}
.payrecon b{white-space:nowrap;}
.stat.warn .n{color:var(--saffron-d);} .stat.bad .n{color:var(--red);}
/* Batch D: display-only tiles (market fee) — plain ink numbers, never the
   green action-tile look, so they don't read as tappable */
.stat.plain .n{color:var(--ink); font-weight:700;}
/* home tile families: faint tints group flow vs money at a glance (sober) */
.stat.flow{background:#fdf9ef;}
.stat.money{background:#f1f7f1;}
.stat.tap{cursor:pointer;}
/* Batch D: "⋯ ਹੋਰ · More" menu — non-daily actions tucked under one button */
.more-menu{position:relative; display:inline-block;}
.more-menu summary{list-style:none;}
.more-menu summary::-webkit-details-marker{display:none;}
.more-body{position:absolute; right:0; top:110%; z-index:50; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px; display:flex; flex-direction:column; gap:6px; min-width:230px; box-shadow:0 4px 16px rgba(0,0,0,.15);}
.more-body .btn{width:100%; justify-content:flex-start;}
.save-tick{font-size:.75rem; color:var(--green-d); font-weight:700; margin-left:8px; opacity:0; transition:opacity .4s;}
.save-tick.show{opacity:1;}
.tab-ic{width:22px; height:22px; vertical-align:middle; border-radius:5px;}
.step-ic{width:28px; height:28px; vertical-align:-7px; border-radius:6px;}
.crop-tabs .btn{min-height:44px;}
.daylock-row{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:.9rem;}
.filter-chip{display:inline-flex; align-items:center; gap:6px; margin:0 0 8px 8px;}
.banner-warn{background:#fff7e6; border:2px solid var(--saffron-d); border-radius:12px;
  padding:12px 14px; margin-bottom:12px; font-weight:600;}

table{width:100%; border-collapse:collapse; font-size:.92rem;}
th,td{padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
th{color:var(--mut); font-weight:600; font-size:.8rem;}
tr:last-child td{border-bottom:0;}
.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}

.chip{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; font-weight:700;}
/* workflow step-scale: quiet light-to-deep green, arrived → boli → weighed → lifted */
.chip.arrived{background:#f0f7f0; color:#4a7c4a;}
.chip.sold{background:#e0efe0; color:#336b33;}
.chip.weighed{background:#c9e2c9; color:#1f5c1f;}
.chip.lifted{background:#1a7a3c; color:#fff;}

/* Batch B #5: payment-mode chips on the heap register */
.pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:.78rem; font-weight:700;}
.pill-g{background:#e9f7ef; color:#1a7a3c;}
.pill-w{background:#fef3e2; color:#9a6206;}
/* v1.5.1: micro-labels — 3–6 word plain meanings under staged figures.
   Bare-minimum wording (fix #2): these are labels, not lecture sentences. */
.micro{display:block; font-size:.76rem; color:#6e6e73; font-weight:400; margin-top:1px;}
/* v1.1.2: computed interest-status tag on farmer net figures — never hardcoded */
.int-tag{display:inline-block; padding:2px 10px; border-radius:20px; font-size:.74rem; font-weight:700; background:#f0f4ff; color:#3b5bbf; border:1px solid #d4ddf7; margin-top:4px;}
/* v1.5.1 #3: what's-new list in the update card */
.upd-notes{margin:8px 0 8px 18px; font-size:.9rem;}
.upd-notes li{margin-bottom:4px;}

.btn{display:inline-block; border:0; border-radius:12px; padding:12px 18px; font-size:.95rem;
  font-weight:700; cursor:pointer; font-family:inherit; margin:4px 4px 4px 0;
  box-shadow:0 1px 2px rgba(0,0,0,.08); transition:transform .08s ease, box-shadow .08s ease;}
.btn:active{transform:scale(.98); box-shadow:none;}
.btn-p{background:var(--green); color:#fff;}
.btn-p:active{background:var(--green-d);}
.btn-blue{background:#1d5fbf;color:#fff;} .btn-blue:active{background:#174b96;}
.btn-s{background:var(--saffron); color:#fff;}
.btn-s:active{background:var(--saffron-d);}
.btn-r{background:var(--red); color:#fff;}
.btn-r:active{background:var(--red-d);}
.btn-g{background:#ececec; color:var(--ink);}
.btn-danger{background:#fbe9e7; color:var(--red);}
.btn-sm{padding:7px 10px; font-size:.82rem; border-radius:8px;}
.btn-xs{padding:4px 8px; font-size:.72rem; border-radius:6px;}
.icon-btn{background:none;border:0;cursor:pointer;font-size:1rem;padding:2px 6px;vertical-align:middle;opacity:.6}
.icon-btn:hover{opacity:1}
.btn-block{width:100%; margin:8px 0;}
.btn .en-sub{display:block; font-size:.72em; font-weight:400; opacity:.85; line-height:1.3;}
/* v1.1 #10: the smaller English line under a Punjabi ledger sentence */
td .en-sub{display:block; font-size:.72em; font-weight:400; opacity:.7; line-height:1.35; margin-top:1px;}

.fab{position:fixed; right:16px; bottom:18px; width:60px; height:60px; border-radius:50%;
  background:var(--saffron); color:#fff; font-size:1.7rem; border:0; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.25); z-index:30;}

#modal-root:empty{display:none;}
#kb-root:empty{display:none;}
.kb-veil{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60;
  display:flex; align-items:center; justify-content:center; padding:14px;}
.kb-sheet{background:#fff; width:min(92vw,460px); max-height:62vh; overflow-y:auto;
  border-radius:16px; padding:12px; box-shadow:0 12px 36px rgba(0,0,0,.28);}
.kb-sheet h3{margin:0 0 8px; font-size:1rem;}
.kb-prev{background:#f7f4ec; border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; font-size:1.2rem; min-height:1.7em; margin-bottom:10px; word-break:break-word;}
.kb-sheet .pk{min-width:34px; min-height:38px; padding:6px 4px; font-size:17px;}
.kb-btns{display:flex; gap:8px; margin-top:8px;}
.kb-btns .btn{flex:1; margin:0;}
.modal-veil{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  display:flex; align-items:flex-end; justify-content:center;}
.modal{background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:18px 18px 0 0; padding:18px 16px 26px;}

.field{margin-bottom:12px;}
/* P14: collapsed optional bank-details block on the farmer form */
.bankdet{margin:4px 0 12px; border:1px solid var(--line); border-radius:12px; padding:4px 12px 8px; background:#fafafa;}
.bankdet summary{cursor:pointer; font-weight:700; font-size:.9rem; padding:8px 0; color:var(--mut);}
.field label{display:block; font-size:.85rem; font-weight:700; margin-bottom:4px; color:var(--mut);}
.field input,.field select{width:100%; padding:12px; font-size:1rem; border:1px solid var(--line);
  border-radius:12px; font-family:inherit; background:#fff; box-shadow:inset 0 1px 2px rgba(0,0,0,.03);}
.field .hint{font-size:.78rem; color:var(--mut); margin-top:3px;}
/* Two-script farmer picker: native selects cannot show a composed two-line row. */
.farmer-picker{position:relative;width:100%;}
.farmer-picker-trigger{width:100%;min-height:58px;padding:8px 38px 8px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;position:relative;}
.farmer-picker-trigger::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:.9rem;}
.farmer-picker-menu{display:none;position:absolute;z-index:85;left:0;right:0;top:calc(100% + 4px);max-height:285px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:4px;}
.farmer-picker.open .farmer-picker-menu{display:block;}
.farmer-picker-search{position:sticky;top:0;z-index:1;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-family:inherit;}
.farmer-option{display:block;width:100%;padding:8px 9px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-family:inherit;text-align:left;cursor:pointer;}
.farmer-option:last-child{border-bottom:0}.farmer-option:hover,.farmer-option:focus{background:var(--bg);outline:0;}
.farmer-pa{display:block;font-family:"Noto Sans Gurmukhi","Mukta Mahee","Raavi",sans-serif;font-size:.9rem;font-weight:650;line-height:1.35;}
.farmer-en{display:block;margin-top:2px;font-family:system-ui,sans-serif;font-size:.62rem;line-height:1.25;color:var(--mut);letter-spacing:.01em;}
.fixed-choice{min-height:46px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;}
.status-btn,.pill.status-btn{border:0;font-family:inherit;cursor:pointer;margin:0 3px 3px 0;}
.status-btn:disabled{cursor:not-allowed;opacity:.6;}
.name-edit-btn,.entry-edit-btn{border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;}
.entry-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.entry-title-row .btn{flex:0 0 auto;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-btns{display:flex; gap:10px; margin-top:6px;}
.modal-btns .btn{flex:1; margin:0;}

.khata-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;}
.bal{font-size:1.15rem; font-weight:800;}
.bal.in{color:var(--green-d);} .bal.out{color:var(--red);} .bal.payable{color:#ef6c00;}

.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}

.ver-tag{font-size:.65rem; color:#888; font-weight:400; border:1px solid #ccc; border-radius:8px; padding:1px 7px; vertical-align:middle;}

/* ===== v1.9.5 polish batch ===== */
/* ⓘ info buttons: the ⓘ mark's own small circle only — no outer ring (v1.9.7).
   Finger-sized 34px tap area kept. Opens the component popup. */
.info-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;min-width:34px;border:none;background:none;padding:0;color:#555;font-size:17px;font-weight:700;cursor:pointer;margin-left:8px;vertical-align:middle;}
.info-btn:active{transform:scale(.92);}
.info-popup{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.info-popup .ip-card{background:#fff;border-radius:14px;max-width:420px;width:100%;max-height:80vh;overflow:auto;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.3);}
.info-popup .ip-title{font-size:1.05rem;font-weight:800;margin-bottom:10px;color:var(--green-d);}
.info-popup .ip-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #f0f0f0;font-size:.95rem;}
.info-popup .ip-row:last-child{border:none;}
.info-popup .ip-total{display:flex;justify-content:space-between;padding:10px 2px 2px;font-weight:800;font-size:1.05rem;color:var(--green-d);}
.info-popup .ip-sec{font-weight:800;margin:12px 0 4px;color:var(--green-d);font-size:.95rem;}
.info-popup .ip-sec:first-of-type{margin-top:0;}
.info-popup .ip-close{margin-top:12px;width:100%;}
/* gold accent on firm earning */
.firm-earn{background:#fffdf4;border:1.5px solid #e8c547;border-radius:10px;padding:10px 12px;}
.firm-earn .amt{color:#8a6d00;font-weight:800;}
/* farmer avatars */
.avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;flex-shrink:0;}
/* crop icons */
.crop-ic{font-size:1.6rem;margin-right:6px;vertical-align:middle;}
/* warm empty states */
.empty-state{text-align:center;padding:36px 16px;color:#888;}
.empty-state .es-big{font-size:52px;margin-bottom:8px;}
.empty-state .es-title{font-size:1rem;font-weight:700;color:#555;}
.empty-state .es-sub{font-size:.85rem;margin-top:4px;}
.empty-state .btn{margin-top:14px;}
/* tabular numbers for money */
.tnum, .amt, .num{font-variant-numeric:tabular-nums;}
/* date grouping dividers */
.date-group{background:#f0f4f0;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700;color:var(--green-d);margin:12px 0 4px;}
/* sticky khata balance */
.sticky-bal{position:sticky;top:74px;z-index:5;background:var(--green-d);color:#fff;padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;border-radius:0 0 10px 10px;}
/* recovery progress bars */
.pbar{height:8px;background:#eee;border-radius:4px;margin-top:6px;overflow:hidden;}
.pbar .pfill{height:100%;background:linear-gradient(90deg,#66bb6a,#2e7d32);border-radius:4px;}
/* tab badge counts */
.tab-badge{position:absolute;top:2px;right:22%;background:#d32f2f;color:#fff;font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 7px;line-height:1.4;}
.tabs button{position:relative;} /* v1.9.7: no .tabs override — the bar stays sticky under the header (line 43) */
/* khata header card */
.khata-card{background:linear-gradient(135deg,var(--green),var(--green-d));border-radius:14px;padding:16px;color:#fff;display:flex;gap:14px;align-items:center;margin-bottom:12px;}
.khata-card .avatar{background:#ffd54f;color:var(--green-d);width:56px;height:56px;font-size:22px;}
.khata-card .k-nm{font-size:1.1rem;font-weight:700;}
.khata-card .k-sub{font-size:.82rem;opacity:.88;}
.khata-card .k-bal{margin-left:auto;text-align:right;}
.khata-card .k-bal .a{font-size:1.35rem;font-weight:800;color:#ffd54f;font-variant-numeric:tabular-nums;}
.khata-card .k-bal .w{font-size:.75rem;opacity:.88;}
/* save confirmation flash */
.save-flash{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--green-d);color:#fff;border-radius:30px;padding:12px 26px;font-weight:700;font-size:1rem;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:sflash 2.2s ease forwards;}
.save-flash .ck{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--green-d);display:flex;align-items:center;justify-content:center;font-weight:800;}
@keyframes sflash{0%{opacity:0;transform:translateX(-50%) translateY(16px);}12%{opacity:1;transform:translateX(-50%) translateY(0);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-8px);}}
/* text size toggle */
body.text-sm{font-size:14px;} body.text-lg{font-size:18px;} body.text-lg .btn{min-height:48px;}
/* v1.9.6: khata balance colors — payable orange, receivable red, settled grey.
   (Buyer khatas keep the default gold.) */
.khata-card .k-bal.pay .a{color:#ff9800;}
.khata-card .k-bal.rec .a{color:#ff8a80;}
.khata-card .k-bal.set .a{color:#e0e0e0;}
/* v1.1 #13: farmer-list ledger cards — one figure per ledger, tappable.
   v1.1.5 item 2 (alignment perfection): cards fill the row (flex:1) and share
   one height (align-items:stretch). Every card renders the same 4 rows —
   name / amount / status / tag — so crop and advance cards always line up;
   empty rows keep their height via min-height. */
.ledger-cards{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;}
.ledger-card{flex:1 1 170px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;min-width:132px;font:inherit;color:inherit;}
.ledger-card:active{transform:scale(.98);}
.lc-name{font-size:.78rem;color:#666;min-height:1.15em;}
.lc-amt{font-size:1.05rem;font-weight:800;min-height:1.45em;}
.lc-sub{font-size:.8rem;color:#666;min-height:1.25em;}
.lc-tag{min-height:28px;display:flex;align-items:center;}
/* v1.2: farmer khata tabs — ਫਸਲ ਖਾਤਾ / ਉਧਾਰ ਖਾਤਾ */
/* v1.2: direction colors — green = coming in to the firm, red = going out */
.amt-in{color:var(--green);font-weight:700;}
.amt-out{color:var(--red);font-weight:700;}
/* voided rows: strikethrough through the amount (keeps its green/red direction
   color). v1.1.3: void = one crossed-out row, no reversal entry — old reversal
   entries (from earlier versions) show their "Reversal of #N" note without a cut */
.voided-amt{text-decoration:line-through;}
/* v1.2: heap group header row inside the fasal table */
.heap-h{background:#f7f3e8;font-weight:700;}
/* v1.2: heap pop-up trigger — looks like a link, never navigates away */
.hlink{background:none;border:none;padding:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;}
/* v1.2: fasal summary strips + bottom line */
.fasal-strip{background:#f7f3e8;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;}
.fasal-pay{background:#eef7f0;border:2px solid var(--green);border-radius:10px;padding:12px;font-size:1.05rem;font-weight:800;margin:10px 0;}
/* quick filter chips */
.fchip{border:1px solid #ccc;border-radius:20px;padding:8px 16px;font-size:.9rem;background:#fff;cursor:pointer;min-height:44px;}
.fchip.on{background:var(--green-d);color:#fff;border-color:var(--green-d);font-weight:700;}
.fchip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
/* transaction type icons */
.txn-ic{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;margin-right:10px;vertical-align:middle;}
/* due date badges */
.due-badge{font-size:.75rem;font-weight:700;border-radius:12px;padding:3px 10px;color:#fff;white-space:nowrap;}
.due-overdue{background:#c62828;} .due-soon{background:#ef6c00;} .due-ok{background:#2e7d32;}
/* status pills ARE buttons */
.status-pill{display:inline-block;border:none;cursor:pointer;border-radius:16px;padding:8px 16px;font-size:.9rem;font-weight:700;min-height:40px;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.status-pill:active{transform:scale(.95);}

/* v1.4: settlement-pending note, buyer drill-down, interest gate */
.pend{color:#b26a00;font-weight:600;}
/* v1.4 #9: buyer ledger drill-down rows */
.bl-row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;}
.bl-row:last-child{border-bottom:none;}
.bl-row .nm{flex:1;}
.bl-row .nm b{font-size:1rem;}
.bl-row .nm small{display:block;color:#6e6e73;font-size:.82rem;margin-top:2px;}
.bl-chev{color:#c7c7cc;font-size:1.4rem;margin-left:8px;}

.int-ask{text-align:center;font-weight:700;font-size:1.02rem;margin:12px 0 6px;}
.ynrow{display:flex;gap:10px;}
.ynrow .btn{flex:1;}
.ynrow .btn.sel#int_yes{border-color:var(--green);background:#eef7f0;color:var(--green-d);}
.ynrow .btn.sel#int_no{border-color:var(--red);background:#fdf0ef;color:var(--red);}
</style>
</head>

/* ================================================================
   Storage integrity (Batch A — v1.5.0)
   - STORE_OK: true until any write fails. On failure a persistent red
     banner appears and every money-posting path refuses new entries
     (guardStore) until the app restarts with working storage.
   - load(): a damaged blob is QUARANTINED to a timestamped key — never
     overwritten, never seeded over. The app boots to a damaged screen
     instead of guessing at the books.
   - Fresh installs open an empty book immediately; sample data is never created.
   ================================================================ */
/* DESKTOP: localStorage is the durable store. */
let STORE_OK = true, DB_DAMAGED = null, STARTUP_NOTICE = '';
const AUTO_BACKUP_KEY = DB_KEY + '.autoBackups';
function storeProbe(){
  try { localStorage.setItem('__kachi_probe', '1'); localStorage.removeItem('__kachi_probe'); return true; }

}
function businessRecordCount(db){
  return ['farmers','buyers','suppliers','parchis','heaps','txns','expenses','recovery','bardana','claims']
    .reduce((n, k) => n + (Array.isArray(db && db[k]) ? db[k].length : 0), 0);
}
/* v1.7.1: farmer-owned records specifically — an install that has settings /
   audit entries but no farmer books (e.g. an older empty first boot) is still
   an empty book and gets the real opening data. */
function farmerRecordCount(db){
  if(!db || typeof db !== 'object') return 0;
  const n = k => Array.isArray(db[k]) ? db[k].length : 0;
  return n('farmers') + n('parchis') + n('heaps')
    + (Array.isArray(db.txns) ? db.txns.filter(t => t && t.ptype === 'farmer').length : 0);
}
function readAutoSnapshots(){
  try { const x = JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY) || '[]'); return Array.isArray(x) ? x : []; }
  catch(e){ return []; }
}
function saveAutoSnapshot(serialized){
  try {
    if(!DB || (DB.settings && DB.settings.sample) || validateBackup(DB).length) return;
    const xs = readAutoSnapshots();
    if(!xs.length || xs[0].data !== serialized){
      xs.unshift({at:new Date().toISOString(), data:serialized});
      /* Fix 17: cap total backup bytes at 3MB (not just count) */
      let totalBytes = 0;
      const kept = [];
      for(const x of xs){
        const b = (x.data || '').length;
        if(totalBytes + b > 3 * 1024 * 1024 && kept.length >= 3) break;
        kept.push(x);
        totalBytes += b;
      }
      localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(kept.slice(0, 30)));
    }
  } catch(e){ console.error('Auto-backup write failed', e); }
}

  for(const snap of readAutoSnapshots()){
    try {
      const candidate = JSON.parse(snap.data);
      if(!candidate || typeof candidate !== 'object' || !candidate.settings || candidate.settings.sample) continue;
      if(requireBusiness && businessRecordCount(candidate) === 0) continue;
      if(validateBackup(candidate).length) continue;
      return {db:candidate, at:snap.at || ''};

let _saveTimer = null;
function save(){
  if(!DB) return;
  /* v1.9.7: stamp season links NOW, not 300ms later in the debounced write.
     Every re-render filters by season, so a just-saved record must carry its
     seasonId before the synchronous render that follows save() — otherwise
     the new entry stays invisible until the next navigation. Idempotent. */
  stampAllSeasonRecords();
  /* debounce: collapse rapid save() calls into one trailing-edge write */
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(_doSave, 300);
}
/* saveNow: flush immediately (for reload/critical paths) */
function saveNow(){
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer = null; }
  _doSave();
}
function _doSave(){
  _saveTimer = null;
  if(!DB) return;
  try {
    /* prune audit log to newest 1000 entries (Fix 17) */
    if(DB.audit && DB.audit.length > 1000) DB.audit = DB.audit.slice(-1000);
    stampAllSeasonRecords();
    const serialized = JSON.stringify(DB);
    localStorage.setItem(DB_KEY, serialized);
    /* A20: the boot-time auto-backup safety net can only fire if snapshots
       actually accumulate during normal use — save one on every save */
    saveAutoSnapshot(serialized);
    STORE_OK = true;
    /* v1.1.6: live mirror — nudge main to push the books (debounced there).
       Skipped in mirror mode (read-only) and where there is no bridge. */
    try{ if(!MIRROR && window.kachiAPI && kachiAPI.liveDirty) kachiAPI.liveDirty(serialized); }catch(e){}
  } catch(e){
    STORE_OK = false;
    renderStoreBanner();
    console.error('Storage write failed', e);
  }
}
/* flush pending debounced save on page unload */
window.addEventListener('beforeunload', () => { if(_saveTimer) saveNow(); });

/* P0 #10: serialization for anything that LEAVES the device — manual
   export, cloud upload, auto-backup. Secrets (tokens/keys/passwords) are
   stripped from the payload; the books themselves are untouched. */
function dbForExport(){
  const c = JSON.parse(JSON.stringify(DB || {}));
  if(c.settings){
    Object.keys(c.settings).forEach(k => {
      if(/token|secret|password|passwd|apikey|api[-_]?key/i.test(k)) delete c.settings[k];
    });
  }
  return c;
}
function load(){

    loadBakedSeed('📥 ਤੁਹਾਡਾ ਡੇਟਾ ਤਿਆਰ ਹੈ · Your books are ready — 34 farmers loaded.');

  const wasSample = !!(parsed && parsed.settings && parsed.settings.sample);
  let damaged = !parsed || typeof parsed !== 'object' || !parsed.settings;
  if(!damaged && !wasSample){
    DB = parsed;
    try { backfillDb(); ensureSettings(); damaged = validateBackup(DB).length > 0; }
    catch(e){ damaged = true; }
    if(!damaged && businessRecordCount(DB) === 0 && newestGoodAutoSnapshot(true)) damaged = true;
  }
  if(wasSample || damaged){
    const stamp = backupStamp();
    /* desktop: quarantine the damaged blob to a timestamped key — never overwritten */
    try { localStorage.setItem(DB_KEY + '.damaged.' + stamp, raw); } catch(e){}
    const recovered = newestGoodAutoSnapshot(true);
    if(recovered){
      DB = recovered.db; backfillDb(); ensureSettings();
      STARTUP_NOTICE = '🛟 ਸਹੀ ਆਟੋ-ਬੈਕਅੱਪ ਤੋਂ ਹਿਸਾਬ ਵਾਪਸ ਲਿਆਇਆ · Books restored from the newest good auto-backup.';
      save(); return;
    }
    if(wasSample || !parsed || businessRecordCount(parsed) === 0){
      /* sample installs and empty books get the real data; the old copy is
         already quarantined above, so nothing is lost */
      loadBakedSeed('📒 ਨਮੂਨਾ ਡੇਟਾ ਹਟਾਇਆ ਗਿਆ · Sample data replaced with your real data.');
      return;
    }
    DB_DAMAGED = {stamp:stamp, bytes:raw.length}; DB = null; return;
  }

    loadBakedSeed('📥 ਤੁਹਾਡਾ ਡੇਟਾ ਲੋਡ ਹੋ ਗਿਆ · Your data has been loaded.');
    return;
  }
  save();
}
/* ---------------- audit trail & day lock ----------------

   Locked days reject new entries; unlocking is itself logged. */
function audit(action, detail){
  if(!DB.audit) DB.audit = [];
  if(!DB.seq.audit) DB.seq.audit = DB.audit.length + 1;
  DB.audit.push({id:DB.seq.audit++, ts:new Date().toISOString(), action, detail:detail || ''});
  save();
}

function loadBakedSeed(notice){
  /* v1.7.1: an existing setup (settings from an older install) is preserved —
     only the missing books are filled in with the real opening data. */
  const keepSettings = (DB && DB.settings && typeof DB.settings === 'object') ? Object.assign({}, DB.settings) : null;
  DB = JSON.parse(JSON.stringify(BAKED_SEED));
  if(keepSettings){
    delete keepSettings.sample;
    DB.settings = Object.assign(DB.settings || {}, keepSettings);
  }
  ensureSettings(); backfillDb();
  DB.settings.bakedRev = BAKED_SEED_REV;
  audit('📥 ਅਸਲ ਡੇਟਾ · Final data loaded', DB.farmers.length + ' farmers · ' + DB.txns.length + ' opening entries');

/* backfill any settings fields missing from older data/backups */
function ensureSettings(){
  if(!DB.settings) DB.settings = {};
  /* Fresh empty books and old partial backups must always have a complete,
     renderable settings record before the first screen is shown. */
  const coreDefaults = {season:'2026-27', mandi:'ਮਲੋਟ', damiPct:2.5, mandiFeePct:3, rdfPct:3,
    labourFarmer:'', labourBuyer:'',     /* v1.9.1: labour rates ship EMPTY — the munim enters the true rates at launch (blank = ₹0 in math, "–" on screen) */
    lockedUntil:'', gstOn:false, gstPct:0};
  Object.keys(coreDefaults).forEach(k => { if(DB.settings[k] === undefined || DB.settings[k] === null) DB.settings[k] = coreDefaults[k]; });
  /* v1.9.1: the old 18/25 labour defaults were placeholders, never real rates —
     blank them (old DBs and fresh installs alike) so real rates get entered */
  if(DB.settings.labourFarmer === 18) DB.settings.labourFarmer = '';
  if(DB.settings.labourBuyer === 25) DB.settings.labourBuyer = '';
  /* v1.8.3: the active season is the accounting backbone. Its boundary is the
     munim's actual switch date; no calendar months are imposed. */
  if(!Array.isArray(DB.settings.seasons)) DB.settings.seasons = [];
  if(!DB.settings.activeSeason || !DB.settings.activeSeason.id){
    const dated = [].concat(DB.txns||[],DB.heaps||[],DB.parchis||[],DB.expenses||[],DB.recovery||[],DB.bardana||[],DB.claims||[])
      .map(x => x && x.date).filter(Boolean).sort();
    const start = dated[0] || todayStr();
    /* Existing spring books belong to the wheat season; a genuinely empty book follows
       the current working season until the munim changes it in Settings. */
    const mm = +(start.slice(5,7) || 0);
    const hasBookRows = !!((DB.heaps||[]).length || (DB.txns||[]).length || (DB.parchis||[]).length);
    const typ = hasBookRows && mm >= 4 && mm <= 6 ? 'wheat' : 'paddy';
    DB.settings.activeSeason = {id:typ + '-' + start, type:typ, startDate:start, endDate:'', previousId:'', oldBalances:{}, carries:{}};
    DB.settings.seasons.push(DB.settings.activeSeason);
  }
  if(!DB.settings.activeSeason.carries) DB.settings.activeSeason.carries = {};
  if(!DB.settings.seasons.some(x => x.id === DB.settings.activeSeason.id)) DB.settings.seasons.push(DB.settings.activeSeason);
  ['mspWheat','mspPaddy','mspCotton','mspBasmati'].forEach(k => { if(DB.settings[k] === undefined) DB.settings[k] = 0; });
  /* v1.6.3: government moisture standards pre-filled (wheat 12%, paddy 17% —
     GOI uniform specifications); 0 was the old shipped default, never a
     deliberate choice, so backfill it too. Still editable in Settings. */
  if(!(DB.settings.wheatMoisturePct > 0)) DB.settings.wheatMoisturePct = 12;
  if(!(DB.settings.paddyMoisturePct > 0)) DB.settings.paddyMoisturePct = 17;
  if(DB.settings.gstPct === undefined) DB.settings.gstPct = 0;
  /* Batch C: bardanaPerQtl was never read — dead backfill removed. */
  /* bori bag weights — blank-safe backfill for old data/backups */
  if(!DB.settings.bagWeight || typeof DB.settings.bagWeight !== 'object') DB.settings.bagWeight = {};
  const _bagDef = { 'ਕਣਕ · Wheat':50, 'ਝੋਨਾ · Paddy':37.5, 'ਨਰਮਾ · Cotton':40, 'ਬਾਸਮਤੀ · Basmati':35 };
  CROPS.forEach(c => { if(!(DB.settings.bagWeight[c] > 0)) DB.settings.bagWeight[c] = _bagDef[c]; });
  /* Batch B #1: crop-wise settings — migrate legacy top-level rates into the
     per-crop structure for old data/backups; fresh installs get the notified
     defaults from defaultCropCfg() */
  if(!DB.settings.cropCfg || typeof DB.settings.cropCfg !== 'object') DB.settings.cropCfg = {};
  const _cdef = defaultCropCfg();
  CROPS.forEach(c => {
    const k = cropKey(c), d = _cdef[k];
    if(!DB.settings.cropCfg[k] || typeof DB.settings.cropCfg[k] !== 'object'){
      DB.settings.cropCfg[k] = {
        bagKg:(DB.settings.bagWeight || {})[c] > 0 ? DB.settings.bagWeight[c] : d.bagKg,
        labourF:DB.settings.labourFarmer != null ? DB.settings.labourFarmer : d.labourF,
        labourB:DB.settings.labourBuyer != null ? DB.settings.labourBuyer : d.labourB,
        commPerQtl:d.commPerQtl, privateTrade:d.privateTrade,
        moisturePct:k === 'ਕਣਕ' ? DB.settings.wheatMoisturePct : (k === 'ਝੋਨਾ' ? DB.settings.paddyMoisturePct : 0),
        msp:k === 'ਕਣਕ' ? DB.settings.mspWheat : (k === 'ਝੋਨਾ' ? DB.settings.mspPaddy : (k === 'ਨਰਮਾ' ? DB.settings.mspCotton : DB.settings.mspBasmati)),
        damiPct:DB.settings.damiPct != null ? DB.settings.damiPct : d.damiPct,
        mandiFeePct:DB.settings.mandiFeePct != null ? DB.settings.mandiFeePct : d.mandiFeePct,
        rdfPct:DB.settings.rdfPct != null ? DB.settings.rdfPct : d.rdfPct
      };
    } else {
      const cc = DB.settings.cropCfg[k];
      if(cc.privateTrade == null) cc.privateTrade = cc.govtOn != null ? !cc.govtOn : d.privateTrade;
      if(cc.moisturePct == null) cc.moisturePct = k === 'ਕਣਕ' ? DB.settings.wheatMoisturePct : (k === 'ਝੋਨਾ' ? DB.settings.paddyMoisturePct : 0);
      if(cc.msp == null) cc.msp = k === 'ਕਣਕ' ? DB.settings.mspWheat : (k === 'ਝੋਨਾ' ? DB.settings.mspPaddy : (k === 'ਨਰਮਾ' ? DB.settings.mspCotton : DB.settings.mspBasmati));
      /* v1.9.1: blank the old 18/25 placeholder labour rates so the munim
         enters the true rates at launch */
      if(cc.labourF === 18) cc.labourF = '';
      if(cc.labourB === 25) cc.labourB = '';
      delete cc.govtOn;
    }
  });
  /* Batch B #8: bardana usage charge ₹/bag (PIB, KMS 2025-26); editable */
  /* Batch C M12: backfill only when the key was never set — a deliberate 0
     (free bags) must survive, it must not be reset to the PIB default. */
  if(DB.settings.bardanaRate === undefined || DB.settings.bardanaRate === null) DB.settings.bardanaRate = 10.22;
  /* official I-form serials: blank-safe backfill for old data/backups */
  if(DB.settings.bookNoI === undefined) DB.settings.bookNoI = '';
  if(!(DB.settings.nextSerialI >= 1)) DB.settings.nextSerialI = 1;
  /* one-way cloud backup of the books to a private GitHub repo (desktop only) */
  if(!DB.settings.cloudOwner) DB.settings.cloudOwner = CLOUD_DEFAULT_OWNER;
  if(!DB.settings.cloudRepo) DB.settings.cloudRepo = CLOUD_DEFAULT_REPO;
  if(DB.settings.cloudToken === undefined) DB.settings.cloudToken = '';
  if(DB.settings.cloudFreq === undefined) DB.settings.cloudFreq = 'monthly';
  if(DB.settings.cloudLast === undefined) DB.settings.cloudLast = '';
}
/* Backfill any arrays / sequence counters missing from an older database
   (e.g. a v1.1.1 DB opened in v1.1.2 has no `expenses`, so the daily book
   crashed). Runs on EVERY load and every backup import, so an old DB can
   never crash a new tab. */
function backfillDb(){
  /* v1.4 #10: per-farmer per-season close records — {fid:seasonId: {at, balance,
     carried, noTxn?, reopenedAt?, reopenNote?}}. v1.1.3: noCarry is legacy
     (never written anymore — every close carries); reopenedAt marks a
     PIN-gated reopen (Q22). */
  if(!DB.seasonClosed || typeof DB.seasonClosed !== 'object') DB.seasonClosed = {};
  /* v1.1.2: hisaab-reviewed flags — {fid:seasonId: timestamp}. The Hisaab
     (Totals) screen stamps this when the munim opens it; the per-farmer
     season-close gate checks it. Replaces the old "Totals done" payment gate. */
  if(!DB.hisaabReviewed || typeof DB.hisaabReviewed !== 'object') DB.hisaabReviewed = {};
  ['farmers','buyers','suppliers','heaps','txns','parchis','audit','expenses','recovery','bardana','claims'].forEach(k => { if(!Array.isArray(DB[k])) DB[k] = []; });
  ensureSeasonRecordLinks();
  /* rebuild every sequence counter from the highest id actually present,
     so a DB with missing or stale counters can never produce NaN ids.
     (Old DBs may still carry a `tola` array / `seq.tola` / `tolaPerBag` —
     left unused, never read, never a crash.) */
  if(!DB.seq || typeof DB.seq !== 'object') DB.seq = {};
  /* Built-in procurement buyers survive every fresh load and old-backup import.
     Match case-insensitively, then normalize and lock the canonical four. */
  let nextBuyerId = DB.buyers.reduce((m,b) => Math.max(m, Number(b && b.id) || 0), 0) + 1;
  FIXED_GOVT_AGENCIES.forEach(name => {
    let b = DB.buyers.find(x => String((x && (x.nameEn || x.name)) || '').trim().toUpperCase() === name);
    if(!b){ b = {id:nextBuyerId++, type:'trader', phone:'', permNo:''}; DB.buyers.push(b); }
    b.name = name; b.nameEn = name; b.payerType = 'government'; b.systemAgency = true;
  });
  /* Batch B #10b: active flag — old farmers default to active.
     Batch A C3: migrate legacy `vyajRate` key to `interestRate` before the
     default kicks in, or seed farmers silently drop from 1.5% to 1%. */
  DB.farmers.forEach(f => { if(f.active == null) f.active = true; if(Number(f.vyajRate) > 0 && !(Number(f.interestRate) > 0)) f.interestRate = Number(f.vyajRate); if(!(Number(f.interestRate) > 0)) f.interestRate = 1; });
  /* v1.8.0 dual-script backfill: Punjabi is the display script, English the
     official one. Generated values are drafts — the farmer/buyer edit form
     (or Guntaj's reviewed list) corrects them into stored fields. */
  DB.farmers.forEach(f => {
    if(f.name && !f.nameEn) f.nameEn = enFallback(f.name);
    if(f.fatherName && !f.fatherPa) f.fatherPa = paFallback(f.fatherName);
    if(!f.fatherName && f.fatherPa) f.fatherName = enFallback(f.fatherPa);
    if(f.village && !f.villageEn) f.villageEn = enFallback(f.village);
  });
  DB.buyers.forEach(b => {
    if(b.name && !b.nameEn) b.nameEn = hasPa(b.name) ? paToEn(b.name) : b.name;
  });
  /* v1.1.4 item 3: the separate agency-dues module is gone — clear stale heap
     links. Agency dues are heap-derived on the buyer ledger; the agency is
     just a buyer and its crop ledger posts the gross like any buyer. Old
     agency receipt txns (commPay) keep counting via buyerFarmerCommPaid.
     DB.claims data is left untouched on disk (never delete user data). */
  DB.heaps.forEach(h => { if(h.claimId != null) delete h.claimId; });
  /* v1.1.3 (his word): the word "claim" is gone — old ledger/audit notes saying
     "Claim #N"/"ਕਲੇਮ" are renamed to "ਸਰਕਾਰੀ ਬਕਾਇਆ · Govt dues #N". Read-only
     history; the rename is idempotent (a second run changes nothing). */
  const deword = s => String(s || '')
    .replace(/ਕਲੇਮ\s*·\s*claim\s*#\s*(\d+)/gi, '🧾 ਸਰਕਾਰੀ ਬਕਾਇਆ · Govt dues #$1')
    .replace(/claim\s*#\s*(\d+)/gi, 'Govt dues #$1')
    .replace(/ਕਲੇਮ/g, 'ਸਰਕਾਰੀ ਬਕਾਇਆ')
    .replace(/claims(?![\w])/gi, 'govt dues')
    .replace(/claim(?![\w])/gi, 'govt due');
  DB.txns.forEach(t => { t.note = deword(t.note); t.noteEn = deword(t.noteEn); });
  (DB.audit || []).forEach(a => { a.action = deword(a.action); a.detail = deword(a.detail); });
  const maxId = arr => arr.reduce((m,x) => Math.max(m, (x && x.id) || 0), 0);
  DB.seq.farmer = Math.max(DB.seq.farmer || 0, maxId(DB.farmers) + 1, 1);
  DB.seq.buyer = Math.max(DB.seq.buyer || 0, maxId(DB.buyers) + 1, 1);
  DB.seq.supplier = Math.max(DB.seq.supplier || 0, maxId(DB.suppliers) + 1, 1);
  DB.seq.parchi = Math.max(DB.seq.parchi || 0, maxId(DB.parchis) + 1, 1);
  DB.seq.heap = Math.max(DB.seq.heap || 0, maxId(DB.heaps) + 1, 1);
  DB.seq.txn = Math.max(DB.seq.txn || 0, maxId(DB.txns) + 1, 1);
  DB.seq.expense = Math.max(DB.seq.expense || 0, maxId(DB.expenses) + 1, 1);
  DB.seq.recovery = Math.max(DB.seq.recovery || 0, maxId(DB.recovery) + 1, 1);
  DB.seq.bardana = Math.max(DB.seq.bardana || 0, maxId(DB.bardana) + 1, 1);
  DB.seq.claim = Math.max(DB.seq.claim || 0, maxId(DB.claims) + 1, 1);
  DB.seq.audit = Math.max(DB.seq.audit || 0, maxId(DB.audit) + 1, 1);
  /* P1.2: freeze party names on records that predate snapshots, so renamed
     parties never rewrite old ledgers or documents. */
  let snapN = 0;
  const snapH = h => {
    if(!h.farmerSnap){ h.farmerSnap = {name:farmer(h.farmerId).name || '—', village:farmer(h.farmerId).village || ''}; snapN++; }
    if(h.status && h.status !== 'arrived' && !h.buyerSnap){ h.buyerSnap = {name:buyer(h.buyerId).name || '—'}; snapN++; }
    if(h.feeSnap && h.feeSnap.gstPct == null){ h.feeSnap.gstPct = S().gstPct || 0; snapN++; }
    /* Batch B #1/#2: freeze the crop's notified govt commission + crop key
       on heaps that predate them, so old heaps compute correctly */
    if(h.feeSnap && h.feeSnap.commPerQtl == null){ h.feeSnap.commPerQtl = cropCfgFor(h.crop).commPerQtl || 0; snapN++; }
    /* Batch A C4: freeze the ₹/bag bardana rate on heaps that predate it */
    if(h.feeSnap && h.feeSnap.bardanaRate == null){ h.feeSnap.bardanaRate = S().bardanaRate || 0; snapN++; }
    if(h.feeSnap && !h.feeSnap.crop){ h.feeSnap.crop = cropKey(h.crop); snapN++; }
    return h;
  };
  DB.heaps.forEach(snapH);
  DB.txns.forEach(t => { if(!t.partySnap){ t.partySnap = psnap(t.ptype, t.pid); snapN++; } });
  if(snapN) audit('🧊 ਨਾਮ ਸਨੈਪਸ਼ਾਟ · Name snapshots backfilled', snapN + ' ਪੁਰਾਣੇ ਰਿਕਾਰਡਾਂ ਤੇ ਨਾਮ ਫਿਕਸ · records');
}

/* Batch B M7: gross is whole rupees (app convention) — fractional quintals ×
   rate must not leave paise sale credits lingering in balances forever. */
function heapGross(h){ return r1((h.actWt || 0) * (h.rate || 0)); }
/* LEGACY: h.jform data fields kept intact (do not delete) but J-form UI removed 2026-10-02 —
   J-forms are managed on the government portal, not in the ERP. */
/* Punjabi month name + ENGLISH digits, e.g. '29 ਸਤੰਬਰ 2026' (Gurmukhi digits banned) */
const PA_MONTHS = ['ਜਨਵਰੀ','ਫਰਵਰੀ','ਮਾਰਚ','ਅਪ੍ਰੈਲ','ਮਈ','ਜੂਨ','ਜੁਲਾਈ','ਅਗਸਤ','ਸਤੰਬਰ','ਅਕਤੂਬਰ','ਨਵੰਬਰ','ਦਸੰਬਰ'];
function dstrPa(iso){ if(!iso) return ''; const p = iso.split('-'); if(p.length < 3) return iso; return (+p[2]) + ' ' + PA_MONTHS[(+p[1]) - 1] + ' ' + p[0]; }
/* fee snapshot: rates & payer are frozen at auction time so later Settings or
   buyer-type changes never rewrite old heaps, I-forms or dami reports.
   HS falls back to live settings for heaps auctioned before this fix. */
const HS = h => h.feeSnap || S();
/* full commission on the heap (reports: dami report split, today's dami).
   Batch B #2: government govt commission is NOT 2.5% — the Centre de-linked
   it in the paddy season 2020-21 and pays a notified ₹/qtl (₹46.00 wheat / ₹45.88 paddy
   till RMS 2026-27). Private buyers keep 2.5% of value, buyer-paid. */
function heapDami(h){
  return (h.payerSnap || payerType(buyer(h.buyerId))) === 'government' ? heapGovtComm(h) : r1(heapGross(h) * HS(h).damiPct / 100);
}
/* govt commission in rupees: notified ₹/qtl × quintals. The ₹/qtl is frozen
   per heap at auction; older heaps fall back to the crop's live setting. */
function heapGovtComm(h){ return r1((h.actWt || 0) * agencyCommPerQtl(h)); }
function agencyCommPerQtl(h){
  if(h.feeSnap && h.feeSnap.commPerQtl != null) return h.feeSnap.commPerQtl;
  return cropCfgFor(h.crop).commPerQtl || 0;
}
/* v1.9.1 firm-money separation: commission is the FIRM's money owed BY the buyer —
   government agencies pay the notified ₹/qtl rate (billed on the agency's
   govt-dues ledger), private buyers pay 2.5%. It lives in buyer dues, nowhere else. */
function heapCommForBuyer(h){ return (h.payerSnap || payerType(buyer(h.buyerId))) === 'government' ? heapGovtComm(h) : r1(heapGross(h) * HS(h).damiPct / 100); }
/* h.parchi is legacy: the weighing-form parchi box was removed (it double-counted
   with the Parchi slip system). Old heaps keep their value so history stays intact. */
/* v1.9.1 transparency: farmer deductions split into components — one khata
   debit line per component (only non-zero shown). heapFarmerDed keeps the sum. */
function heapDedComp(h){ return {katMoist:(h.katMoist||0), katTrash:(h.katTrash||0), labourF:(h.labourF||0), parchi:(h.parchi||0)}; }
function heapFarmerDed(h){ const d = heapDedComp(h); return d.katMoist + d.katTrash + d.labourF + d.parchi; }
function heapFarmerNet(h){ return heapGross(h) - heapFarmerDed(h); }
/* v1.9.1 firm-money separation: EVERY buyer-side charge is the firm's money owed
   by the buyer — each posts exactly once, as a buyer-due line. The components
   split below is display-only over the same source numbers (transparency rule);
   the agency's govt-dues ledger bills these lines, never recomputes them. Legacy govt-heap
   bardanaBags convert at the live ₹/bag rate. */
function heapBuyerComp(h){
  const g = heapGross(h), fs = HS(h);
  /* Q17: stitching/loading are bundled inside the single buyer labour figure
     (labourB) — no separate components, they were the double-charge trap */
  return {
    gross: g,
    comm: heapCommForBuyer(h),
    mandiFee: g*fs.mandiFeePct/100,
    rdf: g*fs.rdfPct/100,
    labourB: (h.labourB||0),
    bardana: (h.bardana||0) + (h.bardanaBags||0) * (fs.bardanaRate != null ? fs.bardanaRate : (S().bardanaRate||0)),
    brok: (h.brok||0)
  };
}
function heapBuyerTotal(h){
  const c = heapBuyerComp(h);
  /* buyer dues are posted as whole rupees — round the total once (P1.5) */
  return r1(c.gross + c.comm + c.mandiFee + c.rdf + c.labourB + c.bardana + c.brok);
}
/* v1.9.1: the govt-dues read of one heap's buyer dues — all firm-money charges on it */
function heapBuyerCharges(h){
  const c = heapBuyerComp(h);
  return r1(c.comm + c.mandiFee + c.rdf + c.labourB + c.bardana + c.brok);
}
/* v1.9.6: ONE ⓘ per heap card — the popup carries the complete breakdown
   (farmer net + buyer), so the card surface shows only what's needed. */
/* v1.9.7: the register's heap-number tap called a never-defined openHeapDetail
   and threw. It now opens this same full-detail popup — no second detail screen. */
function heapInfoIdx(h){
  const bc = heapBuyerComp(h), nz = rows => rows.filter(r => r[1] !== '–');
  /* A10: the heap-detail popup (heap-number tap) carries a Void button —
     the most common void case (wrong arrival entry) had zero UI path */
  INFO_REG.push({t:'ਢੇਰ #' + h.n + ' · ਵੇਰਵਾ · Details', voidHeapId:h.id, sections:[
    {t:'ਕਿਸਾਨ ਸ਼ੁੱਧ · Farmer net',
     rows:nz([['ਵਿਕਰੀ · Sale', fmt(heapGross(h))], ['ਕਟੌਤੀ · Deductions', fmt(heapFarmerDed(h))]]),
     total:fmt(heapFarmerNet(h))},
    {t:'ਵਪਾਰੀ · Buyer',
     rows:nz([['ਫਸਲ ਮੁੱਲ · Crop value', fmt(bc.gross)], ['ਕਮਿਸ਼ਨ · Commission', fmt(bc.comm)], ['ਮੰਡੀ ਫੀਸ · Mandi fee', fmt(bc.mandiFee)], ['RDF', fmt(bc.rdf)], ['ਮਜ਼ਦੂਰੀ · Labour', fmt(bc.labourB)], ['ਬਰਦਾਨਾ · Bardana', fmt(bc.bardana)], ['ਦਲਾਲੀ · Brokerage', fmt(bc.brok)]]),
     total:fmt(heapBuyerTotal(h))}
  ]});
  return INFO_REG.length - 1;
}
function heapInfoBtn(h){
  return '<button class="info-btn" onclick="event.stopPropagation();showInfo(' + heapInfoIdx(h) + ')" title="ਵੇਰਵਾ · Details">ⓘ</button>';
}
function openHeapDetail(hid){
  const h = DB.heaps.find(x => x.id === hid);
  if(h) showInfo(heapInfoIdx(h));
}
/* Heap-linked dues (farmer sale + deductions, buyer purchase) exist only after an
   actual lift — weighed-but-not-lifted crop is still in the yard, so cancelling a
   lift (status back to 'weighed') reverses those rows automatically. Computed
   figures like dami may still use weighed heaps. */
const weighedHeaps = () => DB.heaps.filter(h => inActiveSeason(h) && !h.voided && (h.status === 'weighed' || h.status === 'lifted'));
const liftedHeaps = () => DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.status === 'lifted');
/* v1.1.3: activeTxns removed — dead code, zero callers (hygiene rule). */
const activeParchis = () => DB.parchis.filter(inActiveSeason);
const activeExpenses = () => DB.expenses.filter(e => inActiveSeason(e) && !e.voided);
const activeBardana = () => DB.bardana.filter(inActiveSeason);
const activeRecovery = () => DB.recovery.filter(inActiveSeason);

/* v1.1.4 item 2: the crop ledger (ਫਸਲ ਖਾਤਾ) appears only when the farmer has
   crop — at least one non-voided heap registered in the viewed season.
   No heap → advance ledger only. Void the only heap(s) → the crop ledger
   hides again. Display-only: balances and liveT are untouched. */
function farmerHasCrop(fid, showAll){
  const pool = showAll ? DB.heaps.filter(h => !h.voided)
    : DB.heaps.filter(h => inActiveSeason(h) && !h.voided);
  return pool.some(h => h.farmerId === fid);
}
/* farmer ledger: credits = sales owed to farmer; debits = advances/interest/payments/deductions.
   balance > 0 ⇒ payable TO farmer. */
function farmerLedger(fid, allSeasons){
  const rows = [];
  (allSeasons ? DB.heaps.filter(h => !h.voided && h.status === 'lifted') : liftedHeaps()).filter(h => h.farmerId === fid).forEach(h => {
    /* P1.2: buyer name frozen at auction time — later renames must not
       rewrite this heap's history */
    const bname = (h.buyerSnap && h.buyerSnap.name) || (buyer(h.buyerId).name || '—');
    /* v1.1 #4: crop-section rows — sale credits + heap deduction rows */
    rows.push({date:h.date, note:'ਵਿਕਰੀ · Sale — ਢੇਰ #' + h.n + ' · ਵਪਾਰੀ ' + bname + ' (' + qtl(h.actWt) + ' @ ' + fmt(h.rate) + ')', credit:heapGross(h), debit:0, sec:'crop'});
    /* v1.9.1 transparency: one debit line per deduction — only non-zero shown */
    const dc = heapDedComp(h), hn = ' — ਢੇਰ #' + h.n;
    if(dc.katMoist) rows.push({date:h.date, note:'✂️ ਨਮੀ ਕਾਟ · Moisture cut' + hn, credit:0, debit:dc.katMoist, sec:'crop'});
    if(dc.katTrash) rows.push({date:h.date, note:'✂️ ਕਾਟ/ਗੰਦਗੀ · Trash cut' + hn, credit:0, debit:dc.katTrash, sec:'crop'});
    if(dc.labourF) rows.push({date:h.date, note:'👐 ਮਜ਼ਦੂਰੀ (ਕਿਸਾਨ) · Farmer labour' + hn, credit:0, debit:dc.labourF, sec:'crop'});
    if(dc.parchi) rows.push({date:h.date, note:'🧾 ਪਰਚੀ (ਪੁਰਾਣੀ) · Parchi (Legacy)' + hn, credit:0, debit:dc.parchi, sec:'crop'});
  });
  /* v1.1.3: voided originals stay visible, labelled + crossed out, for the
     trail — but running balances SKIP dead rows (voided originals and old
     reversal entries), looked up via tid */
  DB.txns.filter(t => (allSeasons || inActiveSeason(t)) && t.ptype === 'farmer' && t.pid === fid).forEach(t => {
    let note = t.note || SLIP_KIND[t.kind] || t.kind;
    if(t.voided) note = '↩️ ਰੱਦ · CANCELLED — ' + note;
    /* v1.1 #4: transaction-section rows (udhar, parchi, vasuli, payment, interest, settlement) */
    /* v1.1 #9/#10: buyerRef + noteEn ride along for the source tag + two-line rendering */
    rows.push({date:t.date, note:note, noteEn:t.noteEn || '', credit:t.credit||0, debit:t.debit||0, tid:t.id, voided:!!t.voided, seasonId:t.seasonId, sec:'txn', buyerRef:t.buyerRef || null});
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  let bal = 0;
  rows.forEach(r => { if(rowLive(r)) bal += (r.credit||0) - (r.debit||0); r.bal = bal; });
  return { rows, bal };
}
/* buyer ledger: debits = purchases+charges; credits = payments. balance > 0 ⇒ bakaya FROM buyer. */
function buyerLedger(bid, allSeasons){
  const rows = [];
  (allSeasons ? DB.heaps.filter(h => !h.voided && h.status === 'lifted') : liftedHeaps()).filter(h => h.buyerId === bid).forEach(h => {
    /* P1.2: farmer name frozen at arrival — later edits must not rewrite history */
    const fname = (h.farmerSnap && h.farmerSnap.name) || farmer(h.farmerId).name;
    /* v1.9.1 transparency: the purchase posts as component lines — gross always,
       charges only when non-zero. Same source numbers as heapBuyerTotal, split
       for display only: no double posting.
       v1.1.4 item 3: the agency pays the firm the full crop value — government
       or private, every lifted heap posts its gross debit. The frozen payerSnap
       still decides the commission mode (₹/qtl vs %), never the live buyer
       type (A19). */
    const bc = heapBuyerComp(h), bn = ' — ਢੇਰ #' + h.n + ' (' + fname + ')';
    rows.push({date:h.date, note:'🌾 ਖਰੀਦ · Purchase (Gross)' + bn, debit:bc.gross, credit:0});
    if(bc.comm) rows.push({date:h.date, note:'ਕਮਿਸ਼ਨ · Commission' + bn, debit:bc.comm, credit:0});
    if(bc.mandiFee) rows.push({date:h.date, note:'ਮੰਡੀ ਫੀਸ · Mandi fee' + bn, debit:bc.mandiFee, credit:0});
    if(bc.rdf) rows.push({date:h.date, note:'ਆਰ.ਡੀ.ਐਫ · RDF' + bn, debit:bc.rdf, credit:0});
    if(bc.labourB) rows.push({date:h.date, note:'👐 ਮਜ਼ਦੂਰੀ (ਵਪਾਰੀ) · Buyer labour' + bn, debit:bc.labourB, credit:0});
    if(bc.bardana) rows.push({date:h.date, note:'ਬਰਦਾਨਾ · Bardana' + bn, debit:bc.bardana, credit:0});
    if(bc.brok) rows.push({date:h.date, note:'ਦਲਾਲੀ · Brokerage' + bn, debit:bc.brok, credit:0});
  });
  DB.txns.filter(t => (allSeasons || inActiveSeason(t)) && t.ptype === 'buyer' && t.pid === bid).forEach(t => {
    let note = t.note || SLIP_KIND[t.kind] || t.kind;
    if(t.voided) note = '↩️ ਰੱਦ · CANCELLED — ' + note;
    rows.push({date:t.date, note:note, noteEn:t.noteEn || '', credit:t.credit||0, debit:t.debit||0, tid:t.id, voided:!!t.voided});
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  let bal = 0;
  /* Batch B M7: balance stays whole rupees — raw component paise must not
     survive an exact-dues receipt as a permanent tail.
     v1.1.3: skip dead rows (voided + old reversals) — no reversal pairs
     are posted any more, so nothing nets them out */
  rows.forEach(r => { if(rowLive(r)) bal = r1(bal + (r.debit||0) - (r.credit||0)); r.bal = bal; });
  return { rows, bal };
}

/* Date-range filtered ledger statement: {rows, open, bal, ranged, from, to}.
   open = net of entries dated before `from` (same sign convention as the ledger
   balance); bal = closing balance of the range. No range ⇒ identical to the
   raw ledger. from/to are 'YYYY-MM-DD' strings, comparable lexicographically. */
function khataFiltered(type, id, from, to){
  const L = type === 'farmer' ? farmerLedger(id, !!(KHATA && KHATA.showAll)) : buyerLedger(id, !!(KHATA && KHATA.showAll));
  if(!from && !to) return { rows:L.rows, open:0, bal:L.bal, ranged:false, from:'', to:'' };
  if(from && to && from > to){ const t = from; from = to; to = t; }
  const net = r => type === 'farmer' ? (r.credit||0) - (r.debit||0) : (r.debit||0) - (r.credit||0);
  let open = 0;
  /* v1.1.3: ranged open/bal skip dead rows, same as the ledger builders */
  if(from) L.rows.forEach(r => { if(r.date < from && rowLive(r)) open += net(r); });
  const rows = L.rows.filter(r => (!from || r.date >= from) && (!to || r.date <= to));
  let bal = open;
  rows.forEach(r => { if(rowLive(r)) bal += net(r); });
  return { rows, open, bal, ranged:true, from:from || '', to:to || '' };
}
/* opening/closing-balance Dr/Cr cells: farmer +ve = payable to farmer (Cr); buyer +ve = receivable (Dr) */
/* Khata date range: re-render in place — the user stays on the same farmer/
   buyer khata. Never navigates to the list, never scrolls to top. */
function khataRefresh(){
  if(!KHATA) return;
  const tab = KHATA.type === 'farmer' ? 'farmers' : 'buyers';
  TAB = tab;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderStoreBanner();
  if(tab === 'farmers') renderFarmers(); else renderBuyers();
}
function khataSetRange(){
  if(!KHATA) return;
  const f = $('#k_from'), t = $('#k_to');
  KHATA.from = f ? f.value : ''; KHATA.to = t ? t.value : ''; KHATA.showAll = false;
  khataRefresh();
}
function khataClearRange(){
  if(!KHATA) return;
  KHATA.from = ''; KHATA.to = ''; KHATA.showAll = false;
  khataRefresh();
}
function khataShowAll(){
  if(!KHATA) return;
  KHATA.from = ''; KHATA.to = ''; KHATA.showAll = true;
  khataRefresh();
}

/* ---------------- navigation ---------------- */
/* v1.9.5: tab badges — pending heaps + overdue recovery counts */
function updateTabBadges(){
  if(!DB) return;
  const t = todayStr();
  const heapPend = DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.status !== 'lifted').length;
  let recOver = 0;
  try { recOver = recoveryDebtors().filter(d => d.d && d.d.nextDate && d.d.nextDate < t).length; } catch(e){}
  [['heaps', heapPend], ['recovery', recOver]].forEach(([tab, n]) => {
    const btn = document.querySelector('button[data-tab="' + tab + '"]');
    if(!btn) return;
    let b = btn.querySelector('.tab-badge');
    if(n > 0){ if(!b){ b = document.createElement('span'); b.className = 'tab-badge'; btn.appendChild(b); } b.textContent = n > 99 ? '99+' : n; }
    else if(b) b.remove();
  });
}
function go(tab, khata){
  if(tab === 'gst' && !(DB && S().gstOn)) tab = 'dash';
  INFO_REG = []; /* v1.9.5: reset popup registry on navigation */
  TAB = tab;
  /* Batch A C5: tapping a tab always lands on the tab's list — never a stale
     detail screen. Callers that need a detail view pass khata explicitly. */
  if(khata === undefined || khata === null){ KHATA = null; PARCHI_VIEW = false; } else { KHATA = khata; }
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  /* GST tab is visible only when the module is switched on in Settings */
  const gt = document.querySelector('#tabs button[data-tab="gst"]');
  if(gt) gt.style.display = S().gstOn ? '' : 'none';
  window.scrollTo(0,0);

/* Enter = Save everywhere: pressing Enter inside any text/number/date input
   triggers the form's Save button, exactly like clicking it. B2: Enter
   submits ONLY the form containing the focused field — if that form has no
   save button, Enter does nothing (no first-button fallback). Skipped for
   buttons, checkboxes, textareas, selects, the farmer-picker search, and the
   on-screen Gurmukhi keypad (they have their own Enter behavior). */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
  const t = e.target;
  if(!t || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return;
  if(t.tagName !== 'INPUT') return;
  const type = (t.type || 'text').toLowerCase();
  if(['checkbox','radio','button','submit','reset','file','range','color'].includes(type)) return;
  if(t.closest('.farmer-picker-menu, #kb-root')) return;
  const vis = el => el && el.offsetParent !== null;
  /* 1) Inside a modal: the modal's OK button is the save action */
  const modal = t.closest('#modal-root');
  if(modal){
    const ok = modal.querySelector('#mok');
    if(vis(ok)){ e.preventDefault(); ok.click(); return; }
  }
  /* 2) On a screen: the form containing the focused field — its own save
     button only. B2: no first-button fallback; if the card has no save
     button, Enter does nothing. */
  const scope = t.closest('.card, section, #screen') || document;
  const btns = Array.from(scope.querySelectorAll('button.btn-p')).filter(vis);
  const saveBtn = btns.find(b => /save|ਸੇਵ|post|ਦਰਜ|confirm|ਪੁਸ਼ਟੀ|calculate|ਹਿਸਾਬ/i.test(b.getAttribute('onclick') || ''));
  if(saveBtn){ e.preventDefault(); saveBtn.click(); }
});

/* v1.9.5: Indian agri-year term. Paddy starting year Y and wheat starting
   year Y are BOTH term "Y-(Y+1)" — e.g. paddy-2026-* and wheat-2026-* are
   both term 2026-2027. New term starts after wheat settles, with paddy. */
const termYear = (s) => { s = s || activeSeason() || {}; const y = +(String(s.startDate || '').slice(0, 4)) || new Date().getFullYear(); return y + '-' + (y + 1); };
/* v1.9.5: slash format, full years, written once — "ਝੋਨਾ/Paddy 2026-2027".
   Accepts a type string (uses active/last matching season for the year) or
   a season object (uses its own year). */
const seasonLabel = (t) => {
  const sobj = (t && typeof t === 'object') ? t : null;
  const type = sobj ? sobj.type : (t || (activeSeason() || {}).type || 'paddy');
  const s = sobj || (S().seasons || []).filter(x => x.type === type).sort((a, b) => (a.startDate || '') < (b.startDate || '') ? 1 : -1)[0] || activeSeason() || {};
  return (type === 'wheat' ? 'ਕਣਕ/Wheat ' : 'ਝੋਨਾ/Paddy ') + termYear(s);
};

function activeSeasonRange(){ const a=activeSeason() || {}; return {from:a.startDate || todayStr(), to:a.endDate || todayStr()}; }
function seasonPending(fid){ const a=activeSeason(); return !!(a && a.previousId && a.carries && !a.carries[String(fid)]); }
/* v1.1.2: REMOVED farmerTotalsDone — the "Totals done = payment posted" gate is
   gone. The per-farmer close gate is hisaabReviewedFor() (reviewing, not
   paying); the app season-change gate is per-farmer seasonClosedFor(). */
/* v1.4 #10: per-farmer season close — stored as a record (not a txn), keyed
   fid:seasonId. After close, no new entries are allowed in that season. */
const seasonCloseKey = (fid, sid) => fid + ':' + (sid || activeSeasonId());
function seasonClosedFor(fid, sid){
  return !!(DB.seasonClosed && DB.seasonClosed[seasonCloseKey(fid, sid)]);
}
/* Q2: FULL LOCK after per-farmer close — true when this farmer's season is
   closed and NOT reopened. This is the enforcement check every mutation path
   gates on (voids, expenses and other streams call this exact name too).
   seasonClosedFor() stays the raw historical fact (a close record exists). */
function farmerSeasonLocked(fid, sid){
  const rec = DB.seasonClosed && DB.seasonClosed[seasonCloseKey(fid, sid)];
  return !!(rec && !rec.reopenedAt);
}
/* hard guard: blocks any new farmer posting once the season is closed */
/* v1.4 #10: hide farmers with no live presence in the viewed season — closed
   here with nothing left, or closed last season without carry and nothing new.
   A new season shows only active farmers (fresh + carried-forward). */
function farmerNoPresence(fid, bal){
  if(bal !== 0) return false;
  const sid = activeSeasonId();
  if(DB.txns.some(t => t.ptype === 'farmer' && t.pid === fid && liveT(t) && (!t.seasonId || t.seasonId === sid))) return false;
  if(DB.heaps.some(x => x.farmerId === fid && (!x.seasonId || x.seasonId === sid))) return false;
  if(seasonClosedFor(fid, sid)) return true;
  const a = activeSeason();
  return !!(a && a.previousId && DB.seasonClosed && DB.seasonClosed[fid + ':' + a.previousId]);
}
function guardSeasonClosed(fid){
  if(farmerSeasonLocked(fid)){
    msgAlert('🔒 ਸੀਜ਼ਨ ਬੰਦ ਹੈ · Season closed\nਇਸ ਸੀਜ਼ਨ ਵਿੱਚ ਕੋਈ ਨਵੀਂ ਐਂਟਰੀ ਨਹੀਂ ਹੋ ਸਕਦੀ · No new entries can be made in this season');
    return true;
  }

}
/* B7: ONE universal guard for every action that changes financial meaning —
   money entries AND status flips (govt-dues receipt, heap lift/void, parchi paid…).
   Checks, in order: storage, the record's effective date against the day lock,
   the farmer's season lock. Returns true when BLOCKED (same convention as
   guardStore/guardSeasonClosed). Pass the record's effective date (not just
   today) and, for farmer-side actions, the farmer id. */
function guardLedger(date, fid){
  if(guardStore()) return true;
  if(date && isLocked(date)){ lockAlert(); return true; }
  if(fid && guardSeasonClosed(fid)) return true;
  return false;
}

  if(guardStore() || guardSeasonClosed(fid)) return;
  const sid = activeSeasonId();

    at: new Date().toISOString(),

    carried: bal,
    noTxn: !farmerHasTxns(fid)

    (bal !== 0 ? ' · carry ' + fmt(bal) : ' · clean'));

}

function switchSeason(nextType, swDate){
  const cur=activeSeason();
  if(!cur || cur.type === nextType) return false;
  /* A13: scope the duplicate-season check to the SAME agri term — a locked
     paddy-2026 must not block paddy-2027. termYear() is the Indian agri-year:
     paddy-2026 and wheat-2026 are both term "2026-2027". */
  const term = termYear(cur);
  const existing = (S().seasons || []).find(s => s.type === nextType && s.locked && termYear(s) === term);
  if(existing){
    msgAlert('ਇਹ ਸੀਜ਼ਨ ਪਹਿਲਾਂ ਹੀ ਬੰਦ ਹੈ · This season is already closed');
    return false;
  }
  /* Every old record already carries cur.id. Snapshot one signed closing amount
     per farmer before changing the active season. */
  stampAllSeasonRecords();
  const balances={}; DB.farmers.forEach(f => { balances[String(f.id)] = farmerLedger(f.id).bal; });
  /* A9/Q1: snapshot buyer dues BEFORE the switch — buyerLedger is
     season-scoped, so this must happen while the old season is active */
  const buyerBalances={}; DB.buyers.forEach(b => { buyerBalances[String(b.id)] = r1(buyerLedger(b.id).bal); });
  const switchDate=swDate || todayStr(), previousDay=addDays(switchDate,-1);
  cur.endDate=previousDay; cur.closedAt=new Date().toISOString(); cur.locked=true;
  const next={id:nextType + '-' + switchDate + '-' + Date.now(), type:nextType,
    startDate:switchDate, endDate:'', previousId:cur.id, oldBalances:balances, carries:{}};
  S().seasons.push(next); S().activeSeason=next;
  /* Fix 21d: store undo info for same-day reversal */
  S().seasonUndo = {prevId:cur.id, newId:next.id, date:todayStr(), at:new Date().toISOString()};
  /* Q8/Q9: dormant farmers (zero transactions in the closing season)
     auto-close silently with a no-transaction marker — no dialog, no block,
     no manual step. They carry into the new season as names. */
  DB.farmers.forEach(f => {
    if(farmerSeasonLocked(f.id, cur.id)) return;
    const had = DB.txns.some(t => liveT(t) && t.ptype === 'farmer' && t.pid === f.id && (!t.seasonId || t.seasonId === cur.id)) ||
                DB.heaps.some(h => h.farmerId === f.id && (!h.seasonId || h.seasonId === cur.id));
    if(!had){
      DB.seasonClosed[seasonCloseKey(f.id, cur.id)] = {at:new Date().toISOString(), balance:0, carried:0, noTxn:true};
      audit('🔒 ਸੀਜ਼ਨ ਬੰਦ · Season closed', (f.name || f.id) + ' · ਕੋਈ ਲੈਣ-ਦੇਣ ਨਹੀਂ · no transactions (auto)');
    }
  });
  /* Q8: EAGER carry — every closed farmer's carry posts NOW, at switch time,
     never lazily on first khata open. postCarry reads the close-time locked
     figure from the close record. */
  DB.farmers.forEach(f => { postCarry(f.id, true); });
  /* A9/Q1: buyer dues (private + government/agency — agencies ARE buyers)
     carry into the new season like farmer dues. Nothing left behind: a
     non-zero signed balance posts as an opening carry-forward txn. */
  DB.buyers.forEach(b => {
    const bal = buyerBalances[String(b.id)] || 0;
    if(!(bal !== 0)) return;
    if(guardStore()) return;
    const txn = seasonRecord({id:DB.seq.txn++, date:switchDate, ptype:'buyer', pid:b.id, kind:'carry',
      debit:bal > 0 ? bal : 0, credit:bal < 0 ? -bal : 0,
      note:'ਪਿਛਲੇ ਸੀਜ਼ਨ ਦਾ ਬਕਾਇਆ · Opening buyer-dues carry-forward — ' + seasonLabel()});
    DB.txns.push(txn);
    audit('↪ ਵਪਾਰੀ ਬਕਾਇਆ ਅੱਗੇ · Buyer dues carried', esc(b.name || b.id) + ' · ' + fmt(Math.abs(bal)));
  });
  seasonFlipBackup();
  audit('🌾 ਸੀਜ਼ਨ ਬਦਲਿਆ · Season changed', seasonLabel(cur) + ' → ' + seasonLabel(next) + ' · ' + dstr(switchDate));
  save();
  return true;}

/* Fix 21d: same-day undo of season switch */
function undoSeasonSwitch(){
  const u = S().seasonUndo;
  if(!u || u.date !== todayStr()){
    msgAlert('ਅੱਜ ਸੀਜ਼ਨ ਨਹੀਂ ਬਦਲਿਆ · No season switch today to undo');
    return;
  }
  const prev = (S().seasons || []).find(s => s.id === u.prevId);
  const nw = (S().seasons || []).find(s => s.id === u.newId);
  if(!prev || !nw){
    msgAlert('ਸੀਜ਼ਨ ਨਹੀਂ ਮਿਲਿਆ · Season not found');
    return;
  }
  /* check if new season has any transactions — if so, don't delete it */
  const hasTxns = DB.txns.some(t => t.seasonId === nw.id) || DB.heaps.some(h => h.seasonId === nw.id);
  msgConfirm('ਸੀਜ਼ਨ ਬਦਲਾਅ ਵਾਪਸ ਲੈਣਾ ਹੈ? · Undo season switch?\n' + seasonLabel(prev) + ' ਫਿਰ ਚਾਲੂ ਹੋਵੇਗਾ · will become active again', () => {
    prev.locked = false; prev.endDate = ''; prev.closedAt = null;
    S().activeSeason = prev;
    if(!hasTxns){
      S().seasons = S().seasons.filter(s => s.id !== nw.id);
    }
    delete S().seasonUndo;
    audit('↩️ ਸੀਜ਼ਨ ਬਦਲਾਅ ਵਾਪਸ · Season switch undone', seasonLabel(nw) + ' → ' + seasonLabel(prev));
    saveNow();
    $('#season-badge').innerHTML = seasonBadgeHTML();
    go(TAB);
    msgAlert('ਸੀਜ਼ਨ ਵਾਪਸ · Season restored');
  });
}
/* Q8: the single carry-posting path — now called EAGERLY by switchSeason for
   every closed farmer, plus the silent-apply fallback in ensureFarmerSeason
   for old data. Posts the close-time locked figure, never edits. */
function postCarry(fid, noSave){
  fid = +fid;
  if(seasonPending(fid) === false) return false;
  const s = activeSeason();
  if(!s || !s.previousId) return false;
  /* Q2 safety net: a reopened (unlocked) previous-season close carries
     nothing — the close was undone, so there is no finalized figure. (The
     switch-time hard block makes this unreachable in the new flow.) */
  const cr = DB.seasonClosed && DB.seasonClosed[fid + ':' + s.previousId];
  if(cr && cr.reopenedAt) return false;
  /* Q8: the close record's locked figure is authoritative; the switch-time
     snapshot is only the legacy fallback when no close record exists. */
  const old = (cr && typeof cr.carried === 'number') ? cr.carried : seasonCarrySnapshot(fid);
  const amount = Math.abs(old);
  if(guardStore()) return false;
  if(!(amount > 0)){
    /* zero carry: mark only, no txn — keeps seasonPending false without noise */
    s.carries[String(fid)] = {fromSeasonId:s.previousId, amount:0, at:new Date().toISOString()};
    if(!noSave) save();
    return true;
  }
  const f = farmer(fid);
  const txn = seasonRecord({id:DB.seq.txn++, date:s.startDate, ptype:'farmer', pid:fid, kind:'carry',
    debit:old < 0 ? amount : 0, credit:old >= 0 ? amount : 0,
    note:'ਪਿਛਲੇ ਸੀਜ਼ਨ ਦਾ ਹਿਸਾਬ · Opening carry-forward — ' + seasonLabel()});
  DB.txns.push(txn); s.carries[String(fid)] = {fromSeasonId:s.previousId, amount:(old < 0 ? -amount : amount), txnId:txn.id, at:new Date().toISOString(), settledOn:s.startDate};
  audit('↪ ਸੀਜ਼ਨ ਦਾ ਹਿਸਾਬ ਅੱਗੇ ਲਿਆਂਦਾ · Carry-forward posted', esc(f.name || fid) + ' · ' + fmt(amount));
  if(!noSave) save();
  return true;
}
/* Q8: carries post eagerly at switch time, so this is only the silent-apply
   fallback for old data (seasons switched before eager carry existed, or a
   close record without a carry mark). No popup, no questions. Q9: the
   no-carry branch is gone — every pending carry posts, even ₹1; legacy
   noCarry records are honored as carries too, since no balance is ever
   dropped. */
function ensureFarmerSeason(fid, onReady){
  fid=+fid;
  if(!seasonPending(fid)){ onReady(); return; }
  postCarry(fid, true);
  save(); onReady();
}
