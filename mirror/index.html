<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kachi Arth Phone Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Gurmukhi:wght@400;500;600;700;800&family=Anek+Latin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#1a7a3c; --green-d:#0f5c2c; --saffron:#e8862d; --saffron-d:#c96a16;
  --ink:#1c1c1c; --mut:#6b6b6b; --gloss:#787c74; --line:#e3e3e3; --bg:#f6f4ee; --card:#ffffff;
  --red:#c0392b; --red-d:#a93226; --blue:#2471a3; --amber:#b97d10;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  font-family:'Anek Gurmukhi','Anek Latin','Noto Sans Gurmukhi','Segoe UI',system-ui,sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));}
.en{display:block; font-size:.8em; color:var(--gloss); font-weight:400; line-height:1.35;}
.micro{display:block; font-size:.72rem; color:var(--mut); font-weight:400;}
.muted{color:var(--mut);}
.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
.amt-out{color:var(--red); font-weight:700;}
.amt-pay{color:var(--amber); font-weight:700;}
h2{font-size:1.3rem; margin:0;}
h3{font-size:1.05rem; margin:16px 0 8px;}
/* ---------- header ---------- */
.appbar{background:linear-gradient(135deg,var(--green),var(--green-d)); color:#fff;
  padding:14px 16px calc(12px + env(safe-area-inset-top)); padding-top:calc(12px + env(safe-area-inset-top));
  border-bottom:3px solid var(--saffron); box-shadow:0 2px 10px rgba(0,0,0,.18);
  position:sticky; top:0; z-index:40;}
.appbar .ttl{font-size:1.35rem; font-weight:800; line-height:1.2;}
.appbar .ttl .en{color:rgba(255,255,255,.75);}
.season-badge{display:inline-block; margin-top:6px; background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.4); padding:3px 12px; border-radius:20px; font-size:.85rem;}
.hdr-date{margin-top:5px; font-size:.78rem; opacity:.85;}
.statusline{margin-top:8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.82rem;}
.refreshbtn{background:#fff; color:var(--green-d); border:0; border-radius:20px; padding:7px 16px;
  font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; min-height:38px;}
.refreshbtn:active{background:#e8f3ec;}
/* ---------- layout ---------- */
main{padding:12px 12px 8px; max-width:860px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
.card h2 .en, .secttl .en{display:block;}
.secttl{font-size:1.15rem; font-weight:700; margin:4px 0 10px;}
/* ---------- dashboard cards ---------- */
.dashgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.dashcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px 14px; cursor:pointer; min-height:86px;}
.dashcard:active{border-color:var(--green);}
.dashcard .dc-t{font-weight:700; font-size:.98rem; line-height:1.3;}
.dashcard .dc-v{font-size:1.28rem; font-weight:800; margin-top:5px; line-height:1.25;}
.dashcard .dc-s{font-size:.8rem; color:var(--mut); margin-top:2px; line-height:1.35;}
.dashcard.wide{grid-column:1 / -1;}
/* ---------- lists ---------- */
.searchbox{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
  font-family:inherit; font-size:1rem; background:#fff; margin-bottom:10px;}
.listrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px;
  font-family:inherit; font-size:1rem; color:inherit; cursor:pointer; min-height:58px;}
.listrow:active{border-color:var(--green);}
.listrow .lr-main{flex:1; min-width:0;}
.listrow .lr-name{font-weight:700; line-height:1.3; overflow-wrap:anywhere;}
.listrow .lr-sub{font-size:.82rem; color:var(--mut); line-height:1.35; overflow-wrap:anywhere;}
.listrow .lr-amt{font-size:1.05rem; font-weight:800; white-space:nowrap;}
.tag{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 9px; border-radius:12px; background:var(--bg); border:1px solid var(--line); color:var(--mut);}
.tag.red{background:#fdeceb; border-color:#f0c6c0; color:var(--red-d);}
.tag.amber{background:#fdf3e0; border-color:#eed9ac; color:#8a5d07;}
.tag.green{background:#e7f4ec; border-color:#bfe0cd; color:var(--green-d);}
/* ---------- figure chart (master's figBlocks shape) ---------- */
.figrow{display:flex; align-items:stretch; gap:6px; flex-wrap:wrap; margin:6px 0 4px;}
.figblk{flex:1 1 100px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:9px 11px;}
.figblk.hl{border-color:var(--green); background:#eef6f1;}
.figblk .fl{font-size:.85rem; line-height:1.35;}
.figblk .fl .en{display:block;}
.figblk .fa{font-size:1.12rem; font-weight:800; margin-top:3px;}
.figarrow{align-self:center; color:var(--mut); font-weight:800; font-size:1.05rem;}
/* ---------- tables ---------- */
.tblwrap{overflow-x:auto; margin:0 -4px; padding:0 4px;}
table{width:100%; border-collapse:collapse; font-size:.92rem;}
th{ text-align:left; color:var(--mut); font-weight:600; font-size:.8rem; padding:7px 6px; border-bottom:2px solid var(--line); vertical-align:top;}
td{padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere;}
tr.voided td{opacity:.55; text-decoration:line-through;}
.heap-h{font-weight:700; background:var(--bg);}
/* ---------- filter chips ---------- */
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.chip{border:1px solid var(--line); background:#fff; border-radius:18px; padding:7px 14px;
  font-family:inherit; font-size:.88rem; cursor:pointer; min-height:38px;}
.chip.on{background:var(--green); color:#fff; border-color:var(--green); font-weight:700;}
/* ---------- login ---------- */
.field{margin-bottom:12px;}
.field label{display:block; font-weight:600; margin-bottom:5px; font-size:.95rem;}
.field input{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; font-size:1rem; font-family:inherit; background:#fff;}
.btn{display:inline-block; border:0; border-radius:12px; padding:12px 18px; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; min-height:48px;}
.btn-p{background:var(--green); color:#fff;}
.btn-block{width:100%;}
.login-err{color:var(--red); text-align:center; margin:0 0 12px; font-weight:600;}
/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--card);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.tabbar button{flex:1; background:none; border:0; border-top:3px solid transparent; padding:8px 2px 7px;
  font-family:inherit; font-size:.78rem; color:var(--mut); cursor:pointer; line-height:1.25; min-height:56px;}
.tabbar button .ti{display:block; font-size:1.25rem; line-height:1.15;}
.tabbar button.active{color:var(--green-d); border-top-color:var(--saffron); font-weight:700;}
.backbtn{background:none; border:0; font-family:inherit; font-size:.95rem; font-weight:700; color:var(--green-d);
  padding:8px 4px; cursor:pointer; min-height:44px;}
.empty-state{text-align:center; padding:26px 12px; color:var(--mut);}
.empty-state .es-title{font-size:1.05rem; font-weight:700; color:var(--ink);}
.daypick{display:flex; align-items:center; gap:10px; justify-content:space-between; margin-bottom:10px;}
.daypick button{background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-family:inherit; font-size:.9rem; cursor:pointer; min-height:42px;}
.daypick input{padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:.95rem;}
</style>
</head>
<body>
<header class="appbar">
  <div class="ttl">📱 ਕੱਚੀ ਆੜ੍ਹਤ<span class="en">Kachi Arth — phone viewer</span></div>
  <div><span class="season-badge" id="season-badge"></span></div>
  <div class="hdr-date" id="hdr-date"></div>
  <div class="statusline" id="statusline" style="display:none">
    <span id="data-asof"></span>
    <span>👁️ ਸਿਰਫ਼ ਵੇਖੋ<span class="en" style="display:inline;font-size:.85em">Read-only</span></span>
    <button class="refreshbtn" id="refreshbtn" type="button">↻ Refresh</button>
  </div>
</header>
<nav class="tabs tabbar" id="tabs" style="display:none"></nav>
<main id="screen"></main>
<script>
'use strict';
/* ================= KACHI ARTH — PHONE VIEWER (read-only) =================
   Purpose-built viewing build (2026-10-29, replaces the v1.1.8 app-copy page):
   same login + same encrypted books.enc as before, but engineered only to
   SEE the firm's data — no entry forms, no settings, no write path at all.
   The money math below is the desktop master's own code (v1.3.0), extracted
   verbatim; only storage/write plumbing is stubbed inert. */
const DB_KEY = 'kachiArthDBv1';

let DB = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmt = n => { const v = Math.round((Number(n) || 0) * 100) / 100; return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 }); };

const fmt0 = n => { const v = Math.round((Number(n) || 0) * 100) / 100; return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 2 }); };

const r1 = n => Math.round(n || 0);

const qtl = n => (n > 0 ? Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + ' qtl' : '—');

const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

const dstr = iso => { if(!iso) return ''; const [y,m,dd] = iso.split('-'); return dd + '/' + m + '/' + y; };

let STORE_OK = true;

const AUTO_BACKUP_KEY = DB_KEY + '.autoBackups';

function readAutoSnapshots(){ return []; } /* viewer stub: read-only build */

function saveAutoSnapshot(){} /* viewer stub: read-only build */

let _saveTimer = null;

function save(){} /* viewer stub: read-only build */

function _doSave(){} /* viewer stub: read-only build */

function renderStoreBanner(){} /* viewer stub: read-only build */

function audit(action, detail){
  if(!DB.audit) DB.audit = [];
  if(!DB.seq.audit) DB.seq.audit = DB.audit.length + 1;
  DB.audit.push({id:DB.seq.audit++, ts:new Date().toISOString(), action, detail:detail || ''});
  save();
}

const farmer = id => DB.farmers.find(f => f.id === id) || {};

const buyer  = id => DB.buyers.find(b => b.id === id) || {};

const S = () => DB.settings;

const FIXED_GOVT_AGENCIES = ['PUNGRAIN','PUNSUP','MARKFED','FCI'];

function ensureSettings(){
  if(!DB.settings) DB.settings = {};
  /* Fresh empty books and old partial backups must always have a complete,
     renderable settings record before the first screen is shown. */
  const coreDefaults = {season:'2026-27', mandi:'ਮਲੋਟ', damiPct:2.5, mandiFeePct:3, rdfPct:3,
    labourFarmer:'', labourBuyer:'',     /* v1.9.1: labour rates ship EMPTY — the munim enters the true rates at launch (blank = ₹0 in math, "–" on screen) */
    lockedUntil:'', gstOn:false, gstPct:0};
  Object.keys(coreDefaults).forEach(k => { if(DB.settings[k] === undefined || DB.settings[k] === null) DB.settings[k] = coreDefaults[k]; });
  /* v1.2.3: App Lock defaults */
  if(DB.settings.appLock === undefined) DB.settings.appLock = false;
  /* v1.2.5 N1: idle timing lives in lockTimeoutSec now — migrate a
     legacy minute value once (it lands on the 5-minute maximum) */
  if(![10,15,30,60,300].includes(Number(DB.settings.lockTimeoutSec))){
    DB.settings.lockTimeoutSec = DB.settings.lockTimeout != null ? 300 : 60;
  }
  delete DB.settings.lockTimeout;
  if(DB.settings.lockOnStartup === undefined) DB.settings.lockOnStartup = false;
  if(DB.settings.defaultVyaj === undefined) DB.settings.defaultVyaj = 1.5;
  if(DB.settings.backupKeep === undefined) DB.settings.backupKeep = 30;
  /* v1.9.1: the old 18/25 labour defaults were placeholders, never real rates —
     blank them (old DBs and fresh installs alike) so real rates get entered */
  if(DB.settings.labourFarmer === 18) DB.settings.labourFarmer = '';
  if(DB.settings.labourBuyer === 25) DB.settings.labourBuyer = '';
  /* v1.8.3: the active season is the accounting backbone. Its boundary is the
     munim's actual switch date; no calendar months are imposed. */
  if(!Array.isArray(DB.settings.seasons)) DB.settings.seasons = [];
  if(!DB.settings.activeSeason || !DB.settings.activeSeason.id){
    const dated = [].concat(DB.txns||[],DB.heaps||[],DB.parchis||[],DB.expenses||[],DB.recovery||[],DB.bardana||[],DB.claims||[])
      .map(x => x && x.date).filter(Boolean).sort();
    const start = dated[0] || todayStr();
    /* Existing spring books belong to the wheat season; a genuinely empty book follows
       the current working season until the munim changes it in Settings. */
    const mm = +(start.slice(5,7) || 0);
    const hasBookRows = !!((DB.heaps||[]).length || (DB.txns||[]).length || (DB.parchis||[]).length);
    const typ = hasBookRows && mm >= 4 && mm <= 6 ? 'wheat' : 'paddy';
    DB.settings.activeSeason = {id:typ + '-' + start, type:typ, startDate:start, endDate:'', previousId:'', oldBalances:{}, carries:{}};
    DB.settings.seasons.push(DB.settings.activeSeason);
  }
  if(!DB.settings.activeSeason.carries) DB.settings.activeSeason.carries = {};
  if(!DB.settings.seasons.some(x => x.id === DB.settings.activeSeason.id)) DB.settings.seasons.push(DB.settings.activeSeason);
  ['mspWheat','mspPaddy','mspCotton','mspBasmati'].forEach(k => { if(DB.settings[k] === undefined) DB.settings[k] = 0; });
  /* v1.6.3: government moisture standards pre-filled (wheat 12%, paddy 17% —
     GOI uniform specifications); 0 was the old shipped default, never a
     deliberate choice, so backfill it too. Still editable in Settings. */
  if(!(DB.settings.wheatMoisturePct > 0)) DB.settings.wheatMoisturePct = 12;
  if(!(DB.settings.paddyMoisturePct > 0)) DB.settings.paddyMoisturePct = 17;
  if(DB.settings.gstPct === undefined) DB.settings.gstPct = 0;
  /* Batch C: bardanaPerQtl was never read — dead backfill removed. */
  /* bori bag weights — blank-safe backfill for old data/backups */
  if(!DB.settings.bagWeight || typeof DB.settings.bagWeight !== 'object') DB.settings.bagWeight = {};
  const _bagDef = { 'ਕਣਕ · Wheat':50, 'ਝੋਨਾ · Paddy':37.5, 'ਨਰਮਾ · Cotton':40, 'ਬਾਸਮਤੀ · Basmati':35 };
  CROPS.forEach(c => { if(!(DB.settings.bagWeight[c] > 0)) DB.settings.bagWeight[c] = _bagDef[c]; });
  /* Batch B #1: crop-wise settings — migrate legacy top-level rates into the
     per-crop structure for old data/backups; fresh installs get the notified
     defaults from defaultCropCfg() */
  if(!DB.settings.cropCfg || typeof DB.settings.cropCfg !== 'object') DB.settings.cropCfg = {};
  const _cdef = defaultCropCfg();
  CROPS.forEach(c => {
    const k = cropKey(c), d = _cdef[k];
    if(!DB.settings.cropCfg[k] || typeof DB.settings.cropCfg[k] !== 'object'){
      DB.settings.cropCfg[k] = {
        bagKg:(DB.settings.bagWeight || {})[c] > 0 ? DB.settings.bagWeight[c] : d.bagKg,
        labourF:DB.settings.labourFarmer != null ? DB.settings.labourFarmer : d.labourF,
        labourB:DB.settings.labourBuyer != null ? DB.settings.labourBuyer : d.labourB,
        commPerQtl:d.commPerQtl, privateTrade:d.privateTrade,
        moisturePct:k === 'ਕਣਕ' ? DB.settings.wheatMoisturePct : (k === 'ਝੋਨਾ' ? DB.settings.paddyMoisturePct : 0),
        msp:k === 'ਕਣਕ' ? DB.settings.mspWheat : (k === 'ਝੋਨਾ' ? DB.settings.mspPaddy : (k === 'ਨਰਮਾ' ? DB.settings.mspCotton : DB.settings.mspBasmati)),
        damiPct:DB.settings.damiPct != null ? DB.settings.damiPct : d.damiPct,
        mandiFeePct:DB.settings.mandiFeePct != null ? DB.settings.mandiFeePct : d.mandiFeePct,
        rdfPct:DB.settings.rdfPct != null ? DB.settings.rdfPct : d.rdfPct
      };
    } else {
      const cc = DB.settings.cropCfg[k];
      if(cc.privateTrade == null) cc.privateTrade = cc.govtOn != null ? !cc.govtOn : d.privateTrade;
      if(cc.moisturePct == null) cc.moisturePct = k === 'ਕਣਕ' ? DB.settings.wheatMoisturePct : (k === 'ਝੋਨਾ' ? DB.settings.paddyMoisturePct : 0);
      if(cc.msp == null) cc.msp = k === 'ਕਣਕ' ? DB.settings.mspWheat : (k === 'ਝੋਨਾ' ? DB.settings.mspPaddy : (k === 'ਨਰਮਾ' ? DB.settings.mspCotton : DB.settings.mspBasmati));
      /* v1.9.1: blank the old 18/25 placeholder labour rates so the munim
         enters the true rates at launch */
      if(cc.labourF === 18) cc.labourF = '';
      if(cc.labourB === 25) cc.labourB = '';
      delete cc.govtOn;
    }
  });
  /* Batch B #8: bardana usage charge ₹/bag (PIB, KMS 2025-26); editable */
  /* Batch C M12: backfill only when the key was never set — a deliberate 0
     (free bags) must survive, it must not be reset to the PIB default. */
  if(DB.settings.bardanaRate === undefined || DB.settings.bardanaRate === null) DB.settings.bardanaRate = 10.22;
  /* official I-form serials: blank-safe backfill for old data/backups */
  if(DB.settings.bookNoI === undefined) DB.settings.bookNoI = '';
  if(!(DB.settings.nextSerialI >= 1)) DB.settings.nextSerialI = 1;
  /* one-way cloud backup of the books to a private GitHub repo (desktop only) */
  if(!DB.settings.cloudOwner) DB.settings.cloudOwner = CLOUD_DEFAULT_OWNER;
  if(!DB.settings.cloudRepo) DB.settings.cloudRepo = CLOUD_DEFAULT_REPO;
  if(DB.settings.cloudToken === undefined) DB.settings.cloudToken = '';
  if(DB.settings.cloudFreq === undefined) DB.settings.cloudFreq = 'monthly';
  if(DB.settings.cloudLast === undefined) DB.settings.cloudLast = '';
}

function backfillDb(){
  /* v1.4 #10: per-farmer per-season close records — {fid:seasonId: {at, balance,
     carried, noTxn?, reopenedAt?, reopenNote?}}. v1.1.3: noCarry is legacy
     (never written anymore — every close carries); reopenedAt marks a
     PIN-gated reopen (Q22). */
  if(!DB.seasonClosed || typeof DB.seasonClosed !== 'object') DB.seasonClosed = {};
  if(!Array.isArray(DB.persons)) DB.persons = []; /* v1.2.4 item 8 */
  /* v1.2.3: one-time cleanup — season-close flags with no underlying
     transactions/heaps are stale (e.g. from a pre-fix Reset Data). They
     serve no purpose and only confuse filters. */
  if(DB.seasonClosed && Object.keys(DB.seasonClosed).length &&
     !(Array.isArray(DB.txns) && DB.txns.length) && !(Array.isArray(DB.heaps) && DB.heaps.length)){
    DB.seasonClosed = {};
  }
  /* v1.1.2: hisaab-reviewed flags — {fid:seasonId: timestamp}. The Hisaab
     (Totals) screen stamps this when the munim opens it; the per-farmer
     season-close gate checks it. Replaces the old "Totals done" payment gate. */
  if(!DB.hisaabReviewed || typeof DB.hisaabReviewed !== 'object') DB.hisaabReviewed = {};
  ['farmers','buyers','suppliers','heaps','txns','parchis','audit','expenses','recovery','bardana','claims'].forEach(k => { if(!Array.isArray(DB[k])) DB[k] = []; });
  ensureSeasonRecordLinks();
  /* rebuild every sequence counter from the highest id actually present,
     so a DB with missing or stale counters can never produce NaN ids.
     (Old DBs may still carry a `tola` array / `seq.tola` / `tolaPerBag` —
     left unused, never read, never a crash.) */
  if(!DB.seq || typeof DB.seq !== 'object') DB.seq = {};
  /* Built-in procurement buyers survive every fresh load and old-backup import.
     Match case-insensitively, then normalize and lock the canonical four. */
  let nextBuyerId = DB.buyers.reduce((m,b) => Math.max(m, Number(b && b.id) || 0), 0) + 1;
  FIXED_GOVT_AGENCIES.forEach(name => {
    let b = DB.buyers.find(x => String((x && (x.nameEn || x.name)) || '').trim().toUpperCase() === name);
    if(!b){ b = {id:nextBuyerId++, type:'trader', phone:'', permNo:''}; DB.buyers.push(b); }
    b.name = name; b.nameEn = name; b.payerType = 'government'; b.systemAgency = true;
  });
  /* Batch B #10b: active flag — old farmers default to active.
     Batch A C3: migrate legacy `vyajRate` key to `interestRate` before the
     default kicks in, or seed farmers silently drop from 1.5% to 1%. */
  DB.farmers.forEach(f => { if(f.active == null) f.active = true; if(Number(f.vyajRate) > 0 && !(Number(f.interestRate) > 0)) f.interestRate = Number(f.vyajRate); if(!(Number(f.interestRate) > 0)) f.interestRate = (DB.settings && Number(DB.settings.defaultVyaj) > 0) ? Number(DB.settings.defaultVyaj) : 1; });
  /* v1.8.0 dual-script backfill: Punjabi is the display script, English the
     official one. Generated values are drafts — the farmer/buyer edit form
     (or Guntaj's reviewed list) corrects them into stored fields. */
  DB.farmers.forEach(f => {
    if(f.name && !f.nameEn) f.nameEn = enFallback(f.name);
    if(f.fatherName && !f.fatherPa) f.fatherPa = paFallback(f.fatherName);
    if(!f.fatherName && f.fatherPa) f.fatherName = enFallback(f.fatherPa);
    if(f.village && !f.villageEn) f.villageEn = enFallback(f.village);
  });
  DB.buyers.forEach(b => {
    if(b.name && !b.nameEn) b.nameEn = hasPa(b.name) ? paToEn(b.name) : b.name;
  });
  /* v1.1.4 item 3: the separate agency-dues module is gone — clear stale heap
     links. Agency dues are heap-derived on the buyer ledger; the agency is
     just a buyer and its crop ledger posts the gross like any buyer. Old
     agency receipt txns (commPay) keep counting via buyerFarmerCommPaid.
     DB.claims data is left untouched on disk (never delete user data). */
  DB.heaps.forEach(h => { if(h.claimId != null) delete h.claimId; });
  /* v1.1.3 (his word): the word "claim" is gone — old ledger/audit notes saying
     "Claim #N"/"ਕਲੇਮ" are renamed to "ਸਰਕਾਰੀ ਬਕਾਇਆ · Govt dues #N". Read-only
     history; the rename is idempotent (a second run changes nothing). */
  const deword = s => String(s || '')
    .replace(/ਕਲੇਮ\s*·\s*claim\s*#\s*(\d+)/gi, '🧾 ਸਰਕਾਰੀ ਬਕਾਇਆ · Govt dues #$1')
    .replace(/claim\s*#\s*(\d+)/gi, 'Govt dues #$1')
    .replace(/ਕਲੇਮ/g, 'ਸਰਕਾਰੀ ਬਕਾਇਆ')
    .replace(/(?<![\w])claims(?![\w])/gi, 'govt dues')
    .replace(/(?<![\w])claim(?![\w])/gi, 'govt due');
  DB.txns.forEach(t => { t.note = deword(t.note); t.noteEn = deword(t.noteEn); });
  (DB.audit || []).forEach(a => { a.action = deword(a.action); a.detail = deword(a.detail); });
  const maxId = arr => arr.reduce((m,x) => Math.max(m, (x && x.id) || 0), 0);
  DB.seq.farmer = Math.max(DB.seq.farmer || 0, maxId(DB.farmers) + 1, 1);
  DB.seq.buyer = Math.max(DB.seq.buyer || 0, maxId(DB.buyers) + 1, 1);
  DB.seq.supplier = Math.max(DB.seq.supplier || 0, maxId(DB.suppliers) + 1, 1);
  DB.seq.parchi = Math.max(DB.seq.parchi || 0, maxId(DB.parchis) + 1, 1);
  DB.seq.heap = Math.max(DB.seq.heap || 0, maxId(DB.heaps) + 1, 1);
  DB.seq.txn = Math.max(DB.seq.txn || 0, maxId(DB.txns) + 1, 1);
  DB.seq.expense = Math.max(DB.seq.expense || 0, maxId(DB.expenses) + 1, 1);
  DB.seq.recovery = Math.max(DB.seq.recovery || 0, maxId(DB.recovery) + 1, 1);
  DB.seq.bardana = Math.max(DB.seq.bardana || 0, maxId(DB.bardana) + 1, 1);
  DB.seq.claim = Math.max(DB.seq.claim || 0, maxId(DB.claims) + 1, 1);
  DB.seq.person = Math.max(DB.seq.person || 0, maxId(DB.persons) + 1, 1); /* v1.2.4 item 8 */
  DB.seq.audit = Math.max(DB.seq.audit || 0, maxId(DB.audit) + 1, 1);
  /* P1.2: freeze party names on records that predate snapshots, so renamed
     parties never rewrite old ledgers or documents. */
  let snapN = 0;
  const snapH = h => {
    if(!h.farmerSnap){ h.farmerSnap = {name:farmer(h.farmerId).name || '—', village:farmer(h.farmerId).village || ''}; snapN++; }
    if(h.status && h.status !== 'arrived' && !h.buyerSnap){ h.buyerSnap = {name:buyer(h.buyerId).name || '—'}; snapN++; }
    if(h.feeSnap && h.feeSnap.gstPct == null){ h.feeSnap.gstPct = S().gstPct || 0; snapN++; }
    /* Batch B #1/#2: freeze the crop's notified govt commission + crop key
       on heaps that predate them, so old heaps compute correctly */
    if(h.feeSnap && h.feeSnap.commPerQtl == null){ h.feeSnap.commPerQtl = cropCfgFor(h.crop).commPerQtl || 0; snapN++; }
    /* Batch A C4: freeze the ₹/bag bardana rate on heaps that predate it */
    if(h.feeSnap && h.feeSnap.bardanaRate == null){ h.feeSnap.bardanaRate = S().bardanaRate || 0; snapN++; }
    if(h.feeSnap && !h.feeSnap.crop){ h.feeSnap.crop = cropKey(h.crop); snapN++; }
    return h;
  };
  DB.heaps.forEach(snapH);
  DB.txns.forEach(t => { if(!t.partySnap){ t.partySnap = psnap(t.ptype, t.pid); snapN++; } });
  if(snapN) audit('🧊 ਨਾਮ ਸਨੈਪਸ਼ਾਟ · Name snapshots backfilled', snapN + ' ਪੁਰਾਣੇ ਰਿਕਾਰਡਾਂ ਤੇ ਨਾਮ ਫਿਕਸ · records');
}

function heapGross(h){ return r1((h.actWt || 0) * (h.rate || 0)); }

const PA_MONTHS = ['ਜਨਵਰੀ','ਫਰਵਰੀ','ਮਾਰਚ','ਅਪ੍ਰੈਲ','ਮਈ','ਜੂਨ','ਜੁਲਾਈ','ਅਗਸਤ','ਸਤੰਬਰ','ਅਕਤੂਬਰ','ਨਵੰਬਰ','ਦਸੰਬਰ'];

function dstrPa(iso){ if(!iso) return ''; const p = iso.split('-'); if(p.length < 3) return iso; return (+p[2]) + ' ' + PA_MONTHS[(+p[1]) - 1] + ' ' + p[0]; }

const HS = h => h.feeSnap || S();

function heapDami(h){ return heapCommForBuyer(h); }

function heapGovtComm(h){ return r1((h.actWt || 0) * agencyCommPerQtl(h)); }

function agencyCommPerQtl(h){
  if(h.feeSnap && h.feeSnap.commPerQtl != null) return h.feeSnap.commPerQtl;
  return cropCfgFor(h.crop).commPerQtl || 0;
}

function heapCommForBuyer(h){ return (h.payerSnap || payerType(buyer(h.buyerId))) === 'government' ? heapGovtComm(h) : r1(heapGross(h) * HS(h).damiPct / 100); }

function heapDedComp(h){ return {katMoist:(h.katMoist||0), katTrash:(h.katTrash||0), labourF:(h.labourF||0), parchi:(h.parchi||0)}; }

function heapFarmerDed(h){ const d = heapDedComp(h); return d.katMoist + d.katTrash + d.labourF + d.parchi; }

function heapFarmerNet(h){ return heapGross(h) - heapFarmerDed(h); }

function heapBuyerComp(h){
  const g = heapGross(h), fs = HS(h);
  /* Q17: stitching/loading are bundled inside the single buyer labour figure
     (labourB) — no separate components, they were the double-charge trap */
  return {
    gross: g,
    comm: heapCommForBuyer(h),
    mandiFee: g*fs.mandiFeePct/100,
    rdf: g*fs.rdfPct/100,
    labourB: (h.labourB||0),
    bardana: (h.bardana||0) + (h.bardanaBags||0) * (fs.bardanaRate != null ? fs.bardanaRate : (S().bardanaRate||0)),
    brok: (h.brok||0)
  };
}

function heapBuyerTotal(h){
  const c = heapBuyerComp(h);
  /* buyer dues are posted as whole rupees — round the total once (P1.5) */
  return r1(c.gross + c.comm + c.mandiFee + c.rdf + c.labourB + c.bardana + c.brok);
}

function heapBuyerCharges(h){
  const c = heapBuyerComp(h);
  return r1(c.comm + c.mandiFee + c.rdf + c.labourB + c.bardana + c.brok);
}

function heapInfoIdx(h){
  const bc = heapBuyerComp(h), nz = rows => rows.filter(r => r[1] !== '–');
  /* A10: the heap-detail popup (heap-number tap) carries a Void button —
     the most common void case (wrong arrival entry) had zero UI path */
  INFO_REG.push({t:'ਢੇਰ #' + h.n + ' · ਵੇਰਵਾ · Details', voidHeapId:h.id, sections:[
    {t:'ਕਿਸਾਨ ਸ਼ੁੱਧ · Farmer net',
     rows:nz([['ਵਿਕਰੀ · Sale', fmt(heapGross(h))], ['ਕਟੌਤੀ · Deductions', fmt(heapFarmerDed(h))]]),
     total:fmt(heapFarmerNet(h))},
    {t:'ਵਪਾਰੀ · Buyer',
     rows:nz([['ਫਸਲ ਮੁੱਲ · Crop value', fmt(bc.gross)], ['ਕਮਿਸ਼ਨ · Commission', fmt(bc.comm)], ['ਮੰਡੀ ਫੀਸ · Mandi fee', fmt(bc.mandiFee)], ['RDF', fmt(bc.rdf)], ['ਮਜ਼ਦੂਰੀ · Labour', fmt(bc.labourB)], ['ਬਾਰਦਾਨਾ · Bardana', fmt(bc.bardana)], ['ਦਲਾਲੀ · Brokerage', fmt(bc.brok)]]),
     total:fmt(heapBuyerTotal(h))}
  ]});
  return INFO_REG.length - 1;
}

const weighedHeaps = () => DB.heaps.filter(h => inActiveSeason(h) && !h.voided && (h.status === 'weighed' || h.status === 'lifted'));

const liftedHeaps = () => DB.heaps.filter(h => inActiveSeason(h) && !h.voided && h.status === 'lifted');

const activeParchis = () => DB.parchis.filter(inActiveSeason);

const activeExpenses = () => DB.expenses.filter(e => inActiveSeason(e) && !e.voided);

const activeBardana = () => DB.bardana.filter(inActiveSeason);

const activeRecovery = () => DB.recovery.filter(inActiveSeason);

function farmerHasCrop(fid, showAll){
  const pool = showAll ? DB.heaps.filter(h => !h.voided)
    : DB.heaps.filter(h => inActiveSeason(h) && !h.voided);
  return pool.some(h => h.farmerId === fid);
}

function farmerLedger(fid, allSeasons){
  const rows = [];
  (allSeasons ? DB.heaps.filter(h => !h.voided && h.status === 'lifted') : liftedHeaps()).filter(h => h.farmerId === fid).forEach(h => {
    /* P1.2: buyer name frozen at auction time — later renames must not
       rewrite this heap's history */
    const bname = (h.buyerSnap && h.buyerSnap.name) || (buyer(h.buyerId).name || '—');
    /* v1.1 #4: crop-section rows — sale credits + heap deduction rows */
    rows.push({date:h.date, note:'ਵਿਕਰੀ · Sale — ਢੇਰ #' + h.n + ' · ਵਪਾਰੀ ' + bname + ' (' + qtl(h.actWt) + ' @ ' + fmt(h.rate) + ')', credit:heapGross(h), debit:0, sec:'crop'});
    /* v1.9.1 transparency: one debit line per deduction — only non-zero shown */
    const dc = heapDedComp(h), hn = ' — ਢੇਰ #' + h.n;
    if(dc.katMoist) rows.push({date:h.date, note:'✂️ ਨਮੀ ਕਾਟ · Moisture cut' + hn, credit:0, debit:dc.katMoist, sec:'crop'});
    if(dc.katTrash) rows.push({date:h.date, note:'✂️ ਕਾਟ/ਗੰਦਗੀ · Trash cut' + hn, credit:0, debit:dc.katTrash, sec:'crop'});
    if(dc.labourF) rows.push({date:h.date, note:'👐 ਮਜ਼ਦੂਰੀ (ਕਿਸਾਨ) · Farmer labour' + hn, credit:0, debit:dc.labourF, sec:'crop'});
    if(dc.parchi) rows.push({date:h.date, note:'🧾 ਪਰਚੀ (ਪੁਰਾਣੀ) · Parchi (Legacy)' + hn, credit:0, debit:dc.parchi, sec:'crop'});
  });
  /* v1.1.3: voided originals stay visible, labelled + crossed out, for the
     trail — but running balances SKIP dead rows (voided originals and old
     reversal entries), looked up via tid */
  DB.txns.filter(t => (allSeasons || inActiveSeason(t)) && t.ptype === 'farmer' && t.pid === fid).forEach(t => {
    let note = t.note || SLIP_KIND[t.kind] || t.kind;
    if(t.voided) note = '↩️ ਕੱਟਿਆ · CANCELLED — ' + note;
    /* v1.1 #4: transaction-section rows (udhar, parchi, vasuli, payment, interest, settlement) */
    /* v1.1 #9/#10: buyerRef + noteEn ride along for the source tag + two-line rendering */
    rows.push({date:t.date, note:note, noteEn:t.noteEn || '', credit:t.credit||0, debit:t.debit||0, tid:t.id, voided:!!t.voided, seasonId:t.seasonId, sec:'txn', buyerRef:t.buyerRef || null});
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  let bal = 0;
  rows.forEach(r => { if(rowLive(r)) bal += (r.credit||0) - (r.debit||0); r.bal = bal; });
  return { rows, bal };
}

function buyerLedger(bid, allSeasons){
  const rows = [];
  (allSeasons ? DB.heaps.filter(h => !h.voided && h.status === 'lifted') : liftedHeaps()).filter(h => h.buyerId === bid).forEach(h => {
    /* P1.2: farmer name frozen at arrival — later edits must not rewrite history */
    const fname = (h.farmerSnap && h.farmerSnap.name) || farmer(h.farmerId).name;
    /* v1.9.1 transparency: the purchase posts as component lines — gross always,
       charges only when non-zero. Same source numbers as heapBuyerTotal, split
       for display only: no double posting.
       v1.1.4 item 3: the agency pays the firm the full crop value — government
       or private, every lifted heap posts its gross debit. The frozen payerSnap
       still decides the commission mode (₹/qtl vs %), never the live buyer
       type (A19). */
    const bc = heapBuyerComp(h), bn = ' — ਢੇਰ #' + h.n + ' (' + fname + ')';
    rows.push({date:h.date, note:'🌾 ਖਰੀਦ · Purchase (Gross)' + bn, debit:bc.gross, credit:0});
    if(bc.comm) rows.push({date:h.date, note:'ਕਮਿਸ਼ਨ · Commission' + bn, debit:bc.comm, credit:0});
    if(bc.mandiFee) rows.push({date:h.date, note:'ਮੰਡੀ ਫੀਸ · Mandi fee' + bn, debit:bc.mandiFee, credit:0});
    if(bc.rdf) rows.push({date:h.date, note:'ਆਰ.ਡੀ.ਐਫ · RDF' + bn, debit:bc.rdf, credit:0});
    if(bc.labourB) rows.push({date:h.date, note:'👐 ਮਜ਼ਦੂਰੀ (ਵਪਾਰੀ) · Buyer labour' + bn, debit:bc.labourB, credit:0});
    if(bc.bardana) rows.push({date:h.date, note:'ਬਾਰਦਾਨਾ · Bardana' + bn, debit:bc.bardana, credit:0});
    if(bc.brok) rows.push({date:h.date, note:'ਦਲਾਲੀ · Brokerage' + bn, debit:bc.brok, credit:0});
  });
  DB.txns.filter(t => (allSeasons || inActiveSeason(t)) && t.ptype === 'buyer' && t.pid === bid).forEach(t => {
    let note = t.note || SLIP_KIND[t.kind] || t.kind;
    if(t.voided) note = '↩️ ਕੱਟਿਆ · CANCELLED — ' + note;
    rows.push({date:t.date, note:note, noteEn:t.noteEn || '', credit:t.credit||0, debit:t.debit||0, tid:t.id, voided:!!t.voided});
  });
  rows.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  let bal = 0;
  /* Batch B M7: balance stays whole rupees — raw component paise must not
     survive an exact-dues receipt as a permanent tail.
     v1.1.3: skip dead rows (voided + old reversals) — no reversal pairs
     are posted any more, so nothing nets them out */
  rows.forEach(r => { if(rowLive(r)) bal = r1(bal + (r.debit||0) - (r.credit||0)); r.bal = bal; });
  return { rows, bal };
}

let INFO_REG = [];

const figBlocks = items => '<div class="figrow">' + items.map((it, i) =>
  (i ? '<span class="figarrow">' + (it.op || '→') + '</span>' : '') +

const activeSeason = () => S().activeSeason;

const activeSeasonId = () => (activeSeason() && activeSeason().id) || '';

const termYear = (s) => { s = s || activeSeason() || {}; const y = +(String(s.startDate || '').slice(0, 4)) || new Date().getFullYear(); return y + '-' + (y + 1); };

const seasonLabel = (t) => {

  return (type === 'wheat' ? 'ਕਣਕ/Wheat ' : 'ਝੋਨਾ/Paddy ') + termYear(s);

const inActiveSeason = r => !!r && r.seasonId === activeSeasonId();

function ensureSeasonRecordLinks(){
  if(!DB || !DB.settings || !DB.settings.activeSeason) return;
  const sid = DB.settings.activeSeason.id;
  ['heaps','txns','parchis','expenses','recovery','bardana','claims'].forEach(k => (DB[k] || []).forEach(r => { if(r && !r.seasonId) r.seasonId = sid; }));
}

function stampAllSeasonRecords(){ ensureSeasonRecordLinks(); }

function activeSeasonRange(){ const a=activeSeason() || {}; return {from:a.startDate || todayStr(), to:a.endDate || todayStr()}; }

function seasonPending(fid){ const a=activeSeason(); return !!(a && a.previousId && a.carries && !a.carries[String(fid)]); }

const seasonCloseKey = (fid, sid) => fid + ':' + (sid || activeSeasonId());

function seasonClosedFor(fid, sid){
  return !!(DB.seasonClosed && DB.seasonClosed[seasonCloseKey(fid, sid)]);
}

function bagKgFor(crop){ const w = S().bagWeight || {}; return w[crop] || w[cropKey(crop)] || 0; }

function boriQtl(boris, crop){ const kg = bagKgFor(crop); return (boris > 0 && kg > 0) ? boris * kg / 100 : 0; }

function defaultCropCfg(){
  const c = (bagKg, labourF, labourB, commPerQtl, privateTrade) =>
    ({bagKg, labourF, labourB, commPerQtl, privateTrade, govtOn:!privateTrade, damiPct:2.5, mandiFeePct:3, rdfPct:3});
  /* v1.9.1: labour rates ship EMPTY — the munim enters the true per-crop rates
     at launch (blank = ₹0 in math, "–" on screen) */
  return {
    'ਕਣਕ':  c(50,   '', '', 46.00, false),
    'ਝੋਨਾ':  c(37.5, '', '', 45.88, false),
    'ਨਰਮਾ':  c(40,   '', '', 0,     true),
    'ਬਾਸਮਤੀ': c(35,   '', '', 0,     true)
  };
}

function cropCfgFor(crop){
  const k = cropKey(crop), def = defaultCropCfg()[k] || defaultCropCfg()['ਨਰਮਾ'];
  const c = (S().cropCfg || {})[k] || {};
  const num = (x, fb) => (x != null && isFinite(+x)) ? +x : fb;
  /* v1.9.1: a blank labour rate stays blank ('' → ''), never coerced to 0 —
     the weigh form must show an empty field for the munim to fill at launch */
  const numB = (x, fb) => (x === '' || x == null) ? '' : num(x, fb);
  return {
    bagKg: num(c.bagKg, num((S().bagWeight || {})[crop], def.bagKg)),
    labourF: numB(c.labourF, S().labourFarmer != null ? S().labourFarmer : def.labourF),
    labourB: numB(c.labourB, S().labourBuyer != null ? S().labourBuyer : def.labourB),
    commPerQtl: num(c.commPerQtl, def.commPerQtl),
    moisturePct: num(c.moisturePct, 0),
    msp: num(c.msp, 0),
    privateTrade: c.privateTrade != null ? !!c.privateTrade : (c.govtOn != null ? !c.govtOn : def.privateTrade),
    govtOn: c.privateTrade != null ? !c.privateTrade : (c.govtOn != null ? !!c.govtOn : !def.privateTrade),
    damiPct: num(c.damiPct, S().damiPct != null ? S().damiPct : def.damiPct),
    mandiFeePct: num(c.mandiFeePct, S().mandiFeePct != null ? S().mandiFeePct : def.mandiFeePct),
    rdfPct: num(c.rdfPct, S().rdfPct != null ? S().rdfPct : def.rdfPct)
  };
}

function addDays(iso, n){ const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }

function dayDiff(a, b){ return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 86400000); }

const payerType = b => (b && b.payerType) || 'private';

function cropKey(c){ return String(c || '').split(' · ')[0]; }

function katKgFor(h, kgKey, rsKey){
  if(h[kgKey] != null && h[kgKey] !== '') return h[kgKey];
  const rs = h[rsKey] || 0, aw = h.actWt || 0, rt = h.rate || 0;
  return (rs > 0 && aw > 0 && rt > 0) ? Math.round(rs * 100 / (aw * rt) * 100) / 100 : '';
}

const katRsFor = (kgQtl, awQtl, rate) => Math.round((kgQtl || 0) * (awQtl || 0) * (rate || 0) / 100);

function fasalPrevBal(fid, K){
  let amt = 0, found = false;
  K.rows.forEach(r => {
    if(r.sec !== 'txn' || !r.tid) return;
    const t = DB.txns.find(x => x.id === r.tid);
    /* A21: skip voided carry rows — a voided carry must not resurrect */
    if(t && t.kind === 'carry' && liveT(t)){ amt += (r.credit||0) - (r.debit||0); found = true; }
  });
  if(!found && K.ranged && K.from) amt = K.open;
  return {amt: amt};
}

function advNetOf(rows){
  let bal = 0, cropNet = 0;
  /* v1.1.3: skip dead rows — voided entries must not move the advance net */
  rows.forEach(r => { if(!rowLive(r)) return; bal += (r.credit||0) - (r.debit||0); if(r.sec === 'crop') cropNet += (r.credit||0) - (r.debit||0); });
  return r1(bal - cropNet);
}

function buyerFarmerHeaps(bid){
  const map = {};
  liftedHeaps().filter(h => h.buyerId === bid).forEach(h => {
    (map[h.farmerId] = map[h.farmerId] || []).push(h);
  });
  return map;
}

function buyerFarmerCropValue(bid, fid){
  /* v1.1.4 item 3: the agency owes the firm the crop value like any buyer —
     every lifted heap contributes its gross. */
  return r1((buyerFarmerHeaps(bid)[fid] || [])
    .reduce((s, h) => s + heapGross(h), 0));
}

function buyerFarmerCharges(bid, fid){
  const t = {comm:0, mandiFee:0, rdf:0, labourB:0, bardana:0, brok:0, total:0};
  (buyerFarmerHeaps(bid)[fid] || []).forEach(h => {
    const c = heapBuyerComp(h);
    t.comm += c.comm; t.mandiFee += c.mandiFee; t.rdf += c.rdf; t.labourB += c.labourB;
    t.bardana += c.bardana; t.brok += c.brok;
  });
  t.total = r1(t.comm + t.mandiFee + t.rdf + t.labourB + t.bardana + t.brok);
  return t;
}

function buyerFarmerCommPaid(bid, fid){
  const sid = activeSeasonId();
  return r1(DB.txns.filter(t => liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' &&
    t.farmerRef === fid && t.commPay && (!t.seasonId || t.seasonId === sid))
    .reduce((s, t) => s + (t.credit || 0), 0));
}

function buyerRelatedFarmers(bid){
  const ids = {};
  Object.keys(buyerFarmerHeaps(bid)).forEach(k => { ids[k] = 1; });
  DB.txns.forEach(t => {
    if(liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' && t.farmerRef && _payScope(null, t)) ids[t.farmerRef] = 1;
  });
  return Object.keys(ids).map(Number)
    /* v1.2.4 item 1: a deactivated farmer's dues still exist — the buyer
       ledger counts them, so the category totals must too. Both agree now. */
    .filter(fid => !!farmer(fid).id)
    .sort((a, b) => String(farmer(a).name || '').localeCompare(String(farmer(b).name || '')));
}

function buyerFarmerDue(bid, fid, ledger){
  if(ledger === 'comm') return r1(buyerFarmerCharges(bid, fid).total - buyerFarmerCommPaid(bid, fid));
  const received = r1(buyerReceipts(fid, null, bid).reduce((s, t) => s + (t.credit || 0), 0));
  return r1(buyerFarmerCropValue(bid, fid) - received);
}

function buyerDueByCat(bid){
  let crop = 0, comm = 0;
  buyerRelatedFarmers(bid).forEach(fid => {
    crop += buyerFarmerCropValue(bid, fid);
    comm += buyerFarmerCharges(bid, fid).total;
  });
  DB.txns.forEach(t => {
    if(!(liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' && _payScope(null, t))) return;
    /* cropPay and legacy pre-split receipts (no flag) reduce the crop dues —
       crop is the default ledger; commPay reduces the charges dues */
    if(t.commPay) comm -= (t.credit || 0);
    else crop -= (t.credit || 0);
  });
  crop = r1(crop); comm = r1(comm);
  return {crop:crop, comm:comm, total:r1(crop + comm)};
}

function _payScope(o, t){
  if(o && o.showAll) return true;
  if(!inActiveSeason(t)) return false;
  if(o && o.kFrom && t.date < o.kFrom) return false;
  if(o && o.kTo && t.date > o.kTo) return false;
  return true;
}

function buyerReceipts(fid, o, bid){
  return DB.txns.filter(t => liveT(t) && t.ptype === 'buyer' && t.kind === 'receipt' && t.cropPay &&
    t.farmerRef === fid && (!bid || t.pid === bid) && _payScope(o, t));
}

function payFlowAgg(fid, o, bid){
  const received = r1(buyerReceipts(fid, o, bid).reduce((s,t) => s + (t.credit || 0), 0));
  const status = received <= 0 ? 'pending' : 'received';
  return {received:received, recovery:0, held:0, payable:0, paid:0, remaining:0, status:status};
}

function farmerHasTxns(fid){
  const sid = activeSeasonId();
  return DB.txns.some(t => liveT(t) && t.ptype === 'farmer' && t.pid === fid && (!t.seasonId || t.seasonId === sid)) ||
         DB.heaps.some(h => h.farmerId === fid && (!h.seasonId || h.seasonId === sid));
}

function buyerTotalComm(bid){
  let t = 0;
  const groups = buyerFarmerHeaps(bid);
  Object.keys(groups).forEach(fid => groups[fid].forEach(h => { t += heapBuyerComp(h).comm || 0; }));
  return r1(t);
}

const liveT = t => !t.voided && !t.voids;

function rowLive(r){
  if(!r.tid) return true;
  const t = DB.txns.find(x => x.id === r.tid);
  return !t || liveT(t);
}

function psnap(ptype, pid){
  if(ptype === 'farmer'){ const f = farmer(pid); return {name: f.name || '—'}; }
  if(ptype === 'buyer'){ const b = buyer(pid); return {name: b.name || '—'}; }
  if(ptype === 'supplier'){ const s = supplier(pid); return {name: s.name || '—'}; }
  if(ptype === 'person'){ const p = person(pid); return {name: p.name || '—'}; }
  return {name: '—'};
}

const TIPPI_NEXT = new Set(['k', 'kh', 'g', 'gh', 'ng', 'ch', 'chh', 'j', 'jh', 't', 'th', 'd', 'dh', 'n', 'p', 'ph', 'b', 'bh', 'm', 's']);

const PA_VOWEL_CHARS = 'ਅਆਇਈਉਊਏਐਓਔ';

const PA_MATRA_CHARS = 'ਾਿੀੁੂੇੈੋੌ';

function enToPaWord(w) {
  if (/[\u0a00-\u0a7f]/.test(w)) return w; /* Punjabi typed in -> passes through untouched */
  if (PA_EXC_EN2PA[w]) return PA_EXC_EN2PA[w];
  for (const tail of PA_EXC_TAIL) {
    if (w.length > tail.length && w.endsWith(tail)) {
      const pre = w.slice(0, -tail.length);
      const join = PA_TAIL_JOIN[tail] && !'aeiou'.includes(pre[pre.length - 1]) ? PA_TAIL_JOIN[tail] : (PA_TAIL_WORD[tail] || PA_EXC_EN2PA[tail]);
      return enToPaWord(pre) + join;
    }
  }
  /* tokenize longest-match */
  const toks = [];
  let i = 0;
  while (i < w.length) {
    let matched = null;
    for (const [en, pa] of EN2PA_DIGRAPHS) {
      if (w.startsWith(en, i)) { matched = { en, pa, vowel: true }; break; }
    }
    if (!matched) {
      const ch = w[i];
      const pa = EN2PA_SINGLE[ch];
      if (pa === undefined) { i++; continue; }
      matched = { en: ch, pa, vowel: 'aeiou'.includes(ch) };
    }
    /* digraph consonants like bh/ch/sh are not vowels */
    if (!'aeiou'.includes(matched.en[0]) && !['aa', 'ee', 'oo', 'ai', 'au', 'ou'].includes(matched.en)) matched.vowel = false;
    toks.push(matched);
    i += matched.en.length;
  }
  let out = '';
  for (let t = 0; t < toks.length; t++) {
    const tok = toks[t], next = toks[t + 1], next2 = toks[t + 2];
    const atEnd = !next;
    if (tok.vowel) {
      const prev = out[out.length - 1] || '';
      const prevIsCons = prev && !PA_VOWEL_CHARS.includes(prev) && !PA_MATRA_CHARS.includes(prev) && prev !== 'ੰ' && prev !== 'ੱ';
      if (tok.en === 'a' && atEnd) { out += prevIsCons ? 'ਾ' : (out === '' ? 'ਅ' : 'ਆ'); continue; } /* Butta -> ਬੁੱਟਾ; bare "a" -> ਅ */
      if (tok.en === 'a' && prevIsCons) continue; /* inherent 'a': ਹਰ, ਅਮਰ */
      if (tok.en === 'e' && next && next.en === 'r' && !next2) continue; /* Sunder -> ਸੁੰਦਰ */
      if (tok.en === 'i' && next && next.en === 'r' && !next2) { out += prevIsCons ? 'ੀ' : 'ਈ'; continue; } /* Kashmir -> ਕਸ਼ਮੀਰ */
      if (tok.en === 'i' && next && next.en === 'sh' && !next2) { out += prevIsCons ? 'ੀ' : 'ਈ'; continue; } /* Jagdish -> ਜਗਦੀਸ਼ */
      if (tok.en === 'ai' && atEnd && prevIsCons) { out += 'ਾਈ'; continue; } /* Kurai -> ਕੁਰਾਈ */
      if (tok.en === 'u' && atEnd) { out += prevIsCons ? 'ੂ' : 'ਊ'; continue; } /* Risu -> ਰਿਸੂ */
      if (prevIsCons) { out += EN2PA_MATRA[tok.en] || ''; }
      else { out += tok.pa; }
      continue;
    }
    /* consonant */
    if ((tok.en === 'n' || tok.en === 'm') && next && !next.vowel && TIPPI_NEXT.has(next.en)) {
      out += 'ੰ'; /* Harvinder -> ਹਰਵਿੰਦਰ, Balwant -> ਬਲਵੰਤ */
      continue;
    }
    if (next && !next.vowel && next.en === tok.en) { out += 'ੱ'; continue; } /* doubled -> addak */
    out += tok.pa;
  }
  out = out.replace(/ੱ(.)\1/g, 'ੱ$1'); /* drop the duplicate left by addak */
  /* canonical precomposed nukta (NFC does not compose ਸ+਼) */
  out = out.replace(/\u0a38\u0a3c/g, '\u0a36').replace(/\u0a16\u0a3c/g, '\u0a59')
    .replace(/\u0a17\u0a3c/g, '\u0a5a').replace(/\u0a1c\u0a3c/g, '\u0a5b')
    .replace(/\u0a2b\u0a3c/g, '\u0a5e').replace(/\u0a32\u0a3c/g, '\u0a33');
  return out;
}

function enToPa(text) {
  if (!text) return '';
  return String(text).split(/(\s+)/).map(part => {
    if (/^\s+$/.test(part)) return part;
    /* agency acronyms & all-caps Latin stay Latin in both scripts */
    if (/^[A-Z0-9]+$/.test(part) || isGovtAgencyName(part)) return part;
    return enToPaWord(part.toLowerCase());
  }).join('').normalize('NFC');
}

const PA2EN_VOWEL = { 'ਅ': 'a', 'ਆ': 'a', 'ਇ': 'i', 'ਈ': 'i', 'ਉ': 'u', 'ਊ': 'u', 'ਏ': 'e', 'ਐ': 'ai', 'ਓ': 'o', 'ਔ': 'au' };

const PA2EN_MATRA = { 'ਾ': 'a', 'ਿ': 'i', 'ੀ': 'i', 'ੁ': 'u', 'ੂ': 'u', 'ੇ': 'e', 'ੈ': 'ai', 'ੋ': 'o', 'ੌ': 'au', [TIPPI]: 'n', [BINDI]: 'n' };

function paToEn(text) {
  if (!text) return '';
  /* precompose nukta forms that may arrive decomposed */
  const src = String(text)
    .replace(/\u0a38\u0a3c/g, '\u0a36').replace(/\u0a16\u0a3c/g, '\u0a59')
    .replace(/\u0a17\u0a3c/g, '\u0a5a').replace(/\u0a1c\u0a3c/g, '\u0a5b')
    .replace(/\u0a2b\u0a3c/g, '\u0a5e');
  const chars = [...src];
  let out = '';
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i], next = chars[i + 1];
    if (ch === 'ੱ') {
      const nn = chars[i + 1];
      if (nn && PA2EN_CONS[nn]) out += PA2EN_CONS[nn];
      continue;
    }
    if (PA2EN_MATRA[ch] !== undefined) { out += PA2EN_MATRA[ch]; continue; }
    if (PA2EN_CONS[ch]) {
      const base = PA2EN_CONS[ch];
      if (next === '੍') { out += base; i++; continue; }
      if (next === TIPPI || next === BINDI) { out += base + 'a' + PA2EN_MATRA[next]; i++; continue; }
      if (next && PA2EN_MATRA[next] !== undefined) { out += base + PA2EN_MATRA[next]; i++; continue; }
      if (next === 'ੱ') { out += base + 'a'; continue; }
      if (next && (PA2EN_CONS[next] || PA2EN_VOWEL[next])) { out += base + 'a'; continue; }
      out += base;
      continue;
    }
    if (PA2EN_VOWEL[ch] !== undefined) { out += PA2EN_VOWEL[ch]; continue; }
    if (ch === ' ') { out += ' '; continue; }
    if (/[a-zA-Z0-9]/.test(ch)) { out += ch; continue; } /* Latin/digits pass through */
  }
  /* capitalize each word: proper-name drafts */
  return out.split(/(\s+)/).map(w => /^\s*$/.test(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join('');
}

function interestSegments(fid, rate, from, to){
  /* At a season boundary, every live posted-interest entry before `from` has
     already become part of the farmer's carried balance. Fold it into opening
     principal once. Posted interest inside this range is deliberately ignored:
     each segment remains simple interest, never interest-on-interest.
     v1.1.3 Q18: a parchi debit counts EXACTLY like an udhar debit — no
     recovery semantics; recovered flags are ignored everywhere here.
     v1.1.3 Q5: RATE-PERIOD-AWARE — f.rateChanges splits the range at change
     dates: the old rate accrues the older period, the new rate only forward
     from its change date. `rate` is the fallback for dates before the first
     recorded change (legacy farmers). Each segment carries its own `rate`.
     P1.6: each segment's interest is kept RAW (intrRaw) — the posted/reported
     total is rounded ONCE via interestTotal(), never per segment. */
  const mine = t => inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid;
  const counts = t => liveT(t) && mine(t) && (t.kind === 'udhar' || t.kind === 'vasuli' || t.kind === 'parchi' || t.kind === 'carry');
  let udhar = 0, vasuli = 0;
  const apply = t => {
    if(t.kind === 'udhar' || t.kind === 'parchi' || (t.kind === 'carry' && (t.debit||0) > 0)) udhar += t.debit || 0;
    else if(t.kind === 'vasuli' || (t.kind === 'carry' && (t.credit||0) > 0)) vasuli += t.credit || 0;
  };
  DB.txns.filter(t => counts(t) && t.date < from).forEach(apply);
  const postedInterestBefore = DB.txns
    .filter(t => liveT(t) && mine(t) && t.kind === 'vyaaj' && t.date < from)
    .reduce((s,t) => s + (t.debit || 0), 0);
  const openingBalance = Math.max(0, udhar - vasuli + postedInterestBefore);
  const evts = DB.txns.filter(t => counts(t) && t.date >= from && t.date <= to);
  evts.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  /* Q5: the rate schedule — a change takes effect from its date forward */
  const hist = (((farmer(fid) || {}).rateChanges) || [])
    .filter(e => e && e.from && Number(e.rate) > 0)
    .sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  const rateFor = d => {
    let r = rate;
    hist.forEach(e => { if(e.from <= d) r = Number(e.rate); });
    return r;
  };
  const cuts = [from];
  evts.forEach(e => { if(cuts[cuts.length-1] !== e.date) cuts.push(e.date); });
  hist.forEach(e => { if(e.from > from && e.from <= to && cuts.indexOf(e.from) < 0) cuts.push(e.from); });
  cuts.sort();
  if(cuts[cuts.length-1] !== to) cuts.push(to);
  const segs = [];
  evts.filter(e => e.date === from).forEach(apply);
  for(let i = 0; i < cuts.length - 1; i++){
    const d0 = cuts[i], d1 = cuts[i+1], days = dayDiff(d0, d1);
    const r0 = rateFor(d0);
    const prin = Math.max(0, udhar - vasuli + postedInterestBefore);
    const intrRaw = prin > 0 && days > 0 ? prin * r0 / 100 * days / 30 : 0;
    segs.push({from:d0, to:d1, days, prin, intrRaw, rate:r0, udhar, vasuli, postedInterestBefore, openingBalance});
    evts.filter(e => e.date === d1).forEach(apply);
  }
  /* the range is inclusive: the closing day accrues exactly like any other
     day. Events dated `to` were applied at the end of the loop above, so this
     final segment sees the closing day's state — money moved on `to` counts
     for `to`, same as every other day. */
  const rC = rateFor(to);
  const prinC = Math.max(0, udhar - vasuli + postedInterestBefore);
  segs.push({from:to, to:to, days:1, prin:prinC, intrRaw:prinC > 0 ? prinC * rC / 100 / 30 : 0,
    rate:rC, udhar, vasuli, postedInterestBefore, openingBalance});
  return segs;
}

const r2 = n => Math.round((n || 0) * 100) / 100;

function interestTotal(segs){ return r2(segs.reduce((s,g) => s + (g.intrRaw || 0), 0)); }

function farmerRate125(f){
  f = f || {};
  return Number(f.interestRate) > 0 ? Number(f.interestRate)
    : (Number(f.vyajRate) > 0 ? Number(f.vyajRate) : 1.5);
}

function duesWalk(fid, till, withReceipts){
  const f = farmer(fid) || {};
  const baseRate = farmerRate125(f);
  const hist = (f.rateChanges || []).filter(e => e && e.from && Number(e.rate) > 0)
    .sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  const rateFor = d => { let r = baseRate; hist.forEach(e => { if(e.from <= d) r = Number(e.rate); }); return r; };
  const evts = [];
  let advGiven = 0, parchiTot = 0, vasuliTot = 0;
  DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid).forEach(t => {
    if(t.kind === 'udhar'){ evts.push({date:t.date, amt:(t.debit||0)}); advGiven += t.debit||0; }
    else if(t.kind === 'parchi'){ evts.push({date:t.date, amt:(t.debit||0)}); parchiTot += t.debit||0; }
    else if(t.kind === 'vasuli'){ evts.push({date:t.date, amt:-(t.credit||0)}); vasuliTot += t.credit||0; }
    else if(t.kind === 'carry'){ evts.push({date:t.date, amt:(t.debit||0) - (t.credit||0)}); }
  });
  let receiptCredit = 0;
  if(withReceipts){
    DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'buyer' && t.kind === 'receipt' &&
      t.cropPay && !t.directFarmer && t.farmerRef === fid).forEach(t => {
      evts.push({date:t.date, amt:-(t.credit||0)}); receiptCredit += t.credit||0;
    });
  }
  evts.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const range = activeSeasonRange();
  const from = range.from || todayStr();
  let raw = 0, interest = 0;
  /* opening: everything dated before the season range folds in */
  evts.filter(e => e.date < from).forEach(e => { raw += e.amt; });
  const cuts = [from];
  evts.forEach(e => { if(e.date >= from && e.date <= till && cuts.indexOf(e.date) < 0) cuts.push(e.date); });
  hist.forEach(e => { if(e.from > from && e.from <= till && cuts.indexOf(e.from) < 0) cuts.push(e.from); });
  cuts.sort();
  if(cuts[cuts.length - 1] !== till) cuts.push(till);
  const applyAt = d => { evts.filter(e => e.date === d).forEach(e => { raw += e.amt; }); };
  evts.filter(e => e.date === from).forEach(e => { raw += e.amt; });
  for(let i = 0; i < cuts.length - 1; i++){
    const d0 = cuts[i], d1 = cuts[i + 1], days = dayDiff(d0, d1);
    const prin = Math.max(0, raw);
    if(prin > 0 && days > 0) interest += prin * rateFor(d0) / 100 * days / 30;
    applyAt(d1);
  }
  /* the till day itself accrues, with its own events applied first —
     the same inclusive convention as interestSegments */
  const prinC = Math.max(0, raw);
  if(prinC > 0) interest += prinC * rateFor(till) / 100 / 30;
  return { principal: raw, interest: r2(interest), advGiven: r1(advGiven),
    parchiTot: r1(parchiTot), vasuliTot: r1(vasuliTot), receiptCredit: r1(receiptCredit) };
}

function coverPass125(fid){
  const f = farmer(fid) || {};
  const baseRate = farmerRate125(f);
  const hist = (f.rateChanges || []).filter(e => e && e.from && Number(e.rate) > 0)
    .sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  const rateFor = d => { let r = baseRate; hist.forEach(e => { if(e.from <= d) r = Number(e.rate); }); return r; };
  const evts = [];
  DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid).forEach(t => {
    if(t.kind === 'udhar' || t.kind === 'parchi') evts.push({date:t.date, amt:(t.debit||0), rcpt:false});
    else if(t.kind === 'vasuli') evts.push({date:t.date, amt:-(t.credit||0), rcpt:false});
    else if(t.kind === 'carry') evts.push({date:t.date, amt:(t.debit||0) - (t.credit||0), rcpt:false});
  });
  DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'buyer' && t.kind === 'receipt' &&
    t.cropPay && !t.directFarmer && t.farmerRef === fid).forEach(t => {
    evts.push({date:t.date, amt:-(t.credit||0), rcpt:true});
  });
  evts.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.rcpt === b.rcpt ? 0 : a.rcpt ? 1 : -1));
  let P = 0, I = 0, cleared = 0, last = null;
  const accrueTo = d => {
    if(last === null){ last = d; return; }
    const days = dayDiff(last, d);
    if(days > 0 && P > 0) I += P * rateFor(last) / 100 * days / 30;
    last = d;
  };
  evts.forEach(e => {
    accrueTo(e.date);
    if(e.rcpt){
      const outstanding = Math.max(0, P) + I;
      const cover = Math.min(-e.amt, outstanding);
      cleared += cover;
    }
    P += e.amt;
  });
  return r1(cleared);
}

function farmerReceipts125(fid){
  let firm = 0, direct = 0;
  DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'buyer' && t.kind === 'receipt' &&
    t.cropPay && t.farmerRef === fid).forEach(t => {
    if(t.directFarmer) direct += t.credit || 0; else firm += t.credit || 0;
  });
  return { firm: r1(firm), direct: r1(direct) };
}

function duesFigure(fid){
  const till = effectiveTill(fid);
  const w = duesWalk(fid, till, true);       /* with firm receipts riding the timeline */
  const w0 = duesWalk(fid, till, false);     /* the same book before any set-off */
  const recv = farmerReceipts125(fid);
  const sold = r1(liftedHeaps().filter(h => h.farmerId === fid).reduce((s,h) => s + heapFarmerNet(h), 0));
  const paidOut = r1(DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid &&
    t.kind === 'payment' && !t.directFarmer).reduce((s,t) => s + (t.debit||0), 0));
  /* a receipt larger than the principal covers the accrued
     interest too — dues is the single net of the whole walk */
  const duesBefore = r1(Math.max(0, w0.principal + w0.interest));
  const dues = r1(Math.max(0, w.principal + w.interest));
  const setOffCleared = coverPass125(fid);
  const balanceWithFirm = r1(Math.max(0, recv.firm - setOffCleared - paidOut));
  const stillToCome = r1(sold - recv.firm - recv.direct);
  return { till: till, tillSet: !!interestTillOf(fid),
    advGiven: w.advGiven, parchiTot: w.parchiTot, vasuliTot: w.vasuliTot,
    interest: w.interest, interestNoSetOff: w0.interest,
    principal: r1(Math.max(0, w.principal)), duesBefore: duesBefore, dues: dues,
    recvFirm: recv.firm, recvDirect: recv.direct, sold: sold, paidOut: paidOut,
    setOffCleared: setOffCleared, balanceWithFirm: balanceWithFirm,
    stillToCome: stillToCome,
    hasAdvance: (w.advGiven + w.parchiTot + w.vasuliTot) > 0 };
}

function buyerFacts125(bid){
  const purchased = r1(liftedHeaps().filter(h => h.buyerId === bid).reduce((s,h) => s + heapGross(h), 0));
  let recvFirm = 0, recvDirect = 0;
  DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'buyer' && t.pid === bid &&
    t.kind === 'receipt' && t.cropPay).forEach(t => {
    if(t.directFarmer) recvDirect += t.credit || 0; else recvFirm += t.credit || 0;
  });
  return { purchased: purchased, recvFirm: r1(recvFirm), recvDirect: r1(recvDirect),
    still: r1(purchased - recvFirm - recvDirect) };
}

function recoveryDebtors(){
  const out = [];
  DB.buyers.forEach(b => {
    const L = buyerLedger(b.id);
    const bal = r1(L.bal);
    if(bal > 0){
      const deb = L.rows.filter(r => (r.debit || 0) > 0);
      out.push({ptype:'buyer', pid:b.id, name:dName(b), bal, since:deb.length ? deb[0].date : ''});
    }
  });
  DB.farmers.forEach(f => {
    const L = farmerLedger(f.id);
    const bal = r1(-L.bal);
    if(bal > 0){
      const deb = L.rows.filter(r => (r.debit || 0) > 0);
      out.push({ptype:'farmer', pid:f.id, name:dName(f), bal, since:deb.length ? deb[0].date : ''});
    }
  });
  out.forEach(d => { d.d = activeRecovery().find(r => r.ptype === d.ptype && r.pid === d.pid && !r.done) || null; });
  /* overdue first, then by next-chase date, then no-date last */
  const t = todayStr();
  const key = d => !d.d || !d.d.nextDate ? 2 : (d.d.nextDate < t ? 0 : 1);
  const nd = d => (d.d && d.d.nextDate) || '';
  out.sort((a, b) => (key(a) - key(b)) || (nd(a) < nd(b) ? -1 : nd(a) > nd(b) ? 1 : 0));
  return out;
}

function validateBackup(imp){
  const errs = [];
  const idSet = {};
  /* P1.11: every money/stock collection gets id + shape checks */
  ['farmers','buyers','suppliers','heaps','txns','parchis','audit','expenses','recovery','bardana','claims','persons'].forEach(k => {
    idSet[k] = new Set();
    (imp[k] || []).forEach(x => {
      if(idSet[k].has(x.id)) errs.push(k + ': ਦੁਹਰੀ id · duplicate id ' + x.id);
      idSet[k].add(x.id);
    });
  });
  /* v1.2.4 item 3: claim serials must be unique too (module retired, data checked) */
  const claimSer = new Set();
  (imp.claims || []).forEach(c => {
    const s = c.serial != null ? c.serial : (c.srNo != null ? c.srNo : c.serialNo);
    if(s != null){ if(claimSer.has(s)) errs.push('ਦਾਅਵਾ · claim: ਦੁਹਰਾ ਸੀਰੀਅਲ · duplicate serial ' + s); claimSer.add(s); }
  });
  /* dates use the shared top-level isDate() strict check */
  const moneyOk = v => { const n = v == null ? 0 : v; return typeof n === 'number' && isFinite(n) && n >= 0; };
  const KNOWN_STATUS = ['arrived','sold','weighed','lifted'];
  const KNOWN_KIND = ['udhar','vasuli','vyaaj','payment','parchi','receipt','carry','opening']; /* v1.2.4 item 6 */
  if(imp.settings && imp.settings.sample) errs.push('sample data is not allowed');
  (imp.farmers || []).forEach(f => {
    if(!(typeof f.name === 'string' && f.name.trim())) errs.push('ਕਿਸਾਨ · farmer #' + f.id + ': name required');
    if(f.interestRate != null && (!(Number(f.interestRate) > 0) || !isFinite(Number(f.interestRate)))) errs.push('ਕਿਸਾਨ · farmer #' + f.id + ': bad interest rate');
  });
  (imp.buyers || []).forEach(b => { if(!(typeof b.name === 'string' && b.name.trim())) errs.push('ਵਪਾਰੀ · buyer #' + b.id + ': name required'); });
  (imp.suppliers || []).forEach(x => { if(!(typeof x.name === 'string' && x.name.trim())) errs.push('ਦੁਕਾਨ · supplier #' + x.id + ': name required'); });
  /* P1.11: heap register numbers are unique — two heaps with the same n
     would confuse the munim at the kanda */
  const heapN = new Set();
  (imp.heaps || []).forEach(h => {
    if(h.n != null){ if(heapN.has(h.n)) errs.push('ਢੇਰ · heap: ਦੁਹਰੀ ਨੰ · duplicate n ' + h.n); heapN.add(h.n); }
  });
  (imp.heaps || []).forEach(h => {
    const tag = 'ਢੇਰ · heap #' + (h.n != null ? h.n : h.id);
    if(h.farmerId != null && h.farmerId !== 0 && !idSet.farmers.has(h.farmerId)) errs.push(tag + ': unknown farmer');
    if(h.buyerId != null && h.buyerId !== 0 && !idSet.buyers.has(h.buyerId)) errs.push(tag + ': unknown buyer');
    if(!KNOWN_STATUS.includes(h.status)) errs.push(tag + ': bad status');
    if(!isDate(h.date)) errs.push(tag + ': bad date');
    if(!(typeof h.crop === 'string' && h.crop.trim())) errs.push(tag + ': crop required');
    ['estWt','actWt','rate'].forEach(f => { if(!moneyOk(h[f])) errs.push(tag + ': negative ' + f); });
    if(['sold','weighed','lifted'].includes(h.status) && (!(h.buyerId > 0) || !(h.rate > 0))) errs.push(tag + ': auction details incomplete');
    if(['weighed','lifted'].includes(h.status) && !(h.actWt > 0)) errs.push(tag + ': weighment incomplete');
    /* P1.11: I-form serial, when assigned, is a positive integer */
    if(h.iSerial != null && !(Number.isInteger(h.iSerial) && h.iSerial >= 1)) errs.push(tag + ': bad iSerial');
    /* P1.11: J-form voucher shape — the voucher is informational, but a
       corrupted shape would crash the comparison panel */
    if(h.jform != null){
      if(typeof h.jform !== 'object') errs.push(tag + ': bad jform');
      else {
        if(!(typeof h.jform.no === 'string' && h.jform.no.trim())) errs.push(tag + ': jform missing number');
        if(h.jform.auctionDate != null && h.jform.auctionDate !== '' && !isDate(h.jform.auctionDate)) errs.push(tag + ': jform bad date');
        if(!moneyOk(h.jform.weight) || !moneyOk(h.jform.rate) || !moneyOk(h.jform.total)) errs.push(tag + ': jform negative figures');
      }
    }
  });
  (imp.txns || []).forEach(t => {
    const tag = 'ਲੈਣ-ਦੇਣ · txn #' + t.id;
    const coll = t.ptype === 'farmer' ? 'farmers' : t.ptype === 'buyer' ? 'buyers' : t.ptype === 'supplier' ? 'suppliers' : t.ptype === 'person' ? 'persons' : null;
    /* v1.2.4 items 6/8: 'firm' rows (the opening-cash record) belong to no party — pid must be 0 */
    if(t.ptype === 'firm'){ if(t.pid !== 0) errs.push(tag + ': firm row must have pid 0'); }
    else if(!coll) errs.push(tag + ': bad ptype');
    else if(!idSet[coll].has(t.pid)) errs.push(tag + ': unknown party');
    if(!KNOWN_KIND.includes(t.kind)) errs.push(tag + ': bad kind');
    if(!isDate(t.date)) errs.push(tag + ': bad date');
    if(!moneyOk(t.debit) || !moneyOk(t.credit)) errs.push(tag + ': negative amount');
    /* P1.11: vyaaj postings carry their covered period — a flipped or
       dateless range would break the overlap guard */
    if(t.kind === 'vyaaj'){
      if(t.iFrom != null && !isDate(t.iFrom)) errs.push(tag + ': vyaaj bad iFrom');
      if(t.iTo != null && !isDate(t.iTo)) errs.push(tag + ': vyaaj bad iTo');
      if(isDate(t.iFrom) && isDate(t.iTo) && t.iFrom > t.iTo) errs.push(tag + ': vyaaj iFrom after iTo');
    }
    /* the app's invariant: every txn carries exactly one positive side, on the
       side natural to its kind — a both-sides or wrong-side txn can only come
       from a tampered backup and would corrupt the khata if imported */
    const dd = t.debit || 0, cc = t.credit || 0;
    if(!((t.kind === 'carry' && dd === 0 && cc === 0) || (dd > 0 && !(cc > 0)) || (cc > 0 && !(dd > 0)))) errs.push(tag + ': debit/credit must have exactly one side');
    else {
      const debitKinds = ['udhar','vyaaj','payment','parchi','carry'], creditKinds = ['vasuli','receipt','carry','opening']; /* v1.2.4 item 6: opening cash is a credit */
      if((dd > 0 && !debitKinds.includes(t.kind)) || (cc > 0 && !creditKinds.includes(t.kind)))
        errs.push(tag + ': amount on wrong side for kind ' + t.kind);
    }
    if(t.ptype === 'farmer' && !['udhar','vasuli','vyaaj','payment','parchi','carry'].includes(t.kind))
      errs.push(tag + ': kind not for farmer');
    if(t.ptype === 'buyer' && !['receipt','carry'].includes(t.kind))
      errs.push(tag + ': kind not for buyer');
    /* P1.11: supplier (shop) txns are shop-payments only — a corrupted kind
       would leak into the Daily book or ledgers */
    if(t.ptype === 'supplier' && t.kind !== 'payment')
      errs.push(tag + ': kind not for supplier');
    /* v1.2.4 items 6/8: person rows carry money kinds only; firm rows are the opening-cash record */
    if(t.ptype === 'person' && !['udhar','vasuli','payment','parchi'].includes(t.kind))
      errs.push(tag + ': kind not for person');
    if(t.ptype === 'firm' && t.kind !== 'opening')
      errs.push(tag + ': kind not for firm');
    if(t.ref != null && !idSet.parchis.has(t.ref)) errs.push(tag + ': bad parchi ref');
  });
  (imp.parchis || []).forEach(p => {
    const tag = 'ਪਰਚੀ · slip #' + p.id;
    if(p.farmerId > 0 && !idSet.farmers.has(p.farmerId)) errs.push(tag + ': unknown farmer');
    if(!(p.farmerId > 0) && !p.personId) errs.push(tag + ': parchi has no holder');
    if(p.personId && idSet.persons && !idSet.persons.has(p.personId)) errs.push(tag + ': unknown person');
    if(p.supplierId != null && !idSet.suppliers.has(p.supplierId)) errs.push(tag + ': unknown shop');
    if(!moneyOk(p.amount)) errs.push(tag + ': negative amount');
    if(!isDate(p.date)) errs.push(tag + ': bad date');
  });
  /* P1.11: expenses, recovery and bardana are money/stock records too */
  (imp.expenses || []).forEach(x => {
    const tag = 'ਖਰਚਾ · expense #' + x.id;
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!moneyOk(x.amount) || !(x.amount > 0)) errs.push(tag + ': bad amount');
  });
  (imp.recovery || []).forEach(x => {
    const tag = 'ਰਿਕਵਰੀ · recovery #' + x.id;
    const coll = x.ptype === 'farmer' ? 'farmers' : x.ptype === 'buyer' ? 'buyers' : null;
    if(!coll) errs.push(tag + ': bad ptype');
    else if(!idSet[coll].has(x.pid)) errs.push(tag + ': unknown party');
    if(x.nextDate != null && x.nextDate !== '' && !isDate(x.nextDate)) errs.push(tag + ': bad nextDate');
    if(x.created != null && x.created !== '' && !isDate(x.created)) errs.push(tag + ': bad created date');
  });
  (imp.bardana || []).forEach(x => {
    const tag = 'ਬਾਰਦਾਨਾ · bardana #' + x.id;
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!['purchase','issue','return','agency','agencyback'].includes(x.kind)) errs.push(tag + ': bad kind');
    if(!(x.qty > 0) || !Number.isInteger(x.qty)) errs.push(tag + ': bad qty');
  });
  /* Batch B #3: agency dues ledger (old format) — each entry references agency buyer + heaps */
  (imp.claims || []).forEach(x => {
    const tag = 'ਸਰਕਾਰੀ ਬਕਾਇਆ · govt dues #' + (x.n != null ? x.n : x.id);
    if(!(x.n > 0) || !Number.isInteger(x.n)) errs.push(tag + ': bad n');
    if(!isDate(x.date)) errs.push(tag + ': bad date');
    if(!['submitted','acknowledged','paid'].includes(x.status)) errs.push(tag + ': bad status');
    if(!idSet.buyers.has(x.agencyId)) errs.push(tag + ': unknown agency');
    if(!Array.isArray(x.heapIds) || !x.heapIds.length) errs.push(tag + ': bad heapIds');
    else x.heapIds.forEach(hid => { if(!idSet.heaps.has(hid)) errs.push(tag + ': unknown heap ' + hid); });
    if(!moneyOk(x.comm) || !moneyOk(x.charges)) errs.push(tag + ': negative figures');
    if(x.txnId != null && !idSet.txns.has(x.txnId)) errs.push(tag + ': unknown receipt txn');
  });
  (imp.heaps || []).forEach(h => {
    if(h.claimId != null && !(imp.claims || []).some(c => c.id === h.claimId)) errs.push('ਢੇਰ · heap #' + h.n + ': unknown govt dues entry');
  });
  ['damiPct','mandiFeePct','rdfPct','gstPct'].forEach(f => {
    const v = imp.settings && imp.settings[f];
    if(v != null && (typeof v !== 'number' || !(v >= 0 && v <= 100))) errs.push('settings: bad ' + f);
  });
  return errs;
}

function person(id){ return (DB.persons || []).find(p => p.id === id) || {}; }

function personTxns(id){
  return DB.txns.filter(t => liveT(t) && t.ptype === 'person' && t.pid === id)
    .slice().sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.id - b.id);
}

function personBalance(id){
  let bal = 0;
  personTxns(id).forEach(t => {
    if(t.kind === 'udhar' || t.kind === 'parchi' || t.kind === 'payment') bal += t.debit || 0;
    if(t.kind === 'vasuli') bal -= t.credit || 0;
  });
  return r1(bal);
}

function personInterest(id){
  const p = person(id);
  if(!p.interestOn) return 0;
  const rate = Number(p.rate) > 0 ? Number(p.rate) : (Number(S().defaultVyaj) || 1.5);
  const ev = [];
  personTxns(id).forEach(t => {
    if(t.kind === 'udhar' || t.kind === 'parchi' || t.kind === 'payment') ev.push({date:t.date, d:(t.debit || 0)});
    else if(t.kind === 'vasuli') ev.push({date:t.date, d:-(t.credit || 0)});
  });
  ev.sort((a,b) => a.date < b.date ? -1 : 1);
  let principal = 0, total = 0;
  for(let i = 0; i < ev.length; i++){
    principal += ev[i].d;
    const until = i + 1 < ev.length ? ev[i + 1].date : todayStr();
    let days = Math.round((Date.parse(until) - Date.parse(ev[i].date)) / 86400000);
    if(days < 1) days = 1;
    if(principal > 0) total += principal * rate / 100 / 30 * days;
  }
  return Math.round(total);
}

const isCashMode = m => !m || m === 'cash';

function txnCashSigned(t){
  /* v1.2.4 item 6: the opening-cash record IS drawer cash — the one firm
     record that seeds the Rokad (posted by openOpeningCashForm) */
  if(t.openingCash) return r1((t.credit || 0) - (t.debit || 0));
  /* opening balances are ledger positions carried from the paper khata, not
     cash movements — they never touch the drawer (v1.9.3.1 P0 fix) */
  if(t.opening) return 0;
  /* direct buyer→farmer money bypasses the drawer entirely — the firm never
     holds that cash (v1.2.4 item 25: every row of a direct pair is flagged) */
  if(t.directFarmer) return 0;
  /* v1.1 #7: a farmer vasuli sourced from a buyer payment is the SAME cash as
     the buyer receipt — counting it again would double-count the drawer */
  if(t.kind === 'vasuli' && t.ptype === 'farmer' && t.buyerRef) return 0;
  /* v1.2.4 item 8: other-person rows move money exactly like farmer rows —
     cash given to staff is drawer cash out, their repayment is cash in.
     (A parchi row is goods, never cash: it matches neither list.) */
  const inKind = (t.kind === 'vasuli' && (t.ptype === 'farmer' || t.ptype === 'person')) || (t.kind === 'receipt' && t.ptype === 'buyer');
  const outKind = ((t.kind === 'udhar' || t.kind === 'payment') && (t.ptype === 'farmer' || t.ptype === 'person')) ||
                  (t.kind === 'payment' && t.ptype === 'supplier');
  if(!inKind && !outKind) return 0;
  /* signed = credit − debit: +in / −out. Reversals mirror their original, so voids net to zero. */
  return (t.credit || 0) - (t.debit || 0);
}

function expCashSigned(e){
  if(e.type === 'in' || e.type === 'bank') return e.amount || 0;
  /* 'tobank' (🏦 ਬੈਂਕ ਵਿੱਚ ਜਮ੍ਹਾਂ · Deposited to bank): surplus cash leaves
     the drawer for the bank — a transfer, never a P&L expense */
  if(e.type === 'out' || e.type === 'tobank') return -(e.amount || 0);
  return 0;
}

function cashBalanceAsOf(d){
  let bal = 0;
  DB.txns.filter(t => t.date <= d).forEach(t => {
    if(!liveT(t)) return;
    if(isCashMode(t.mode)) bal += txnCashSigned(t);
  });
  DB.expenses.filter(e => e.date <= d && !e.voided).forEach(e => {
    if(e.type === 'bank' || e.type === 'tobank' || isCashMode(e.mode)) bal += expCashSigned(e);
  });
  return bal;
}

function expRokadLabel(e){
  const who = (e.person || '').trim();
  if(e.type === 'bank') return '🏦 ਬੈਂਕ ਤੋਂ · From bank';
  if(e.type === 'tobank') return '🏦 ਬੈਂਕ ਵਿੱਚ ਜਮ੍ਹਾਂ · Deposited to bank';
  if(e.type === 'in') return '💰 ' + (who || e.note || 'ਨਕਦ ਮਿਲਿਆ · Cash received');
  return '💵 ' + (who || expCatLabel(e.cat)) + (e.personal ? ' · ਘਰ ਦਾ ਖਰਚਾ' : '');
}

function expRokadSub(e){
  const bits = [];
  if(e.type === 'out') bits.push(e.personal ? 'ਨਿੱਜੀ · Personal (not a cost)' : expCatLabel(e.cat));
  else if(e.type === 'in') bits.push('ਨਕਦ ਮਿਲਿਆ · Cash received');
  else if(e.type === 'bank') bits.push('ਬੈਂਕ ਤੋਂ ਨਕਦ · Cash from bank');
  else if(e.type === 'tobank') bits.push('ਬੈਂਕ ਵਿੱਚ ਜਮ੍ਹਾਂ · Deposited to bank');
  if(e.mode && e.mode !== 'cash' && e.type !== 'bank' && e.type !== 'tobank') bits.push(modeLabel(e.mode, e.modeNote)); /* Q30: the cash-mode tag is clutter — every cash-book row is cash */
  /* the note is skipped only when it already IS the label (cash-received with no person named) */
  if(e.note && e.type !== 'bank' && e.type !== 'tobank' && !(e.type === 'in' && !(e.person || '').trim())) bits.push(e.note);
  return bits.join(' · ');
}

function cashbookData(d){
  const ins = [], outs = [];
  /* A9/Q1: the rokad is season-blind — a day's entries show by date alone,
     so past-season days still render after a switch */
  DB.txns.filter(t => t.date === d).forEach(t => {
    /* v1.1.3: voided entries are not cash movement — the ledger keeps the
       crossed-out trail, the cashbook shows only live money */
    if(!liveT(t)) return;
    if(!isCashMode(t.mode)) return;
    const c = txnCashSigned(t);
    if(!c) return;
    /* P1.2: prefer the party name frozen at posting time */
    const who = (t.partySnap && t.partySnap.name) ||
      (t.ptype === 'farmer' ? farmer(t.pid).name : t.ptype === 'buyer' ? buyer(t.pid).name : supplier(t.pid).name) || '—';
    const sub = SLIP_KIND[t.kind] || t.kind; /* Q30: no payment-mode tag — every cash-book row is cash-mode, so "· ਨਕਦ" is pure clutter */
    const rec = {label:(c > 0 ? '💰 ' : '💵 ') + who, sub, amt:Math.abs(c)};
    (c > 0 ? ins : outs).push(rec);
  });
  DB.expenses.filter(e => e.date === d).forEach(e => {
    if(!(e.type === 'bank' || e.type === 'tobank' || isCashMode(e.mode))) return;
    const c = expCashSigned(e);
    if(!c) return;
    /* A10: voided rows stay visible, crossed out — voided entries move no
       cash, so they are excluded from the sums below */
    const rec = {label:expRokadLabel(e), sub:expRokadSub(e), amt:Math.abs(c), id:e.id, voided:!!e.voided};
    (c > 0 ? ins : outs).push(rec);
  });
  const live = x => !x.voided;
  const sumIn = ins.filter(live).reduce((s,x) => s + x.amt, 0), sumOut = outs.filter(live).reduce((s,x) => s + x.amt, 0);
  const opening = cashBalanceAsOf(addDays(d, -1));
  return {ins, outs, sumIn, sumOut, net:sumIn - sumOut, opening, closing:opening + sumIn - sumOut};
}

/* ================= LOGIN + DATA (carried over from the v1.1.8 phone page) =================
   Behaviour identical to the previous page: login on EVERY visit, password
   in memory only, AES-256-GCM books.enc (PBKDF2-SHA256, salt
   'kachi-mirror-v1', 600k iterations), ciphertext cached for offline login,
   2-minute poll with a tap-to-refresh pill. Only the screens it drives are
   new: the login is restyled and mirrorApply renders this viewer. */
/* (The calc layer's own MIRROR const is declared above; the session password lives only in mirrorPw below — memory only, never stored.) */
const MIRROR_API = 'books.enc';
const MIRROR_LOGIN_ID = 'dhillonguntaj3@gmail.com';
let mirrorSessionPw = null;
let mirrorPushedAt = null, mirrorPolling = false, mirrorHasNew = false, mirrorOffline = false, mirrorPendingWrap = null;
function mirrorBoot(){

  setInterval(() => { if(navigator.onLine && mirrorSessionPw && !mirrorPolling) mirrorPoll(); }, 120000);

}
