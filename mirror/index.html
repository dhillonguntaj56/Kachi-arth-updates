/* kg per bori for a crop (PSAMB Gazette 29 Aug 2025, No. 1472; editable in Settings) */
function bagKgFor(crop){ const w = S().bagWeight || {}; return w[crop] || w[cropKey(crop)] || 0; }
/* quintals derived from a bori count: boris × kg ÷ 100 */
function boriQtl(boris, crop){ const kg = bagKgFor(crop); return (boris > 0 && kg > 0) ? boris * kg / 100 : 0; }
/* ---------------- Batch B #1: crop-wise settings ----------------
   One Settings screen, five crop tabs. Per crop: bori weight (kg), farmer /
   buyer labour (₹/qtl), govt commission (₹/qtl), govt-procurement toggle,
   dami / mandi-fee / RDF %. Wheat & paddy default to government procurement with
   the Centre's notified per-quintal commission (₹46.00 / ₹45.88 till RMS
   2026-27 — HBL 17 Mar 2026); cotton and basmati default to private
   (CCI usually absent). */
function defaultCropCfg(){
  const c = (bagKg, labourF, labourB, commPerQtl, privateTrade) =>
    ({bagKg, labourF, labourB, commPerQtl, privateTrade, govtOn:!privateTrade, damiPct:2.5, mandiFeePct:3, rdfPct:3});
  /* v1.9.1: labour rates ship EMPTY — the munim enters the true per-crop rates
     at launch (blank = ₹0 in math, "–" on screen) */
  return {
    'ਕਣਕ':  c(50,   '', '', 46.00, false),
    'ਝੋਨਾ':  c(37.5, '', '', 45.88, false),
    'ਨਰਮਾ':  c(40,   '', '', 0,     true),
    'ਬਾਸਮਤੀ': c(35,   '', '', 0,     true)
  };
}
/* merged crop config: stored per-crop values, over notified defaults, over
   legacy top-level settings (old DBs / backups that predate crop tabs) */
function cropCfgFor(crop){
  const k = cropKey(crop), def = defaultCropCfg()[k] || defaultCropCfg()['ਨਰਮਾ'];
  const c = (S().cropCfg || {})[k] || {};
  const num = (x, fb) => (x != null && isFinite(+x)) ? +x : fb;
  /* v1.9.1: a blank labour rate stays blank ('' → ''), never coerced to 0 —
     the weigh form must show an empty field for the munim to fill at launch */
  const numB = (x, fb) => (x === '' || x == null) ? '' : num(x, fb);
  return {
    bagKg: num(c.bagKg, num((S().bagWeight || {})[crop], def.bagKg)),
    labourF: numB(c.labourF, S().labourFarmer != null ? S().labourFarmer : def.labourF),
    labourB: numB(c.labourB, S().labourBuyer != null ? S().labourBuyer : def.labourB),
    commPerQtl: num(c.commPerQtl, def.commPerQtl),
    moisturePct: num(c.moisturePct, 0),
    msp: num(c.msp, 0),
    privateTrade: c.privateTrade != null ? !!c.privateTrade : (c.govtOn != null ? !c.govtOn : def.privateTrade),
    govtOn: c.privateTrade != null ? !c.privateTrade : (c.govtOn != null ? !!c.govtOn : !def.privateTrade),
    damiPct: num(c.damiPct, S().damiPct != null ? S().damiPct : def.damiPct),
    mandiFeePct: num(c.mandiFeePct, S().mandiFeePct != null ? S().mandiFeePct : def.mandiFeePct),
    rdfPct: num(c.rdfPct, S().rdfPct != null ? S().rdfPct : def.rdfPct)
  };
}
/* ---------------- Batch B #6: extra bag categories ----------------
   Gazette categories beyond the per-crop standard weight: Paddy D-1 (50 kg),
   Wheat D-3 (30 kg) — PSAMB notification No. 1472. The standard weight stays
   editable per crop in Settings; these named categories are fixed. */
const BAG_CATS = { 'ਕਣਕ':[{label:'D-3', kg:30}], 'ਝੋਨਾ':[{label:'D-1', kg:50}] };
function bagCatOptions(crop){
  const std = cropCfgFor(crop).bagKg || 0;
  const opts = [{label:'ਸਟੈਂਡਰਡ · Standard', kg:std}];
  (BAG_CATS[cropKey(crop)] || []).forEach(c => { if(c.kg !== std) opts.push({label:c.label, kg:c.kg}); });
  return opts;
}
function bagKgForCat(crop, catLabel){
  const o = bagCatOptions(crop).find(o => o.label === catLabel);
  return o ? o.kg : cropCfgFor(crop).bagKg || 0;
}
function boriQtlCat(boris, crop, catLabel){
  const kg = bagKgForCat(crop, catLabel);
  return (boris > 0 && kg > 0) ? boris * kg / 100 : 0;
}
/* ISO date helpers */
/* v1.9.5: date grouping labels — ਅੱਜ / ਕੱਲ੍ਹ / ਇਸ ਹਫ਼ਤੇ, then by date */
const dateGroupLabel = iso => {
  if(!iso) return '';
  const t = todayStr();
  if(iso === t) return 'ਅੱਜ · Today';
  if(iso === addDays(t, -1)) return 'ਕੱਲ੍ਹ · Yesterday';
  const dd = dayDiff(iso, t);
  if(dd > 1 && dd <= 7) return 'ਇਸ ਹਫ਼ਤੇ · This week';
  return dstr(iso);
};
function addDays(iso, n){ const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dayDiff(a, b){ return Math.round((new Date(b + 'T12:00:00Z') - new Date(a + 'T12:00:00Z')) / 86400000); }
/* buyer payer model — Punjab law: ALL market charges incl. 2.5% commission are
   paid by the BUYER; the government pays only for its own MSP procurement.
   Legacy buyers without a payerType default to private. The ONLY payer label
   ever shown next to a name is the exception case (government procurement). */
const payerType = b => (b && b.payerType) || 'private';
const isGovtBuyer = b => payerType(b) === 'government';
const agencyTag = b => isGovtBuyer(b) ? ' <span class="chip">ਸਰਕਾਰੀ · Govt</span>' : '';
/* A19: heap-context tags read the SAME frozen payer snapshot as the money
   math (heapCommForBuyer) — the tag can never contradict the charged
   commission. Buyer-master views (buyer list, buyer khata header) keep the
   live agencyTag: there the master record IS the truth. */
const heapGovt = h => (h.payerSnap || payerType(buyer(h.buyerId))) === 'government';
const heapAgencyTag = h => heapGovt(h) ? ' <span class="chip">ਸਰਕਾਰੀ · Govt</span>' : '';

/* v1.6.3: kaat is entered as kg per quintal — the mandi's daily language
   ("2 kg per quintal looking at the crop"). The books keep the ₹ figure:
   ₹ = kgPerQtl × quintals × rate ÷ 100, rounded to whole rupees.

/* ---------------- Batch B #5: two payment modes ----------------
   Govt (MSP) heaps: the farmer is paid by government payment, often before
   lifting ends — the munim records when the payment actually lands.
   Private heaps: lift first, buyer pays in days — the "payment pending" chip
   tracks collection via heap-linked ਉਗਰਾਹੀ. (Bridge payment removed v1.6.5:
   the family doesn't bridge; the farmer is settled when the buyer's money
   arrives.) */
/* heap status chip for the register: mode-aware payment/lift status */
/* bridge finance: pay the farmer NOW from our own funds for a private heap;
   posted as a real farmer 'payment' txn (voidable) with mandatory mode */
/* v1.6.5: openBridgeForm (bridge payment) removed — the family does not bridge;
   legacy heaps keep their bridge* fields in data, harmless. */
/* lift-cancel REVERSES the postings: in this app's derived ledger model the heap's
   buyer due and the farmer's sale/deduction entries exist only while the heap is
   'lifted' (liftedHeaps) — returning it to weighed/lift-pending removes them.
   Parchi rows (kind 'parchi', no heap link) are never touched. */
function undoLift(hid){
  const h = DB.heaps.find(x => x.id === hid);
  if(!h) return;
  /* v1.1.3: old seasons are fully immutable — same previous-season guard as voidTxn */
  if(h.seasonId && h.seasonId !== activeSeasonId()){ msgAlert('🔒 ਪੁਰਾਣਾ ਸੀਜ਼ਨ ਬੰਦ ਹੈ · Previous season is locked'); return; }
  /* reversing removes postings dated with the heap — lock against the heap's date */
  if(guardLedger(h.date, h.farmerId)) return; /* A4: lift-cancel respects the season lock */
  const b = buyer(h.buyerId);
  /* P1.1: money linked to THIS heap blocks the cancel \u2014 payments are
     stamped with heapRef (single-heap entries) or heapIds (settlements) at
     posting time. Unlinked legacy payments dated on/after the heap date still
     block conservatively; payments linked to OTHER heaps never block. */
  const linked = DB.txns.filter(t => liveT(t) && ((t.heapRef === h.id) || (t.heapIds && t.heapIds.indexOf(h.id) >= 0)));
  const legacy = DB.txns.filter(t => liveT(t) && t.heapRef == null && !(t.heapIds && t.heapIds.length) &&
    ((t.ptype === 'buyer' && t.pid === h.buyerId && t.kind === 'receipt') ||
     (t.ptype === 'farmer' && t.pid === h.farmerId && t.kind === 'payment')) &&
    t.date >= h.date);
  const blockers = linked.concat(legacy.filter(t => linked.indexOf(t) < 0));
  if(blockers.length){
    const bPay = blockers.filter(t => t.ptype === 'buyer').length;
    const fPay = blockers.filter(t => t.ptype === 'farmer').length;
    msgAlert('\u26d4 \u0a32\u0a3f\u0a2b\u0a1f \u0a30\u0a71\u0a26 \u0a28\u0a39\u0a40\u0a02 \u0a39\u0a4b \u0a38\u0a15\u0a26\u0a40 \u00b7 Cannot cancel this lift\n' +
      '\u0a07\u0a38 \u0a22\u0a47\u0a30 \u0a26\u0a47 \u0a09\u0a71\u0a24\u0a47 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u0a26\u0a30\u0a1c \u0a39\u0a48 \u00b7 Payments are linked against this heap\u2019s postings:\n' +
      (bPay ? '\u00b7 \u0a35\u0a2a\u0a3e\u0a30\u0a40 \u0a35\u0a38\u0a42\u0a32\u0a40 \u00b7 Buyer receipts: ' + bPay + '\n' : '') +
      (fPay ? '\u00b7 \u0a15\u0a3f\u0a38\u0a3e\u0a28 \u0a2d\u0a41\u0a17\u0a24\u0a3e\u0a28 \u00b7 Farmer payments: ' + fPay + '\n' : '') +
      '\u0a2a\u0a39\u0a3f\u0a32\u0a3e\u0a02 \u0a09\u0a39 \u0a10\u0a02\u0a1f\u0a30\u0a40 \u0a35\u0a4b\u0a07\u0a21 \u0a15\u0a30\u0a4b, \u0a2b\u0a3f\u0a30 \u0a32\u0a3f\u0a2b\u0a1f \u0a30\u0a71\u0a26 \u0a15\u0a30\u0a4b \u00b7 Void those entries first, then cancel the lift.');
    return;
  }
  msgConfirm('\u0a22\u0a47\u0a30 #' + h.n + ' \u0a26\u0a3e \u0a1a\u0a41\u0a71\u0a15\u0a23\u0a3e \u0a35\u0a3e\u0a2a\u0a38 \u0a15\u0a30\u0a28\u0a3e \u0a39\u0a48? \u00b7 Cancel lift for heap #' + h.n + '?\n' +

/* v1.1 #5: heap delete — arrived/sold/weighed heaps carry no postings and are
   removed directly; a lifted heap's postings are reversed first (same guards
   as lift-cancel: linked payments block the delete). */
/* C1 (his APPROVED verdict — reverses v1.1 #5): the heap popup's delete button
   is now void/retire. The heap is marked voided with an audit record and
   hidden from the active register — never destructively removed. Lifted heaps
   keep the posting-reversal first (same linked-payment guards), then
   void instead of remove. Arrived/weighed heaps void directly. */
function voidHeap(hid){
  const h = DB.heaps.find(x => x.id === hid);
  if(!h || h.voided) return;
  /* v1.1.3: old seasons are fully immutable — same previous-season guard as voidTxn */
  if(h.seasonId && h.seasonId !== activeSeasonId()){ msgAlert('🔒 ਪੁਰਾਣਾ ਸੀਜ਼ਨ ਬੰਦ ਹੈ · Previous season is locked'); return; }
  if(guardLedger(h.date, h.farmerId)) return; /* A4/B7: season + day lock */
  if(h.status === 'lifted'){
    const linked = DB.txns.filter(t => liveT(t) && ((t.heapRef === h.id) || (t.heapIds && t.heapIds.indexOf(h.id) >= 0)));
    const legacy = DB.txns.filter(t => liveT(t) && t.heapRef == null && !(t.heapIds && t.heapIds.length) &&
      ((t.ptype === 'buyer' && t.pid === h.buyerId && t.kind === 'receipt') ||
       (t.ptype === 'farmer' && t.pid === h.farmerId && t.kind === 'payment')) &&
      t.date >= h.date);
    const blockers = linked.concat(legacy.filter(t => linked.indexOf(t) < 0));
    if(blockers.length)
      return msgAlert('⛔ ਢੇਰ #' + h.n + ' ਵੋਇਡ ਨਹੀਂ ਹੋ ਸਕਦਾ · Cannot void heap #' + h.n + '\n' +
        'ਇਸ ਢੇਰ ਦੇ ਉੱਤੇ ਭੁਗਤਾਨ ਦਰਜ ਹੈ · Payments are linked against this heap\u2019s postings.\n' +
        'ਪਹਿਲਾਂ ਉਹ ਐਂਟਰੀ ਵੋਇਡ ਕਰੋ, ਫਿਰ ਵੋਇਡ ਕਰੋ · Void those entries first, then void.');
  }
  msgConfirm('ਢੇਰ #' + h.n + ' ਵੋਇਡ ਕਰਨਾ ਹੈ? · Void heap #' + h.n + '?\n' +
    (h.status === 'lifted' ? 'ਲਿਫਟ ਦੀਆਂ ਐਂਟਰੀਆਂ ਵਾਪਸ ਹੋ ਜਾਣਗੀਆਂ · The lift postings will be reversed.\n' : '') +
    'ਢੇਰ ਰਜਿਸਟਰ ਵਿੱਚੋਂ ਹਟ ਜਾਵੇਗਾ, ਪਰ ਰਿਕਾਰਡ ਰਹੇਗਾ · It leaves the register but the record stays.', () => {
    if(h.status === 'lifted'){
      h.status = 'weighed';
      audit('↩️ ਲਿਫਟ ਰੱਦ · Lift reversed for heap void', 'ਢੇਰ #' + h.n + ' · buyer due and farmer sale/deduction reversed');
    }
    h.voided = true; h.voidedAt = new Date().toISOString();
    audit('🚫 ਢੇਰ ਵੋਇਡ · Heap voided', 'ਢੇਰ #' + h.n + ' · ' + (h.crop || '') + ' · ' + ((farmer(h.farmerId) || {}).name || ''));
    save(); closeModal();
    /* A10: the void button also lives in the heap-detail info popup (not in
       #modal-root) — take it down on a completed void */
    document.querySelectorAll('.info-popup').forEach(p => p.remove());
    go('heaps');
  });
}

   viewing the season, K.open when a manual date range is set. The caller
   hides the strip when the amount is zero (Guntaj's rule). */
function fasalPrevBal(fid, K){
  let amt = 0, found = false;
  K.rows.forEach(r => {
    if(r.sec !== 'txn' || !r.tid) return;
    const t = DB.txns.find(x => x.id === r.tid);
    /* A21: skip voided carry rows — a voided carry must not resurrect */
    if(t && t.kind === 'carry' && liveT(t)){ amt += (r.credit||0) - (r.debit||0); found = true; }
  });
  if(!found && K.ranged && K.from) amt = K.open;
  return {amt: amt};
}

/* v1.1 #7 + #13: advance-book-only net = ledger balance minus the crop
   component. Zero ⟺ the advance side nets to zero — a payable is then
   entirely crop money, never a loan. */
function advNetOf(rows){
  let bal = 0, cropNet = 0;
  /* v1.1.3: skip dead rows — voided entries must not move the advance net */
  rows.forEach(r => { if(!rowLive(r)) return; bal += (r.credit||0) - (r.debit||0); if(r.sec === 'crop') cropNet += (r.credit||0) - (r.debit||0); });
  return r1(bal - cropNet);
}
/* v1.2: ਉਧਾਰ ਖਾਤਾ · advance book — money ledger. Summary (ਕੁੱਲ · Totals)
   on top; every transaction on its own dated line below. Flat newest-first,
   no date-group headers. Single amount column; green = in, red = out. */
function farmerUdharHtml(fid, K, o){
  const inR = h => (!o.kFrom || h.date >= o.kFrom) && (!o.kTo || h.date <= o.kTo);
  const heaps = ((o.showAll ? DB.heaps.filter(h => !h.voided && h.status === 'lifted') : liftedHeaps()).filter(h => h.farmerId === fid)).filter(inR);
  let slips = 0, adv = 0, vas = 0, fsl = 0, intr = 0, paid = 0;
  K.rows.forEach(r => {
    if(r.sec !== 'txn' || !r.tid) return;
    const t = DB.txns.find(x => x.id === r.tid);
    if(!t) return;
    /* v1.1.3: voided originals and their reversals are skipped — the pair nets
       to zero in the running balance, but unsigned category totals must not
       count the voided side (bug: voided interest kept showing in Interest
       total while the net correctly excluded it) */
    if(!liveT(t)) return;
    if(t.kind === 'parchi') slips += (r.debit||0);
    else if(t.kind === 'udhar') adv += (r.debit||0);
    /* v1.5.1 payment-flow: vasuli from the buyer flow (cropFirmSlice) is
       Recovery — never mixed into farmer-repaid vasuli */
    else if(t.kind === 'vasuli'){ if(t.cropFirmSlice) fsl += (r.credit||0); else vas += (r.credit||0); }
    else if(t.kind === 'vyaaj') intr += (r.debit||0);
    else if(t.kind === 'payment') paid += (r.debit||0);
  });
  /* v1.1.3 A4: the totals block must reconcile to the Net row — every row is
     one signed piece of K.bal. Crop = GROSS sale credits (not net); expenses
     subtract ONCE (all heap deductions incl. legacy heap parchi). Signed:
     −slips −adv +vas +fsl −paid +cropGross −expTot −intr ±pb = Net. */
  let cropGross = 0, expTot = 0;
  const heapNets = heaps.map(h => {
    const dc = heapDedComp(h);
    const exp = (dc.katMoist||0) + (dc.katTrash||0) + (dc.labourF||0);
    expTot += heapFarmerDed(h);
    const net = heapGross(h) - exp - (dc.parchi||0);
    cropGross += heapGross(h);
    return {h:h, net:net};
  });
  cropGross = r1(cropGross); expTot = r1(expTot);
  const pb = fasalPrevBal(fid, K);
  const net = K.bal;
  /* v1.1 #7: when the payable is entirely crop money (advance side nets to
     zero), it must not read as a loan */
  const advSideZero = advNetOf(K.rows) === 0;
  const netWord = net > 0
    ? (advSideZero ? '🌾 ਫਸਲ ਦੇ ਪੈਸੇ · Crop money' : 'ਕਿਸਾਨ ਨੂੰ ਦੇਣਾ · Firm Owes Farmer')
    : net < 0 ? 'ਕਿਸਾਨ ਨੇ ਦੇਣਾ · Farmer Owes Firm' : 'ਬਰਾਬਰ · Settled';
  /* v1.1.3 Q27: the net card shows JUST ਲੈਣਾ/ਦੇਣਾ + amount (+ interest tag).
     No payment-status pill, no 'ਬਾਕੀ · Net' header, no extra breakdown lines. */
  let html = '<div class="card">' +
    '<div style="font-size:1.5rem;font-weight:800;margin:4px 0">' +
    (net !== 0 ? '<span class="' + (net > 0 ? 'amt-in' : 'amt-out') + '">' + fmt(Math.abs(net)) + '</span>' : '<span class="muted">–</span>') +
    '</div><div class="micro">' + (net > 0 ? 'ਦੇਣਾ · To pay' : net < 0 ? 'ਲੈਣਾ · To receive' : 'ਬਰਾਬਰ · Settled') + '<br>' + interestTag(fid) + '</div></div>';
  html += '<table><tr><th>ਕੁੱਲ · Totals</th><th class="num">ਰਕਮ · Amount</th>' + (o.print ? '' : '<th></th>') + '</tr>';
  /* v1.1 #1: a totals row renders ONLY when it has a value — dash rows are hidden */
  const tpad = o.print ? '' : '<td></td>';
  if(slips) html += '<tr><td>🧾 ਪਰਚੀ · Slips total<span class="micro">shop advances — debit</span></td><td class="num amt-out">' + fmt(slips) + '</td>' + tpad + '</tr>';
  if(adv) html += '<tr><td>💰 ਉਧਾਰ · Advance given total<span class="micro">cash given — debit</span></td><td class="num amt-out">' + fmt(adv) + '</td>' + tpad + '</tr>';
  if(vas) html += '<tr><td>💰 ਵਸੂਲੀ · Payback received total<span class="micro">farmer repaid — credit</span></td><td class="num amt-in">' + fmt(vas) + '</td>' + tpad + '</tr>';
  /* v1.5.1 payment-flow: recovery is its own staged line — "his debt cleared — auto" */
  if(fsl) html += '<tr><td>🏦 ਆੜ੍ਹਤ ਦੀ ਵਸੂਲੀ · Recovery from buyer payment<span class="micro">ਕਿਸਾਨ ਦਾ ਕਰਜ਼ਾ ਕੱਟਿਆ — ਆਟੋ · debt cleared, auto</span></td><td class="num amt-in">' + fmt(fsl) + '</td>' + tpad + '</tr>';
  if(paid) html += '<tr><td>💵 ਭੁਗਤਾਨ · Payments to farmer total<span class="micro">paid out — debit</span></td><td class="num amt-out">' + fmt(paid) + '</td>' + tpad + '</tr>';
  if(cropGross) html += '<tr><td>🌾 ਫਸਲ · Crop sale credits<span class="micro">gross sales — credit</span></td><td class="num amt-in">' + fmt(cropGross) + '</td>' + tpad + '</tr>';
  if(expTot) html += '<tr><td>💸 ਖਰਚੇ · Expenses total<span class="micro">deductions + labour — debit</span></td><td class="num amt-out">' + fmt(expTot) + '</td>' + tpad + '</tr>';
  /* v1.1 #1: interest row shows once interest is posted with a value.
     v1.1.3 A4: interest is a debit (farmer owes more) — red like the other
     debit rows, so the block's signed arithmetic lands on the Net row. */
  if(intr) html += '<tr><td>📈 ਵਿਆਜ · Interest total<span class="micro">charged — debit</span></td><td class="num amt-out">' + fmt(intr) + '</td>' + tpad + '</tr>';
  if(pb.amt !== 0){
    /* v1.1 #14: ਬਕਾਇਆ → ਹਿਸਾਬ */
    html += '<tr><td>🌾 ਪਿਛਲੇ ਸੀਜ਼ਨ ਦਾ ਹਿਸਾਬ · Previous season account</td><td class="num ' + (pb.amt > 0 ? 'amt-in' : 'amt-out') + '"><b>' + fmt(Math.abs(pb.amt)) + '</b></td>' + tpad + '</tr>';
  }
  html += '<tr><td><b>ਬਾਕੀ · Net</b> — ' + netWord + '<br>' + interestTag(fid) + '</td><td class="num"><b>' + fmt(Math.abs(net)) + '</b></td>' + (o.print ? '' : '<td></td>') + '</tr></table>';
  /* transactions: money rows + one grouped crop row per crop, newest first */
  const lines = [];
  K.rows.forEach(r => { if(r.sec === 'txn') lines.push({date:r.date, r:r}); });
  /* v1.1 #12: group crop rows by crop — one row per crop type, heap numbers
     comma-separated, summed net, sorted by the newest heap's date */
  const byCrop = {};
  heapNets.forEach(hn => {
    const ck = String(hn.h.crop || '');
    (byCrop[ck] = byCrop[ck] || []).push(hn);
  });
  Object.keys(byCrop).forEach(ck => {
    const grp = byCrop[ck].sort((a,b) => a.h.n - b.h.n);
    const gnet = grp.reduce((s,g) => s + g.net, 0);
    const newest = grp.reduce((a,b) => (a.h.date > b.h.date ? a : b));
    lines.push({date:newest.h.date, cropGrp:{crop:ck, heaps:grp, net:gnet}});
  });
  lines.forEach((l, i) => l._i = i);
  lines.sort((a,b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b._i - a._i));
  html += '<h3 style="margin:14px 0 6px">ਲੈਣ-ਦੇਣ · Transactions</h3>';
  if(!lines.length){
    html += '<div class="empty-state"><div class="es-title">ਕੋਈ ਲੈਣ-ਦੇਣ ਨਹੀਂ · No transactions yet</div></div>';
    return html;
  }
  html += '<table><tr><th>ਵੇਰਵਾ · Detail</th><th class="num">ਰਕਮ · Amount</th>' + (o.print ? '' : '<th></th>') + '</tr>';
  lines.forEach(l => {
    if(l.cropGrp){
      const g = l.cropGrp;
      const cropNm = esc(g.crop.replace(' · ', ' '));
      const heapLbl = o.print
        ? '🌾 ਫਸਲ · Crop — ' + cropNm + ' — ਢੇਰ #' + g.heaps.map(x => x.h.n).join(', #')
        : '🌾 ਫਸਲ · Crop — ' + cropNm + ' — ' + g.heaps.map(x => '<button class="hlink" onclick="showHeapPopup(' + x.h.id + ')">ਢੇਰ #' + x.h.n + '</button>').join(', ');
      html += '<tr><td><span class="txn-ic" style="background:#f5f5f5">🌾</span><span class="en">' + dstr(l.date) + '</span><br>' + heapLbl + '</td>' +
        '<td class="num amt-in">' + fmt0(g.net) + '</td>' + (o.print ? '' : '<td></td>') + '</tr>';
    } else {
      html += udharRowHtml(l.r, o.print);
    }
  });
  return html + '</table>';
}

function openBuyerLedger(bid, ledger){
  go('buyers', {type:'buyer', id:+bid, ledger:ledger, fid:null});
}
function openBuyerFarmer(bid, ledger, fid){
  go('buyers', {type:'buyer', id:+bid, ledger:ledger, fid:+fid});
}
/* this buyer's lifted heaps, grouped by farmer */
function buyerFarmerHeaps(bid){
  const map = {};
  liftedHeaps().filter(h => h.buyerId === bid).forEach(h => {
    (map[h.farmerId] = map[h.farmerId] || []).push(h);
  });
  return map;
}
function buyerFarmerCropValue(bid, fid){
  /* v1.1.4 item 3: the agency owes the firm the crop value like any buyer —
     every lifted heap contributes its gross. */
  return r1((buyerFarmerHeaps(bid)[fid] || [])
    .reduce((s, h) => s + heapGross(h), 0));
}
/* itemized firm charges for one farmer's heaps via this buyer */
function buyerFarmerCharges(bid, fid){
  const t = {comm:0, mandiFee:0, rdf:0, labourB:0, bardana:0, brok:0, total:0};
  (buyerFarmerHeaps(bid)[fid] || []).forEach(h => {
    const c = heapBuyerComp(h);
    t.comm += c.comm; t.mandiFee += c.mandiFee; t.rdf += c.rdf; t.labourB += c.labourB;
    t.bardana += c.bardana; t.brok += c.brok;
  });
  t.total = r1(t.comm + t.mandiFee + t.rdf + t.labourB + t.bardana + t.brok);
  return t;
}
/* commission payments already received for one farmer (buyer credits) */
function buyerFarmerCommPaid(bid, fid){
  const sid = activeSeasonId();
  return r1(DB.txns.filter(t => liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' &&
    t.farmerRef === fid && t.commPay && (!t.seasonId || t.seasonId === sid))
    .reduce((s, t) => s + (t.credit || 0), 0));
}
/* v1.9.5 A2/C2 — buyer dues by category.
   Farmers related to a buyer = lifted heaps via this buyer + any buyer
   receipt tagged to them (active season, live txns only). */
function buyerRelatedFarmers(bid){
  const ids = {};
  Object.keys(buyerFarmerHeaps(bid)).forEach(k => { ids[k] = 1; });
  DB.txns.forEach(t => {
    if(liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' && t.farmerRef && _payScope(null, t)) ids[t.farmerRef] = 1;
  });
  return Object.keys(ids).map(Number)
    .filter(fid => { const f = farmer(fid); return f && f.active !== false; })
    .sort((a, b) => String(farmer(a).name || '').localeCompare(String(farmer(b).name || '')));
}
/* one farmer's outstanding with one buyer, by ledger */
function buyerFarmerDue(bid, fid, ledger){
  if(ledger === 'comm') return r1(buyerFarmerCharges(bid, fid).total - buyerFarmerCommPaid(bid, fid));
  const received = r1(buyerReceipts(fid, null, bid).reduce((s, t) => s + (t.credit || 0), 0));
  return r1(buyerFarmerCropValue(bid, fid) - received);
}
/* whole buyer's outstanding by category: crop (heap gross − crop receipts) /
   commission-expenses (heap charges − comm receipts) */
function buyerDueByCat(bid){
  let crop = 0, comm = 0;
  buyerRelatedFarmers(bid).forEach(fid => {
    crop += buyerFarmerCropValue(bid, fid);
    comm += buyerFarmerCharges(bid, fid).total;
  });
  DB.txns.forEach(t => {
    if(!(liveT(t) && t.ptype === 'buyer' && t.pid === bid && t.kind === 'receipt' && _payScope(null, t))) return;
    /* cropPay and legacy pre-split receipts (no flag) reduce the crop dues —
       crop is the default ledger; commPay reduces the charges dues */
    if(t.commPay) comm -= (t.credit || 0);
    else crop -= (t.credit || 0);
  });
  crop = r1(crop); comm = r1(comm);
  return {crop:crop, comm:comm, total:r1(crop + comm)};
}
/* ================================================================
   v1.5.1 payment-flow redesign: ONE vocabulary in the buyer view and
   the farmer ledgers. All figures below are auto-calculated; nothing
   here marks money as received — confirmation is always manual.
   - Expected buyer payment: from heaps, labelled as calculated, never "received"
   - Firm Recovery: confirmed buyer money that cleared the farmer's outstanding
   - Farmer Payable: received minus recovery — what the farmer is owed
   - Paid to Farmer: manual farmer payments linked to the buyer flow (installments)
   - Remaining Farmer Payable: payable minus paid
   - Status: pending | received (money in, farmer not yet paid) | partial | settled
   Scope o = {showAll, kFrom, kTo} like the ledger views; bid narrows to one buyer.
   ================================================================ */
function _payScope(o, t){
  if(o && o.showAll) return true;
  if(!inActiveSeason(t)) return false;
  if(o && o.kFrom && t.date < o.kFrom) return false;
  if(o && o.kTo && t.date > o.kTo) return false;
  return true;
}
function buyerReceipts(fid, o, bid){
  return DB.txns.filter(t => liveT(t) && t.ptype === 'buyer' && t.kind === 'receipt' && t.cropPay &&
    t.farmerRef === fid && (!bid || t.pid === bid) && _payScope(o, t));
}
/* v1.1.3 two-books: firmRecoveryTxns / farmerPaidTxns / securityHeld deleted —
   farmer postings from buyer receipts no longer exist (Q10/Q11), and the
   holdback automation was removed (Q16). */
/* v1.1.3 two-books: buyer-side aggregate only — received + status.
   The farmer-side concepts (recovery/held/payable/paid) were cross-book
   leakage and are gone. Kept minimal for the advance-book status pill. */
function payFlowAgg(fid, o, bid){
  const received = r1(buyerReceipts(fid, o, bid).reduce((s,t) => s + (t.credit || 0), 0));
  const status = received <= 0 ? 'pending' : 'received';
  return {received:received, recovery:0, held:0, payable:0, paid:0, remaining:0, status:status};
}
/* settlement status pill — auto from the numbers, same words both sides.
   v1.5.1 #1: before any buyer payment is confirmed there is no painting —
   the pending state is plain words, not a colored pill. */
function payStatusPill(st){
  if(st === 'settled') return '<span class="pill pill-g">🟢 ਪੂਰਾ ਹਿਸਾਬ · Fully settled</span>';
  if(st === 'partial') return '<span class="pill pill-w">🟠 ਅਧੂਰਾ ਭੁਗਤਾਨ · Partially paid</span>';
  if(st === 'received') return '<span class="pill pill-w">🟠 ਭੁਗਤਾਨ ਆਇਆ — ਕਿਸਾਨ ਬਾਕੀ · Payment received, farmer pending</span>';
  return '<span class="muted">ਬਾਕੀ — ਕੋਈ ਭੁਗਤਾਨ ਦਰਜ ਨਹੀਂ · Pending, no payment recorded</span>';
}
/* v1.5.1 #12: does this farmer have ANY live presence this season (txn or heap)?
   Farmers with none are never gated and never block the season change. */
function farmerHasTxns(fid){
  const sid = activeSeasonId();
  return DB.txns.some(t => liveT(t) && t.ptype === 'farmer' && t.pid === fid && (!t.seasonId || t.seasonId === sid)) ||
         DB.heaps.some(h => h.farmerId === fid && (!h.seasonId || h.seasonId === sid));
}

   (v1.1.4 item 1) and the holdback automation they drove was removed (Q16).

/* item #12: commission total from ALL farmers for this buyer (active season) */
function buyerTotalComm(bid){
  let t = 0;
  const groups = buyerFarmerHeaps(bid);

  const remaining = Math.max(0, r1(farmerLedger(fid).bal));

function recordBuyerReceipt(bid, d){

  const total = r1(d.total || 0);

  const date = d.date || todayStr();

  const doSave = () => {
    const posted = [];

      debit:0, credit:total, farmerRef:d.fid,
      cropPay:d.ledger !== 'comm', commPay:d.ledger === 'comm',
      note:d.ledger === 'comm'
        ? '💰 ਉਗਰਾਹੀ · Buyer payment — ਕਮਿਸ਼ਨ/ਖਰਚੇ · Commission/Expenses — ' + (f.name || '')
        : '💰 ਉਗਰਾਹੀ · Buyer payment — ਫਸਲ ਖਰੀਦ · Crop Purchase — ' + (f.name || ''),

      mode:d.mode || '', modeNote:d.modeNote || '', partySnap:bSnap});

    audit('💰 ਉਗਰਾਹੀ · Buyer payment', (b.name || '') + ' → ' + (f.name || '') + ' · ' +
      (d.ledger === 'comm' ? 'ਕਮਿਸ਼ਨ/ਖਰਚੇ' : 'ਫਸਲ ਖਰੀਦ') + ' · ' + fmt(total));
    save();
    /* v1.9.5 A1: recovery split — chain into the commission form (prefilled)
       instead of navigating away. Navigation only — nothing auto-posts. */
    if(d.chainComm > 0){ openBuyerCommPayForm(bid, d.fid, {prefill:r1(d.chainComm)}); return posted; }
    closeModal();
    go('buyers', {type:'buyer', id:bid, ledger:d.ledger === 'comm' ? 'comm' : 'crop', fid:d.fid});
    return posted;
  };
  /* double-entry guard: same buyer + farmer + ledger + amount + date warns */
  const dup = DB.txns.some(x => liveT(x) && x.ptype === 'buyer' && x.pid === bid && x.kind === 'receipt' &&
    x.farmerRef === d.fid && x.date === date && (x.credit || 0) === total &&
    ((d.ledger === 'comm' && x.commPay) || (d.ledger !== 'comm' && x.cropPay)));
  if(dup){
    confirmDup('ਇਹ ਭੁਗਤਾਨ ਪਹਿਲਾਂ ਹੀ ਦਰਜ ਹੈ · This payment was already recorded — ਫਿਰ ਵੀ ਸੇਵ ਕਰੋ?', () => doSave());
    return true;
  }
  return doSave();
}

/* ================================================================
   Voids, not deletes (Batch A — v1.5.0, P0 #3 / P0 #4 / P0 #5)
   Ledger entries are NEVER hard-deleted.
   v1.1.3: voiding marks the original voided — ONE crossed-out row, no
   reversal entry. Running balances skip voided rows via liveT.
   - voidTxn(tid): marks voided (central guard: date lock, season lock, audit).
   - voiding a parchi (slip) entry retires its slip (p.voided).
   - voiding a settlement payment un-recovers its linked slips
     (via the slipIds stored on the settlement payment).
   - voiding a shop payment un-marks the slip paid.
   Money aggregations skip voided AND reversal entries (liveT):
   the pair nets to zero either way, and skipping keeps principal
   mining (interest), settlement math and the interest hard-block
   honest. v1.1.3: void = one crossed-out row, no reversal entry —
   old voided pairs in existing data keep displaying both rows.
   ================================================================ */
/* a ledger entry counts toward money math only if it is neither a
   voided original nor a void-reversal entry */
const liveT = t => !t.voided && !t.voids;
/* v1.1.3: running balances skip dead rows. A row is live unless its txn
   (looked up via r.tid) fails liveT — this covers voided originals AND old
   reversal entries (voids set, not marked voided). Heap/crop rows carry no
   tid and are always live (voided heaps are filtered at build time). */
function rowLive(r){
  if(!r.tid) return true;
  const t = DB.txns.find(x => x.id === r.tid);
  return !t || liveT(t);
}
/* party name frozen at posting time (P1.2) */
function psnap(ptype, pid){
  if(ptype === 'farmer'){ const f = farmer(pid); return {name: f.name || '—'}; }
  if(ptype === 'buyer'){ const b = buyer(pid); return {name: b.name || '—'}; }
  if(ptype === 'supplier'){ const s = supplier(pid); return {name: s.name || '—'}; }
  return {name: '—'};
}
/* v1.1.3: void = one crossed-out row. NO reversal entry is posted — the
   original is marked voided and stays visible (strikethrough on the amount).
   Nothing is deleted from the database. Running balances skip voided rows
   via liveT, so money math stays correct with single rows. */
function doVoidTxn(t){
  t.voided = true;
  /* v1.1 #7 + v1.4 #9: voiding a buyer receipt cascades to its linked farmer
     postings via farmerTxnIds — they were one economic event. (v1.1.3
     two-books: buyer receipts no longer post farmer entries, so this only
     fires for legacy pre-v1.1.3 receipts.) */
  if(t.vasuliTxnId){
    const v = DB.txns.find(x => x.id === t.vasuliTxnId && !x.voided);
    if(v) doVoidTxn(v);
  }
  if(t.farmerTxnIds && t.farmerTxnIds.length){
    t.farmerTxnIds.forEach(fid2 => {
      const v = DB.txns.find(x => x.id === fid2 && !x.voided);
      if(v) doVoidTxn(v);
    });
  }
  /* A2 fix (v1.1.3): the old cascade-up treated t.buyerRef (a BUYER id) as a
     transaction id and voided some unrelated old transaction. Removed — a
     buyer receipt voids alone; nothing else is touched. */
  /* P0 #4: voiding a parchi entry retires its shop slip */
  if(t.kind === 'parchi' && t.ref != null){
    const p = DB.parchis.find(x => x.id === t.ref);
    if(p){ p.voided = true; }
  }
  /* voiding a shop payment un-marks the slip paid */
  if(t.kind === 'payment' && t.slipPayId != null){
    const p = DB.parchis.find(x => x.id === t.slipPayId);
    if(p && !p.voided){ p.paid = false; p.payTxnId = null; }
  }
  return t;
}
/* B4: the ONE central void guard — every void in the app routes through here
   (date lock, season lock, audit). No parallel void paths.
   A5: o = {confirmMsg, after} — optional. confirmMsg overrides the confirm
   wording; after(t) runs inside the confirm callback right after the void
   succeeds, INSTEAD of the default save()+go(TAB) (the caller then owns its
   own refresh). Any state that depends on the void (e.g. a parchi's paid
   flag) must flip only in after() — never before the confirm resolves. */
function voidTxn(tid, o){
  if(guardStore()) return false;
  const t = DB.txns.find(x => x.id === tid);
  if(!t || t.voided){ msgAlert('ਨਹੀਂ ਮਿਲਿਆ · Not found'); return false; }
  /* Batch B M3: a reversal entry (voids set) cannot itself be voided */
  if(t.voids){ msgAlert('ਰੱਦ ਕਰਨ ਵਾਲੀ ਐਂਟਰੀ ਦੁਬਾਰਾ ਰੱਦ ਨਹੀਂ ਹੋ ਸਕਦੀ · A reversing entry cannot be cancelled again'); return false; }
  if(t.seasonId && t.seasonId !== activeSeasonId()){ msgAlert('🔒 ਪੁਰਾਣਾ ਸੀਜ਼ਨ ਬੰਦ ਹੈ · Previous season is locked'); return false; }
  /* A12: voiding after the farmer's season is closed would silently change
     the confirmed carry figure — closed means closed (reopen flow exists) */
  if(t.ptype === 'farmer' && typeof farmerSeasonLocked === 'function' && farmerSeasonLocked(t.pid)){ msgAlert('🔒 ਕਿਸਾਨ ਦਾ ਸੀਜ਼ਨ ਬੰਦ ਹੈ · This farmer\'s season is closed — reopen it first to make changes'); return false; }
  if(isLocked(t.date)) return lockAlert();
  msgConfirm((o && o.confirmMsg) || 'ਇਹ ਲੈਣ-ਦੇਣ ਰੱਦ ਕਰੋ? · Cancel this entry?\n' + t.note + ' · ' + fmt(t.debit || t.credit) +
    '\n(ਰੱਦ = ਕੱਟ ਲੱਗੇਗਾ, ਮਿਟੇਗਾ ਨਹੀਂ · it will be crossed out, nothing is deleted)', () => {
    doVoidTxn(t);
    audit('↩️ ਰੱਦ · Cancelled', '#' + t.id + ' — ' + (t.note || t.kind) + ' · ' + fmt(t.debit || t.credit));
    if(o && o.after){ o.after(t); return; }
    /* item #10 (B3): a void returns to the same khata — TAB and KHATA are both
       preserved, so the ledger tab we came from is kept */
    save(); go(TAB, KHATA);
  });
  return true;
}

/* v1.1.3 Q4 — KACHHA vs PAKKA (his words, "perfect"): TWO buttons, ONE computation.

   so far this season; posts NOTHING, touches no ledger values.
   'pakka' — "ਪੱਕਾ ਹਿਸਾਬ ਕਰੋ · Do Final Hisaab": previews the same figure; the
   confirm posts it via settleInterestPost, replacing any earlier posting
   atomically. Interest is posted ONLY through the pakka flow — with no

function settleInterestOpen(pid, mode){
  if(guardStore()) return;
  mode = (mode === 'kachha') ? 'kachha' : 'pakka';
  if(mode === 'pakka' && guardSeasonClosed(pid)) return;
  backfillVyaajRanges(pid);

  const rate = Number(f.interestRate) > 0 ? Number(f.interestRate) : 1;
  const sr = activeSeasonRange();
  const from = sr.from, to = todayStr();
  /* pakka re-run replaces the earlier posting atomically — the block check
     ignores exactly those ids, so it never false-fires on the old entry */
  const updateOld = mode === 'pakka'
    ? DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === pid && t.kind === 'vyaaj').map(t => t.id)
    : [];
  /* totals for the interest period */
  let udhar = 0, parchi = 0, vasuli = 0, paid = 0;
  DB.txns.filter(t => inActiveSeason(t) && t.ptype === 'farmer' && t.pid === pid && liveT(t) && t.date >= from && t.date <= to).forEach(t => {
    if(t.kind === 'udhar') udhar += t.debit || 0;
    else if(t.kind === 'parchi') parchi += t.debit || 0;
    else if(t.kind === 'vasuli') vasuli += t.credit || 0;
    else if(t.kind === 'payment') paid += t.debit || 0;

  const total = r1(interestTotal(segs));
  const block = mode === 'pakka' ? vyaajBlockReason(pid, from, to, updateOld) : null;
  SETTLE_INT = {pid:pid, rate:rate, from:from, to:to, total:total, updateOld:updateOld, mode:mode};
  let html = '<p class="hint">' + rate + ' ਰੁਪਏ ਵਿਆਜ · ' + dstr(from) + ' → ' + dstr(to) + '</p><table>' +

function settleInterestPost(){
  if(!SETTLE_INT) return;
  if(guardStore()) return;
  if(guardSeasonClosed(SETTLE_INT.pid)) return;
  /* A12: closed means closed — the season stream's lock also blocks posting */
  if(typeof farmerSeasonLocked === 'function' && farmerSeasonLocked(SETTLE_INT.pid)){
    msgAlert('🔒 ਕਿਸਾਨ ਦਾ ਸੀਜ਼ਨ ਬੰਦ ਹੈ · This farmer\'s season is closed — reopen it first to make changes');
    return;
  }
  const s = SETTLE_INT, total = s.total;
  if(!(total > 0)) return;
  const d = todayStr(); if(isLocked(d)) return lockAlert();
  /* B5: calculate + validate the replacement BEFORE touching the ledger.
     Update mode replaces the old interest entries, so the block check
     ignores exactly those ids — the old code voided them first, and if the
     block then fired, the farmer was left with neither old nor new interest. */
  const oldIds = (s.updateOld || []).filter(tid => {
    const ot = DB.txns.find(x => x.id === tid);
    return ot && liveT(ot);
  });
  /* hard block, recomputed from the live ledger — no double-charge even if
     the on-screen state is stale */
  if(vyaajBlockReason(s.pid, s.from, s.to, oldIds)){
    msgAlert('⛔ ਵਿਆਜ ਦਰਜ ਨਹੀਂ ਹੋ ਸਕਦਾ · Interest posting blocked — this range overlaps already-posted interest.');
    return;
  }
  /* build the replacement entry first — nothing is voided yet.
     v1.1.3 Q5: iRate is stored on every vyaaj txn — a later backdated entry
     reposts with this same stored rate (autoRecalcInterest). */
  const t = seasonRecord({ id:DB.seq.txn++, date:d, ptype:'farmer', pid:s.pid, kind:'vyaaj', debit:total, credit:0, iFrom:s.from, iTo:s.to, iRate:s.rate, iMode:'custom',
    note:'Auto Interest Calculator · ਉਧਾਰ + ਪਰਚੀ − ਵਸੂਲੀ · ' + s.rate + ' ਰੁਪਏ · ' + dstr(s.from) + ' → ' + dstr(s.to),
    settlement:true, partySnap:psnap('farmer', s.pid) });
  /* one atomic swap: void the old entries and post the new one together.
     If anything fails mid-swap, the voided entries are restored. */
  const undone = [];
  try{
    oldIds.forEach(tid => {
      const ot = DB.txns.find(x => x.id === tid && !x.voided);
      /* v1.1.3: doVoidTxn marks voided only (no reversal) — rollback just
         un-marks the originals */
      if(ot){ doVoidTxn(ot); undone.push(ot.id); }
    });
    DB.txns.push(t);
  }catch(e){
    undone.forEach(id => {
      const orig = DB.txns.find(x => x.id === id);
      if(orig) orig.voided = false;
    });
    DB.txns = DB.txns.filter(x => x.id !== t.id);
    throw e;
  }
  audit('＋ ਵਿਆਜ · Interest applied', farmer(s.pid).name + ' · ' + fmt(total));
  save();
  const returnTo = s.returnTo;
  SETTLE_INT = null;
  /* v1.1.2: interest recorded from the season-close dialog returns there with
     the fresh net — the munim isn't stranded mid-flow */
  if(returnTo != null){ openCloseDialog(returnTo); return; }
  go('settle', {type:'farmer', id:s.pid});
  showTxnSlip(t); /* post-save slip like the other money entries */
}
/* v1.1.3 Q3 (his word): AUTO-RECALC on backdated entries. When a money txn is
   saved with a date inside an already-posted interest range [iFrom,iTo] —
   detected via txn id ordering (a live money txn with a HIGHER id than the
   interest txn but a date within its range) — the overlapping interest
   posting(s) are automatically voided and reposted fresh over the SAME range
   with the SAME stored rate (rate-period-aware via interestSegments). No
   confirm dialog — automatic, audit-logged. Called by the money-posting paths
   after each farmer money txn. Locked season = do nothing. */
function autoRecalcInterest(fid, date){
  if(typeof farmerSeasonLocked === 'function' && farmerSeasonLocked(fid)) return false;
  if(guardStore()) return false;
  const d = date || todayStr();
  const MONEY = ['udhar','parchi','vasuli','payment','carry'];
  const isMoney = t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid && MONEY.indexOf(t.kind) >= 0;
  const targets = DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid &&
    t.kind === 'vyaaj' && t.iFrom && t.iTo && t.iFrom <= d && d <= t.iTo &&
    DB.txns.some(m => isMoney(m) && m.id > t.id && m.date >= t.iFrom && m.date <= t.iTo));
  if(!targets.length) return false;
  let changed = false;
  targets.forEach(t => {
    /* void FIRST so the recompute sees a clean range (posted interest inside
       the range is ignored by interestSegments anyway — this just makes the
       void+repost visibly atomic in the ledger) */
    doVoidTxn(t);
    const rate = Number(t.iRate) > 0 ? Number(t.iRate)
      : (Number(farmer(fid).interestRate) > 0 ? Number(farmer(fid).interestRate) : 1);
    const total = r1(interestTotal(interestSegments(fid, rate, t.iFrom, t.iTo)));
    if(total > 0){
      const nt = seasonRecord({ id:DB.seq.txn++, date:todayStr(), ptype:'farmer', pid:fid, kind:'vyaaj',
        debit:total, credit:0, iFrom:t.iFrom, iTo:t.iTo, iRate:rate, iMode:'custom',
        note:'Auto Interest Calculator · ਉਧਾਰ + ਪਰਚੀ − ਵਸੂਲੀ · ' + rate + ' ਰੁਪਏ · ' + dstr(t.iFrom) + ' → ' + dstr(t.iTo) + ' · ਆਟੋ ਦੁਬਾਰਾ ਹਿਸਾਬ · auto-recalc',
        settlement:true, partySnap:psnap('farmer', fid) });
      DB.txns.push(nt);
    }
    audit('🔁 ਵਿਆਜ ਦੁਬਾਰਾ · Interest auto-recalculated', farmer(fid).name + ' · ' + dstr(t.iFrom) + ' → ' + dstr(t.iTo) + ' · ' + fmt(total));
    changed = true;
  });
  if(changed) save();
  return changed;
}
function settleData(fid, asOf){
  /* B6: settlement includes only records dated on or before the settlement
     date — future-dated parchi/advance/heap entries (warn-only at entry)
     must never leak into the settlement. */
  const sd = asOf || todayStr();
  const hs = liftedHeaps().filter(h => h.farmerId === fid && h.date <= sd);
  const gross = hs.reduce((s,h) => s + heapGross(h), 0);
  const ded = hs.reduce((s,h) => s + heapFarmerDed(h), 0);
  let udhar = 0, vasuli = 0, intr = 0, paid = 0, parchi = 0;
  /* voided originals and their reversals are skipped: the pair nets to
     zero, and skipping keeps settlement math honest (P0 #3) */
  DB.txns.filter(t => inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid && liveT(t) && t.date <= sd).forEach(t => {
    if(t.kind === 'udhar' || (t.kind === 'carry' && (t.debit||0) > 0)) udhar += t.debit || 0;
    else if(t.kind === 'vasuli' || (t.kind === 'carry' && (t.credit||0) > 0)) vasuli += t.credit || 0;
    else if(t.kind === 'vyaaj') intr += t.debit || 0;
    else if(t.kind === 'payment') paid += t.debit || 0;
    else if(t.kind === 'parchi') parchi += t.debit || 0; /* v1.1.3 Q18/Q34: parchi IS advance — plain debit like udhar, no recovery semantics */
  });
  /* v1.1.3 Q34: parchi lives in the ADVANCE bucket (not expenses) — Hisaab and
     khata agree by construction. Net is unchanged: parchi moved buckets. */
  const adv = udhar + parchi - vasuli;
  const expenses = ded + paid;
  const totalDues = r1(adv + intr + expenses);
  /* One addition block and one subtraction: crop sales − total farmer dues. */
  return { hs, gross, ded, udhar, vasuli, adv, intr, paid, parchi, expenses, totalDues, net:r1(gross - totalDues) };
}

/* v1.1.2: computed interest label for farmer net figures. Never hardcoded —
   derived from posted interest vs newer money entries. asOf defaults to
   today; the Hisaab screen passes its settlement date. Buyer figures never
   get this tag (interest is farmer-side only). */
function interestState(fid, asOf){
  const sd = asOf || todayStr();
  const posted = DB.txns.filter(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid && t.kind === 'vyaaj');
  if(!posted.length) return {state:'none'};
  const asOfI = posted.reduce((m,t) => { const d = t.iTo || t.date || ''; return d > m ? d : m; }, '');
  /* stale = the posted interest doesn't cover up to sd: either newer money
     moved after it, or time simply passed since it was calculated */
  const newer = DB.txns.some(t => liveT(t) && inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid &&
    (t.kind === 'udhar' || t.kind === 'parchi' || t.kind === 'vasuli' || t.kind === 'payment') && (t.date || '') > asOfI);
  if(!newer && asOfI >= sd) return {state:'ok', asOf:asOfI};
  return {state:'stale', asOf:asOfI};
}
function interestTag(fid, asOf){
  const s = interestState(fid, asOf);
  if(s.state === 'none') return '<span class="int-tag">ਵਿਆਜ ਦਰਜ ਨਹੀਂ · interest not yet recorded</span>';
  if(s.state === 'ok') return '<span class="int-tag">ਵਿਆਜ ਸ਼ਾਮਲ · interest included</span>';
  return '<span class="int-tag">ਵਿਆਜ ਸ਼ਾਮਲ ਸਿਰਫ਼ ' + dstr(s.asOf) + ' ਤੱਕ · interest included till that date</span>';

function enToPa(text) {
  if (!text) return '';
  return String(text).split(/(\s+)/).map(part => {
    if (/^\s+$/.test(part)) return part;

    if (/^[A-Z0-9]+$/.test(part) || isGovtAgencyName(part)) return part;

    .replace(/\u0a38\u0a3c/g, '\u0a36').replace(/\u0a16\u0a3c/g, '\u0a59')
    .replace(/\u0a17\u0a3c/g, '\u0a5a').replace(/\u0a1c\u0a3c/g, '\u0a5b')

function paKeypad(targetId){

function paKeyInsert(targetId, k){
  const el = document.getElementById(targetId);
  if(!el) return;
  el.dataset.dirty = '1';
  const s = el.selectionStart == null ? el.value.length : el.selectionStart;
  const e = el.selectionEnd == null ? el.value.length : el.selectionEnd;
  let at;
  if(k === 'BKSP'){
    at = (s === e) ? Math.max(0, s - 1) : s;
    el.value = el.value.slice(0, at) + el.value.slice(e);
  } else {
    el.value = el.value.slice(0, s) + k + el.value.slice(e);
    at = s + k.length;
  }
  try{ el.setSelectionRange(at, at); }catch(err){}
  const pv = document.getElementById('kb-prev');
  if(pv) pv.textContent = el.value;
  /* no el.focus(): on phones it pops the system keyboard over this keypad */
}

/* Posted interest ranges, for anti-double-charge. New txns carry iFrom/iTo;
   old note-only txns are parsed best-effort from the trailing DD/MM/YYYY → DD/MM/YYYY. */
function parseVyaajNoteRange(note){
  const m = String(note || '').match(/(\d{2})\/(\d{2})\/(\d{4})\s*→\s*(\d{2})\/(\d{2})\/(\d{4})\s*$/);
  if(!m) return null;
  return {from: m[3] + '-' + m[2] + '-' + m[1], to: m[6] + '-' + m[5] + '-' + m[4]};
}
function backfillVyaajRanges(pid){
  let changed = false;
  DB.txns.forEach(t => {
    if(t.ptype !== 'farmer' || t.pid !== pid || t.kind !== 'vyaaj' || (t.iFrom && t.iTo)) return;
    const p = parseVyaajNoteRange(t.note);
    if(p){ t.iFrom = p.from; t.iTo = p.to; changed = true; }
  });
  if(changed) save();
}
function vyaajPostedRanges(pid){
  /* voided interest and its reversal no longer block — the range is open again */
  return DB.txns
    .filter(t => inActiveSeason(t) && liveT(t) && t.ptype === 'farmer' && t.pid === pid && t.kind === 'vyaaj' && t.iFrom && t.iTo)
    .map(t => ({from:t.iFrom, to:t.iTo, amt:t.debit || 0, tid:t.id}));
}
/* Hard anti-double-charge: interest can only be posted for a range that touches
   no already-posted range. A range-less legacy entry also blocks, because the
   system cannot prove it doesn't overlap — delete it from the khata first. */
function vyaajBlockReason(pid, from, to, except){
  /* B5: except = txn ids being replaced by an interest update — they are not
     "other" interest, so the block check ignores them. The old code voided
     them first and could strand the farmer with neither old nor new interest
     when the block fired. */
  const ex = except || [];
  const posted=vyaajPostedRanges(pid).filter(p => ex.indexOf(p.tid) < 0);
  const completed=DB.txns.filter(t => inActiveSeason(t) && liveT(t) && t.ptype==='farmer' && t.pid===pid && t.kind==='vyaaj' && t.iMode==='season' && ex.indexOf(t.id) < 0);
  if(completed.length) return {type:'season-complete',list:completed.map(t=>({from:t.iFrom,to:t.iTo,amt:t.debit||0,tid:t.id}))};
  const ov = posted.filter(p => !(to < p.from || from > p.to));
  if(ov.length) return {type:'overlap', list:ov};
  const blind = DB.txns.filter(t => inActiveSeason(t) && liveT(t) && t.ptype === 'farmer' && t.pid === pid && t.kind === 'vyaaj' && !(t.iFrom && t.iTo) && ex.indexOf(t.id) < 0);
  if(blind.length) return {type:'blind', list:blind};
  return null;
}
function interestSegments(fid, rate, from, to){
  /* At a season boundary, every live posted-interest entry before `from` has
     already become part of the farmer's carried balance. Fold it into opening
     principal once. Posted interest inside this range is deliberately ignored:
     each segment remains simple interest, never interest-on-interest.
     v1.1.3 Q18: a parchi debit counts EXACTLY like an udhar debit — no
     recovery semantics; recovered flags are ignored everywhere here.
     v1.1.3 Q5: RATE-PERIOD-AWARE — f.rateChanges splits the range at change
     dates: the old rate accrues the older period, the new rate only forward
     from its change date. `rate` is the fallback for dates before the first
     recorded change (legacy farmers). Each segment carries its own `rate`.
     P1.6: each segment's interest is kept RAW (intrRaw) — the posted/reported
     total is rounded ONCE via interestTotal(), never per segment. */
  const mine = t => inActiveSeason(t) && t.ptype === 'farmer' && t.pid === fid;
  const counts = t => liveT(t) && mine(t) && (t.kind === 'udhar' || t.kind === 'vasuli' || t.kind === 'parchi' || t.kind === 'carry');
  let udhar = 0, vasuli = 0;
  const apply = t => {
    if(t.kind === 'udhar' || t.kind === 'parchi' || (t.kind === 'carry' && (t.debit||0) > 0)) udhar += t.debit || 0;
    else if(t.kind === 'vasuli' || (t.kind === 'carry' && (t.credit||0) > 0)) vasuli += t.credit || 0;
  };
  DB.txns.filter(t => counts(t) && t.date < from).forEach(apply);
  const postedInterestBefore = DB.txns
    .filter(t => liveT(t) && mine(t) && t.kind === 'vyaaj' && t.date < from)
    .reduce((s,t) => s + (t.debit || 0), 0);
  const openingBalance = Math.max(0, udhar - vasuli + postedInterestBefore);
  const evts = DB.txns.filter(t => counts(t) && t.date >= from && t.date <= to);
  evts.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0); /* P2.3: equal dates keep entry order */
  /* Q5: the rate schedule — a change takes effect from its date forward */
  const hist = (((farmer(fid) || {}).rateChanges) || [])
    .filter(e => e && e.from && Number(e.rate) > 0)
    .sort((a,b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  const rateFor = d => {
    let r = rate;
    hist.forEach(e => { if(e.from <= d) r = Number(e.rate); });
    return r;
  };
  const cuts = [from];
  evts.forEach(e => { if(cuts[cuts.length-1] !== e.date) cuts.push(e.date); });
  hist.forEach(e => { if(e.from > from && e.from <= to && cuts.indexOf(e.from) < 0) cuts.push(e.from); });
  cuts.sort();
  if(cuts[cuts.length-1] !== to) cuts.push(to);
  const segs = [];
  evts.filter(e => e.date === from).forEach(apply);
  for(let i = 0; i < cuts.length - 1; i++){
    const d0 = cuts[i], d1 = cuts[i+1], days = dayDiff(d0, d1);
    const r0 = rateFor(d0);
    const prin = Math.max(0, udhar - vasuli + postedInterestBefore);
    const intrRaw = prin > 0 && days > 0 ? prin * r0 / 100 * days / 30 : 0;
    segs.push({from:d0, to:d1, days, prin, intrRaw, rate:r0, udhar, vasuli, postedInterestBefore, openingBalance});
    evts.filter(e => e.date === d1).forEach(apply);
  }
  /* the range is inclusive: the closing day accrues exactly like any other
     day. Events dated `to` were applied at the end of the loop above, so this
     final segment sees the closing day's state — money moved on `to` counts
     for `to`, same as every other day. */
  const rC = rateFor(to);
  const prinC = Math.max(0, udhar - vasuli + postedInterestBefore);
  segs.push({from:to, to:to, days:1, prin:prinC, intrRaw:prinC > 0 ? prinC * rC / 100 / 30 : 0,
    rate:rC, udhar, vasuli, postedInterestBefore, openingBalance});
  return segs;
}
/* P1.6: interest is rounded ONCE on the summed raw segments — this is the
   single number that gets reviewed, reported and posted. */
/* Fix 13: interest rounds to paise (2 decimals), not whole rupees.
   r1 is unchanged globally — this r2 is local to interest posting only. */
const r2 = n => Math.round((n || 0) * 100) / 100;
function interestTotal(segs){ return r2(segs.reduce((s,g) => s + (g.intrRaw || 0), 0)); }
/* ---------------- dami report ---------------- */
function damiData(from, upto){
  const per = {};
  weighedHeaps().filter(h => h.date >= from && h.date <= upto).forEach(h => {
    const b = buyer(h.buyerId);
    const k = h.buyerId;
    per[k] = per[k] || { name:(h.buyerSnap && h.buyerSnap.name) || dName(b), govt:(h.payerSnap || payerType(b)) === 'government', heaps:0, gross:0, dami:0 };
    per[k].heaps++; per[k].gross += heapGross(h); per[k].dami += heapDami(h);
  });
  const rows = Object.values(per);
  const sum = list => list.reduce((s,p) => ({gross:s.gross + p.gross, dami:s.dami + p.dami, heaps:s.heaps + p.heaps}), {gross:0, dami:0, heaps:0});
  return { rows, tot:sum(rows), govt:sum(rows.filter(p => p.govt)), priv:sum(rows.filter(p => !p.govt)) };
}
/* P12: dami report range chips — set the date inputs, then reuse renderDami() */
/* Batch D: the dami report's custom date range persists while navigating —
   leaving and coming back keeps the chosen range instead of resetting to today */
let DAMI_RANGE = null;
function damiRange(which){
  const t = todayStr();
  let from = t, upto = t;
  if(which === 'month') from = t.slice(0, 7) + '-01';
  else if(which === 'season'){ const r = seasonRange(); from = r.from; upto = r.to; }
  DAMI_RANGE = {from:from, upto:upto};
  const f = document.getElementById('d_from'), to = document.getElementById('d_to');
  if(f) f.value = from; if(to) to.value = upto;
  renderDami();
}
function renderDami(){
  const t = todayStr();
  const f = $('#d_from'), to = $('#d_to');
  let from, upto;
  if(f && to){ from = f.value; upto = to.value; DAMI_RANGE = {from:from, upto:upto}; }
  else if(DAMI_RANGE){ from = DAMI_RANGE.from; upto = DAMI_RANGE.upto; }
  else { from = t; upto = t; }
  const d = damiData(from, upto);
  const rows = d.rows.map(p =>
    '<tr><td>' + esc(p.name) + (p.govt ? agencyTag({payerType:'government'}) : '') + '</td><td class="num">' + p.heaps + '</td><td class="num">' + fmt(p.gross) + '</td><td class="num"><b>' + fmt(p.dami) + '</b></td></tr>').join('');
  const tot = d.tot;
  $('#screen').innerHTML = '<div class="card"><h2>🧾 ਦਾਮੀ ਰਿਪੋਰਟ · Commission report</h2>' +
    '<div class="toolbar" style="margin-bottom:6px">' +
    '<button type="button" class="btn btn-g btn-xs" onclick="damiRange(\'today\')">ਅੱਜ · Today</button> ' +
    '<button type="button" class="btn btn-g btn-xs" onclick="damiRange(\'month\')">ਇਹ ਮਹੀਨਾ · This month</button> ' +
    '<button type="button" class="btn btn-g btn-xs" onclick="damiRange(\'season\')">ਸੀਜ਼ਨ · Season</button></div>' +
    '<div class="toolbar"><input type="date" id="d_from" value="' + from + '"> to <input type="date" id="d_to" value="' + upto + '">' +
    '<button class="btn btn-p btn-sm" onclick="renderDami()">ਵੇਖੋ · View</button>' +
    '<button class="btn btn-g btn-xs" onclick="printDami()">🖨 ਪ੍ਰਿੰਟ · Print</button></div>' +
    '<div class="grid2">' +
      stat(fmt(d.priv.dami), 'ਪ੍ਰਾਈਵੇਟ ਵਪਾਰੀਆਂ ਤੋਂ<br><em>From private buyers</em>') +
      stat(fmt(d.govt.dami), 'ਸਰਕਾਰੀ ਏਜੰਸੀਆਂ ਤੋਂ<br><em>From government agencies</em>') +
    '</div>' +
    (rows ? '<table><tr><th>ਵਪਾਰੀ · Buyer</th><th class="num">ਢੇਰ</th><th class="num">ਕੁੱਲ ਵਿਕਰੀ · Gross</th><th class="num">ਦਾਮੀ · Commission</th></tr>' + rows +
      '<tr><td><b>ਕੁੱਲ · Total</b></td><td class="num"><b>' + tot.heaps + '</b></td><td class="num"><b>' + fmt(tot.gross) + '</b></td><td class="num"><b>' + fmt(tot.dami) + '</b></td></tr></table>'
      : '<div class="empty-state"><div class="es-big">⚖️</div><div class="es-title">ਕੋਈ ਤੋਲ ਨਹੀਂ · No weighments</div></div>') + '</div>';
}

/* v1.1.4 item 3: the separate agency-dues module is REMOVED — a government agency
   is just a buyer: its crop ledger posts the crop gross and its commission
   ledger posts mandi fee + RDF + bardana + labour (commission ₹/qtl).
   Agency dues live on the buyer ledger; agency payments are buyer receipts.
   Old agency receipt txns (commPay) keep counting via buyerFarmerCommPaid. */

/* ================================================================
   📢 ਰਿਕਵਰੀ · Recovery — chase diary
   NOT a money tab: nothing is posted here. Debtors (buyer dues and
   farmer receivables) are derived from the ledgers; the diary stores
   what each one promised and the next chase date, so nobody slips.
   ================================================================ */
function recoveryDebtors(){
  const out = [];
  DB.buyers.forEach(b => {
    const L = buyerLedger(b.id);
    const bal = r1(L.bal);
    if(bal > 0){
      const deb = L.rows.filter(r => (r.debit || 0) > 0);
      out.push({ptype:'buyer', pid:b.id, name:dName(b), bal, since:deb.length ? deb[0].date : ''});
    }
  });
  DB.farmers.forEach(f => {
    const L = farmerLedger(f.id);
    const bal = r1(-L.bal);
    if(bal > 0){
      const deb = L.rows.filter(r => (r.debit || 0) > 0);
      out.push({ptype:'farmer', pid:f.id, name:dName(f), bal, since:deb.length ? deb[0].date : ''});
    }
  });
  out.forEach(d => { d.d = activeRecovery().find(r => r.ptype === d.ptype && r.pid === d.pid && !r.done) || null; });
  /* overdue first, then by next-chase date, then no-date last */
  const t = todayStr();
  const key = d => !d.d || !d.d.nextDate ? 2 : (d.d.nextDate < t ? 0 : 1);
  const nd = d => (d.d && d.d.nextDate) || '';
  out.sort((a, b) => (key(a) - key(b)) || (nd(a) < nd(b) ? -1 : nd(a) > nd(b) ? 1 : 0));
  return out;
}
function renderRecovery(){
  const list = recoveryDebtors();
  const t = todayStr();
  const rows = list.map(d => {
    const nx = d.d && d.d.nextDate ? d.d.nextDate : '';
    const od = nx && nx < t;
    const icon = d.ptype === 'buyer' ? '🏭' : '🧑‍🌾';
    /* v1.9.5 C2: buyer rows show outstanding by category before collection */
    const cat = d.ptype === 'buyer' ? buyerDueByCat(d.pid) : null;
    /* v1.9.5: recovery progress — collected vs total owed */
    const L = d.ptype === 'farmer' ? farmerLedger(d.pid) : buyerLedger(d.pid);
    let totD = 0;
    L.rows.forEach(r => { totD += r.debit || 0; });
    const pct = totD > 0 ? Math.max(0, Math.min(100, Math.round((totD - d.bal) / totD * 100))) : 0;
    /* v1.9.5: due-date badge */
    let badge = '';
    if(nx){
      const dd = dayDiff(t, nx);
      badge = od ? ' <span class="due-badge due-overdue">ਮਿਆਦ ਲੰਘੀ · Overdue</span>'
        : dd <= 7 ? ' <span class="due-badge due-soon">' + dd + ' ਦਿਨ · Days</span>'
        : ' <span class="due-badge due-ok">ਸਮੇਂ \u2019ਤੇ · on time</span>';
    }
    return '<tr><td>' + icon + ' <b>' + esc(d.name) + '</b><br><small>' + (d.since ? 'ਤੋਂ · since ' + dstr(d.since) : '') + '</small></td>' +
      '<td class="num"><b>' + fmt(d.bal) + '</b>' +
      (cat ? '<br><small>🌾 ਫਸਲ · Crop ' + fmt(cat.crop) + ' · 💰 ਖਰਚੇ · Charges ' + fmt(cat.comm) + '</small>' : '') +
      '<div class="pbar" style="min-width:90px" title="ਵਸੂਲੀ ਪ੍ਰਗਤੀ · Collection progress"><div class="pfill" style="width:' + pct + '%"></div></div><small>' + pct + '% ਵਸੂਲ · Collected</small></td>' +
      '<td>' + (d.d && d.d.promise ? esc(d.d.promise) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (nx ? dstr(nx) + '<br>' + badge : '<span class="muted">—</span>') + '</td>' +
      '<td style="white-space:nowrap">' +
      (d.ptype === 'farmer'
        ? '<button class="btn btn-p btn-xs" onclick="openTxnForm(\'farmer\',' + d.pid + ',\'vasuli\')">💰 ਵਸੂਲੀ · Payback</button> '
        : '<button class="btn btn-p btn-xs" onclick="openRecoveryPayChoice(' + d.pid + ')">💰 ਉਗਰਾਹੀ ਦਰਜ · Record payment</button> ') +
      '<button class="btn btn-g btn-xs" onclick="openRecoveryNote(\'' + d.ptype + '\',' + d.pid + ')">📝 ਨੋਟ · Note</button></td></tr>';
  }).join('');
  $('#screen').innerHTML = '<div class="card"><h2>📢 ਰਿਕਵਰੀ · Recovery</h2>' +
    (rows ? '<div class="tblwrap"><table><tr><th>ਪਾਰਟੀ · Party</th><th class="num">ਲੈਣਾ · Receivable</th><th>ਵਾਅਦਾ · Promise</th><th>ਅਗਲੀ ਰਿਕਵਰੀ · Next chase</th><th></th></tr>' + rows + '</table></div>'
      : '<div class="empty-state"><div class="es-big">🎉</div><div class="es-title">ਕੋਈ ਲੈਣਾ ਨਹੀਂ · Nobody owes anything</div></div>') +
    '</div>';
}
function chaseIn(n){ const el = document.getElementById('r_next'); if(el) el.value = addDays(todayStr(), n); }
function openRecoveryNote(ptype, pid){
  const name = ptype === 'buyer' ? buyer(pid).name : farmer(pid).name;
  const ex = DB.recovery.find(r => r.ptype === ptype && r.pid === pid && !r.done);
  openModal('📝 ਰਿਕਵਰੀ ਨੋਟ · Chase note — ' + esc(name || ''),
    F('ਵਾਅਦਾ · What they promised', IN('r_prom', ex ? ex.promise : '', 'text', 'e.g. ਅਗਲੇ ਹਫ਼ਤੇ ਦੇ ਦੇਵਾਂਗਾ')) +
    F('ਅਗਲੀ ਰਿਕਵਰੀ · Next chase date', IN('r_next', ex ? ex.nextDate : '', 'date') +
      '<div class="toolbar" style="margin-top:4px"><button type="button" class="btn btn-g btn-xs" onclick="chaseIn(7)">＋7 ਦਿਨ/days</button> ' +
      '<button type="button" class="btn btn-g btn-xs" onclick="chaseIn(15)">＋15 ਦਿਨ/days</button></div>') +
    F('ਨੋਟ · Note', IN('r_note', ex ? ex.note : '', 'text', '')),
    'ਸੇਵ · Save', () => {
      const rec = {promise:v('r_prom').trim(), nextDate:v('r_next'), note:v('r_note').trim()};
      if(ex) Object.assign(ex, rec);
      else DB.recovery.push(Object.assign({id:DB.seq.recovery++, ptype, pid, done:false, created:todayStr()}, rec));
      audit('📢 ਰਿਕਵਰੀ ਨੋਟ · Chase note', (name || '') + (rec.nextDate ? ' · ' + rec.nextDate : ''));
      save(); closeModal(); renderRecovery();
      return true;
    });
}

/* ================================================================
   🏛️ ਮੰਡੀ ਫੀਸ · Market fee register
   Per-heap market fee + RDF. Punjab law: the BUYER pays all market
   charges; government MSP procurement is government-settled. Rates are
   frozen at auction via feeSnap, so old heaps never change.
   ================================================================ */
function renderMarketFee(){
  const rows = weighedHeaps().map(h => {
    const g = heapGross(h), s = HS(h);
    return {n:h.n, date:h.date, buyer:(buyer(h.buyerId).name || '—'), crop:h.crop,
      gross:Math.round(g), fee:Math.round(g * s.mandiFeePct / 100), rdf:Math.round(g * s.rdfPct / 100),
      payer:(h.payerSnap || payerType(buyer(h.buyerId)))};
  }).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.n - b.n);
  const tot = (rs, k) => rs.reduce((t, r) => t + r[k], 0);
  const pv = rows.filter(r => r.payer !== 'government'), gv = rows.filter(r => r.payer === 'government');
  const rws = rows.map(r =>
    '<tr><td>#' + r.n + '<br><small>' + dstr(r.date) + '</small></td><td>' + esc(r.crop) + '</td><td>' + esc(r.buyer) +
    (r.payer === 'government' ? '<br><small>ਸਰਕਾਰੀ · Govt</small>' : '') + '</td>' +
    '<td class="num">' + fmt(r.gross) + '</td><td class="num">' + fmt(r.fee) + '</td><td class="num">' + fmt(r.rdf) + '</td></tr>').join('');
  $('#screen').innerHTML = '<div class="card"><h2>🏛️ ਮੰਡੀ ਫੀਸ · Market fee</h2>' +
    '<div class="grid2">' +
    stat(fmt(tot(pv, 'fee')), 'ਪ੍ਰਾਈਵੇਟ ਫੀਸ<br><em>Private-buyer fee</em>', 'plain') +
    stat(fmt(tot(pv, 'rdf')), 'ਪ੍ਰਾਈਵੇਟ RDF<br><em>Private RDF</em>', 'plain') +
    stat(fmt(tot(gv, 'fee')), 'ਸਰਕਾਰੀ ਫੀਸ<br><em>Government fee</em>', 'plain') +
    stat(fmt(tot(gv, 'rdf')), 'ਸਰਕਾਰੀ RDF<br><em>Govt RDF</em>', 'plain') +
    '</div>' +
    '<div class="crow"><span class="muted">ਕੁੱਲ ਫੀਸ + RDF · Total fee + RDF</span><b>' + fmt(tot(rows, 'fee') + tot(rows, 'rdf')) + '</b></div>' +
    (rws ? '<div class="tblwrap"><table><tr><th>ਢੇਰ · Heap</th><th>ਫਸਲ · Crop</th><th>ਵਪਾਰੀ · Buyer</th><th class="num">ਵਿਕਰੀ · Sale</th><th class="num">ਫੀਸ · Fee</th><th class="num">RDF</th></tr>' + rws + '</table></div>'
      : '<div class="empty-state"><div class="es-big">⚖️</div><div class="es-title">ਕੋਈ ਤੋਲਿਆ ਢੇਰ ਨਹੀਂ · No weighed heaps yet</div></div>') +
    '</div>';
}

/* ================================================================
   💸 ਲਾਗਤ · Lagat — the firm's own costs, in one place
   Cash-out totals (#12), season P&L + per-heap true profit (#16),
   the bardana tally (#17), and the expense register.
   ================================================================ */
/* Q33: period selector — ਅੱਜ · Today / ਮਹੀਨਾ · Month / ਸੀਜ਼ਨ · Season.
   Replaces the old month-input-plus-tiny-season-button. */
let LAGAT_KIND = 'season', LAGAT_MONTH = '';
function lagatRange(){
  if(LAGAT_KIND === 'today'){
    const t = todayStr();
    return {label:'ਅੱਜ · Today · ' + dstr(t), from:t, to:t};
  }
  if(LAGAT_KIND === 'month'){
    const m = LAGAT_MONTH || todayStr().slice(0, 7);
    const y = +m.slice(0, 4), mo = +m.slice(5, 7);
    const last = new Date(y, mo, 0).getDate();
    return {label:m, from:m + '-01', to:m + '-' + String(last).padStart(2, '0')};
  }
  return {label:seasonLabel(), from:'', to:''};
}
const inLagat = (d, r) => (!r.from || d >= r.from) && (!r.to || d <= r.to);
function lagatKind(k){ LAGAT_KIND = k; renderLagat(); }
function lagatGoMonth(){ const el = document.getElementById('lag_m'); LAGAT_MONTH = el ? el.value : ''; renderLagat(); }

function renderLagat(){
  const r = lagatRange();
  /* ---- Q33: Paid out = money handed over in the period (farmer payments,
     advances, shop payments, personal handouts — cash + bank, all modes).
     Real costs = true business costs only: personal entries never hit P&L,
     and bank transfers are neither. Total out = the two added. ---- */
  let farmerPay = 0, adv = 0, shopPay = 0;
  DB.txns.filter(inActiveSeason).forEach(t => {
    if(!liveT(t) || !inLagat(t.date, r)) return;
    if(t.ptype === 'farmer' && t.kind === 'payment') farmerPay += t.debit || 0;
    else if(t.ptype === 'farmer' && t.kind === 'udhar') adv += t.debit || 0;
    else if(t.ptype === 'supplier' && t.kind === 'payment') shopPay += t.debit || 0;
  });
  let personalOut = 0;
  const expByCat = {};
  const expLines = [];
  activeExpenses().forEach(e => {
    if(e.type !== 'out' || !inLagat(e.date, r)) return;
    if(e.personal) personalOut += e.amount || 0;
    else expByCat[e.cat] = (expByCat[e.cat] || 0) + (e.amount || 0);
    expLines.push(e);
  });
  const realCosts = Object.keys(expByCat).reduce((s, k) => s + expByCat[k], 0);
  const paidOut = farmerPay + adv + shopPay + personalOut;
  const totalOut = paidOut + realCosts;
  /* ---- #16: season P&L — what the firm really earned ---- */
  let dami = 0, vyaj = 0;
  liftedHeaps().forEach(h => { if(inLagat(h.date, r)) dami += heapDami(h); });
  DB.txns.filter(inActiveSeason).forEach(t => { if(liveT(t) && t.kind === 'vyaaj' && inLagat(t.date, r)) vyaj += t.debit || 0; });
  const net = dami + vyaj - realCosts;
  /* ---- #16: per-crop commission minus bardana — renamed honestly per the
     review (it ignores all other costs, so "true profit" was a lie) ---- */
  const heapRows = liftedHeaps().filter(h => inLagat(h.date, r)).map(h => {
    const dm = heapDami(h), tc = (h.bardana || 0);
    return {n:h.n, date:h.date, crop:h.crop, farmer:(farmer(h.farmerId).name || '—'), dm, tc, profit:dm - tc};
  });
  const cropP = {};
  heapRows.forEach(x => {
    const c = cropKey(x.crop);
    cropP[c] = cropP[c] || {dami:0, cost:0, profit:0, n:0};
    cropP[c].dami += x.dm; cropP[c].cost += x.tc; cropP[c].profit += x.profit; cropP[c].n++;
  });
  const cropRows = Object.keys(cropP).map(c =>
    '<tr><td><b>' + esc(c) + '</b><br><small>' + cropP[c].n + ' ਢੇਰ · Heaps</small></td>' +
    '<td class="num">' + fmt(cropP[c].dami) + '</td><td class="num">' + fmt(cropP[c].cost) + '</td>' +
    '<td class="num"><b style="color:' + (cropP[c].profit >= 0 ? 'var(--green-d)' : 'var(--red)') + '">' + fmt(cropP[c].profit) + '</b></td></tr>').join('');
  /* ---- ③ expense register: daily lines first, overall figures below ---- */
  const expLineRows = expLines.slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id).map(e =>
    '<tr><td>' + dstr(e.date) + '</td><td>' +
    (e.person ? esc(e.person) + '<br>' : '') +
    '<small>' + (e.personal ? 'ਨਿੱਜੀ · Personal <span class="en">(not a cost)</span>' : expCatLabel(e.cat)) +
    (e.note ? ' · ' + esc(e.note) : '') + '</small></td>' +
    '<td class="num">' + fmt(e.amount) + '</td></tr>').join('');
  const catRows = EXP_CATS.filter(([c]) => expByCat[c] > 0).map(([c, lbl]) =>
    '<tr><td>' + lbl + '</td><td class="num">' + fmt(expByCat[c]) + '</td></tr>').join('');
  /* ---- ④ bardana tally — follows the period filter (was full season) ---- */
  const bb = {purchase:0, issue:0, return:0, agency:0, agencyback:0};
  activeBardana().forEach(x => { if(!inLagat(x.date, r)) return; if(bb[x.kind] !== undefined) bb[x.kind] += x.qty; });
  bb.bal = bb.purchase - bb.issue + bb.return + bb.agency - bb.agencyback;
  const bRows = activeBardana().filter(x => inLagat(x.date, r)).sort((a, b) => a.date < b.date ? -1 : 1).slice(-12).reverse().map(x =>
    '<tr><td>' + dstr(x.date) + '</td><td>' + ({purchase:'ਖਰੀਦ · Purchased', issue:'ਦਿੱਤਾ · Issued', return:'ਵਾਪਸ · Returned',
      agency:'ਸਰਕਾਰੀ ਤੋਂ · From government', agencyback:'ਸਰਕਾਰੀ ਨੂੰ ਵਾਪਸ · Back to government'}[x.kind] || x.kind) + '</td>' +
    '<td class="num">' + x.qty + '</td><td>' + esc(x.party || '') + (x.heapId ? ' · ਢੇਰ #' + (DB.heaps.find(h => h.id === x.heapId) || {}).n : '') + '</td></tr>').join('');

  const paidInfo = {t:'💵 ਭੁਗਤਾਨ · Paid out', rows:[
    ['ਕਿਸਾਨ ਭੁਗਤਾਨ · Farmer payments', fmt(farmerPay)],
    ['ਉਧਾਰ · Advances', fmt(adv)],
    ['ਦੁਕਾਨ ਭੁਗਤਾਨ · Shop payments', fmt(shopPay)],
    ['ਨਿੱਜੀ · Personal handouts', fmt(personalOut)]]};
  const costInfo = {t:'🧾 ਅਸਲ ਖਰਚੇ · Real costs', rows:
    EXP_CATS.filter(([c]) => expByCat[c] > 0).map(([c, lbl]) => [lbl, fmt(expByCat[c])])};

  $('#screen').innerHTML =
  '<div class="card"><h2>💸 ਲਾਗਤ · Lagat</h2>' +
    '<p class="hint">ਲਾਗਤ = ਫਰਮ ਦੇ ਖਰਚੇ ਅਤੇ ਨਫ਼ਾ-ਨੁਕਸਾਨ · Lagat = the firm\'s costs and profit</p>' +
    '<div class="toolbar">' +
    '<button class="btn btn-sm ' + (LAGAT_KIND === 'today' ? 'btn-p' : 'btn-g') + '" onclick="lagatKind(\'today\')">ਅੱਜ · Today</button>' +
    '<button class="btn btn-sm ' + (LAGAT_KIND === 'month' ? 'btn-p' : 'btn-g') + '" onclick="lagatKind(\'month\')">ਮਹੀਨਾ · Month</button>' +
    '<button class="btn btn-sm ' + (LAGAT_KIND === 'season' ? 'btn-p' : 'btn-g') + '" onclick="lagatKind(\'season\')">ਸੀਜ਼ਨ · Season</button>' +
    (LAGAT_KIND === 'month' ? '<input type="month" id="lag_m" value="' + (LAGAT_MONTH || todayStr().slice(0, 7)) + '" onchange="lagatGoMonth()" style="margin-left:6px">' : '') +
    '</div>' +
    '<p class="muted">ਮਿਆਦ · Period: <b>' + esc(r.label) + '</b></p>' +

    '<h3>① 💵 ਭੁਗਤਾਨ · Paid out <span class="en">vs</span> 🧾 ਅਸਲ ਖਰਚੇ · Real costs</h3>' +
    '<div class="grid2">' +
    stat(fmt(paidOut), '💵 ਭੁਗਤਾਨ · Paid out<br><em>money handed over</em>', 'money', 'ਨਕਦ + ਬੈਂਕ · all modes', null, paidInfo) +
    stat(fmt(realCosts), '🧾 ਅਸਲ ਖਰਚੇ · Real costs<br><em>true business costs</em>', 'money', 'ਨਕਦ + ਬੈਂਕ · all modes', null, costInfo) +
    stat(fmt(totalOut), '<b>ਕੁੱਲ · Total out</b>', 'money') +
    '</div>' +

    '<h3 style="margin-top:14px">② 📈 ਨਫ਼ਾ-ਨੁਕਸਾਨ · Profit &amp; loss</h3>' +
    '<div class="tblwrap"><table>' +
    '<tr><td>ਦਾਮੀ ਆਮਦਨ · Commission income</td><td class="num">' + fmt(dami) + '</td></tr>' +
    '<tr><td>ਵਿਆਜ ਆਮਦਨ · Interest income</td><td class="num">' + fmt(vyaj) + '</td></tr>' +
    '<tr><td>ਅਸਲ ਖਰਚੇ · Real costs <span class="en">(ਨਿੱਜੀ ਬਾਹਰ · personal excluded)</span></td><td class="num">' + fmt(realCosts) + '</td></tr>' +
    '<tr><td><b>ਸ਼ੁੱਧ ਨਫ਼ਾ · Net profit</b></td><td class="num"><b style="color:' + (net >= 0 ? 'var(--green-d)' : 'var(--red)') + '">' + fmt(net) + '</b></td></tr>' +
    '</table></div>' +
    (cropRows ? '<h3 style="margin-top:10px">ਫਸਲ-ਵਾਰ ਦਾਮੀ ਘੱਟ ਬਰਦਾਨਾ · Per crop: commission minus bardana</h3>' +
      '<p class="hint">ਸਿਰਫ਼ ਬਰਦਾਨਾ ਘਟਾਇਆ · only bardana deducted — ਹੋਰ ਖਰਚੇ ਸ਼ਾਮਲ ਨਹੀਂ · other costs not included</p>' +
      '<div class="tblwrap"><table><tr><th>ਫਸਲ · Crop</th><th class="num">ਦਾਮੀ · Commission</th><th class="num">ਬਰਦਾਨਾ · Bardana</th><th class="num">ਦਾਮੀ − ਬਰਦਾਨਾ</th></tr>' + cropRows + '</table></div>' : '') +

    '<h3 style="margin-top:14px">③ 🧾 ਖਰਚ ਰਜਿਸਟਰ · Expense register <button class="btn btn-g btn-xs" onclick="openExpenseForm(false)" style="margin-left:6px">＋ ਖਰਚਾ · Add expense</button></h3>' +
    (expLineRows
      ? '<div class="tblwrap"><table><tr><th>ਮਿਤੀ · Date</th><th>ਵੇਰਵਾ · Details</th><th class="num">ਰਕਮ · Amount</th></tr>' + expLineRows + '</table></div>' +
        ((catRows || personalOut)
          ? '<div class="tblwrap"><table style="margin-top:8px"><tr><th>ਕਿਸਮ · Category</th><th class="num">ਰਕਮ · Amount</th></tr>' + catRows +
            '<tr><td><b>ਕੁੱਲ ਅਸਲ ਖਰਚੇ · Total real costs</b></td><td class="num"><b>' + fmt(realCosts) + '</b></td></tr>' +
            (personalOut ? '<tr><td>ਨਿੱਜੀ · Personal <span class="en">(not a cost)</span></td><td class="num">' + fmt(personalOut) + '</td></tr>' : '') +
            '</table></div>'
          : '')
      : '<div class="empty-state"><div class="es-big">💸</div><div class="es-title">ਕੋਈ ਖਰਚਾ ਨਹੀਂ · No expenses</div></div>') +

    '<h3 style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>④ 🧺 ਬਰਦਾਨਾ ਮਿਲਾਨ · Bardana tally</span><button class="btn btn-g btn-sm" onclick="openBardanaForm()">＋ ਬਰਦਾਨਾ ਐਂਟਰੀ · Bardana entry</button></h3>' +
    '<div class="grid2">' +
    stat(bb.purchase, 'ਖਰੀਦ · <em>Purchased</em>') +
    stat(bb.issue, 'ਦਿੱਤਾ · <em>Issued</em>') +
    stat(bb.return, 'ਵਾਪਸ · <em>Returned</em>') +
    stat('<b>' + bb.bal + '</b>', '<b>ਹੱਥ ਵਿੱਚ · In hand</b>') +
    '</div>' +
    (bRows ? '<div class="tblwrap"><table><tr><th>ਮਿਤੀ · Date</th><th>ਕਿਸਮ · Type</th><th class="num">ਬੋਰੀਆਂ · Bags</th><th>ਪਾਰਟੀ · Party</th></tr>' + bRows + '</table></div>' : '') +
  '</div>';
}
/* P1.8: live bardana stock = ਖਰੀਦ + ਵਾਪਸ − ਦਿੱਤਾ (purchases + returns − issues) */
function bardanaStock(){
  /* Batch B #8: agency-issued bags ('agency') add to stock; unused returns
     to the government buyer ('agencyback') reduce it, guard-blocked like issues */
  return activeBardana().reduce((s, b) =>
    s + (b.kind === 'purchase' || b.kind === 'return' || b.kind === 'agency' ? (b.qty || 0) : (b.kind === 'issue' || b.kind === 'agencyback') ? -(b.qty || 0) : 0), 0);
}
/* Batch B #8: post an issued bag count onto a heap. Government heap → bag
   count rides onto the heap for govt dues (₹/bag usage charge,
   h.bardana (₹) stays 0 so the charge is never double-counted); private
   heap → ₹ charge at the usage rate into the heap's bardana, which flows
   into the buyer's dues. Returns the audit suffix. */
function linkBardanaToHeap(h, q){
  const isGovt = (h.payerSnap || payerType(buyer(h.buyerId))) === 'government';
  if(isGovt){
    h.bardanaBags = (h.bardanaBags || 0) + q; /* h.bardana (₹) stays 0 — no double count */
    return ' · ਢੇਰ #' + h.n + ' → ਸਰਕਾਰੀ ਬਕਾਇਆ · govt dues';
  }
  const chg = r1(q * (S().bardanaRate || 0));
  h.bardana = r1((h.bardana || 0) + chg);
  return ' · ਢੇਰ #' + h.n + ' → ਵਪਾਰੀ ਖਰਚ ' + fmt(chg) + ' · buyer dues';
}
function openBardanaForm(){
  /* Batch B #8: agency-issued bardana — 'agency' = bags received from the
     agency (stock in), 'agencyback' = unused bags returned (stock out,
     guard-blocked like issues). Issuing against a heap posts the charge:
     government heap → bag count onto the heap for govt dues
     (₹/bag usage charge, billable in the ਦਾਮੀ tab); private heap → ₹ into
     the heap's bardana charge, which flows into the buyer's dues. */
  const heapOpts = '<option value="">— ਕੋਈ ਢੇਰ ਨਹੀਂ · No heap —</option>' + DB.heaps.filter(h => inActiveSeason(h) && !h.voided)
    .sort((a, b) => b.n - a.n).map(h => '<option value="' + h.id + '">ਢੇਰ #' + h.n + ' · ' + esc(cropKey(h.crop)) + ' · ' + esc(farmer(h.farmerId).name) + '</option>').join('');
  openModal('🧺 ਬਰਦਾਨਾ ਐਂਟਰੀ · Bardana entry · ਸਟਾਕ: ' + bardanaStock() + ' ਬੋਰੀਆਂ',
    '<div class="row2">' + F('ਕਿਸਮ · Type', SEL('b_kind', [['purchase','ਖਰੀਦ · Purchased'],['issue','ਦਿੱਤਾ · Issued'],['return','ਵਾਪਸ · Returned'],
      ['agency','ਸਰਕਾਰੀ ਤੋਂ ਮਿਲਿਆ · From government'],['agencyback','ਸਰਕਾਰੀ ਨੂੰ ਵਾਪਸ · Back to government']], 'purchase', "bardanaKindToggle()")) +
    F('ਮਿਤੀ · Date', IN('b_date', todayStr(), 'date')) + '</div>' +
    '<div class="row2">' + F('ਬੋਰੀਆਂ · Bags', ZIN('b_qty', '')) + F('ਪਾਰਟੀ · Party', IN('b_party', '', 'text', 'ਕਿਸਾਨ/ਦੁਕਾਨ/ਸਰਕਾਰੀ · farmer/shop/government')) + '</div>' +
    '<div id="b_heapwrap" style="display:none">' + F('ਢੇਰ · Heap (Optional)', '<select id="b_heap">' + heapOpts + '</select>',
      'ਸਰਕਾਰੀ ਢੇਰ → ਬੋਰੀਆਂ ਸਰਕਾਰੀ ਬਕਾਇਆ ਵਿੱਚ · ਪ੍ਰਾਈਵੇਟ ਢੇਰ → ₹' + (S().bardanaRate || 0) + '/ਬੋਰੀ ਵਪਾਰੀ ਦੇ ਖਰਚ ਵਿੱਚ') + '</div>' +
    F('ਨੋਟ · Note', IN('b_note', '', 'text', '')),
    'ਸੇਵ · Save', () => {
      const q = Math.round(vn('b_qty')); if(!(q > 0)){ msgAlert('ਬੋਰੀਆਂ ਜ਼ਰੂਰੀ · Bags required'); return false; }
      const d = v('b_date') || todayStr(); if(isLocked(d)) return lockAlert();
      const kind = v('b_kind');
      /* P1.8: can't issue/return more bags than are in stock — the munim's
         count is the truth, and silently driving it negative hides real shortages */
      if((kind === 'issue' || kind === 'agencyback') && q > bardanaStock()){
        msgAlert('⛔ ਸਟਾਕ ਘੱਟ ਹੈ · Not enough stock\nਸਟਾਕ: ' + bardanaStock() + ' ਬੋਰੀਆਂ · ਮੰਗ: ' + q + ' ਬੋਰੀਆਂ\nਪਹਿਲਾਂ ਖਰੀਦ/ਸਰਕਾਰੀ ਐਂਟਰੀ ਦਰਜ ਕਰੋ · Record a purchase/government receipt first.');
        return false;
      }
      if(guardStore()) return false;
      /* Batch C M11: future-date warning. */
      futureWarn(d, () => {
      const rec = {id:DB.seq.bardana++, date:d, kind, qty:q, party:v('b_party').trim(), note:v('b_note').trim()};
      let extra = '';
      if(kind === 'issue' && $('#b_heap') && +v('b_heap') > 0){
        const h = DB.heaps.find(x => x.id === +v('b_heap'));
        if(h){ rec.heapId = h.id; extra = linkBardanaToHeap(h, q); }
      }
      DB.bardana.push(rec);
      audit('🧺 ਬਰਦਾਨਾ · Bardana', kind + ' · ' + q + extra);
      save(); closeModal(); renderLagat();
      return true;
      });
    });
  bardanaKindToggle();
}
function bardanaKindToggle(){
  const w = document.getElementById('b_heapwrap');
  if(w) w.style.display = v('b_kind') === 'issue' ? '' : 'none';
}

/* ---------------- settings ---------------- */
/* Crop-wise settings: one crop's inputs visible at a time, with a tab for
   each of the ACTIVE season's crops (v1.1 #3: reverts Batch C M13 — during
   wheat season only wheat shows, not all four). Per-crop storage (cropCfg
   keyed by Punjabi crop name) is untouched — this is display only. No
   section headers: the inputs stand on their own. */
let CROP_TAB = 0;
function cropSettingsCard(){
  const entries = activeCropEntries();
  if(CROP_TAB >= entries.length) CROP_TAB = 0;
